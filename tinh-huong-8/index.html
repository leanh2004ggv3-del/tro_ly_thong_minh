<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Em xử lí tình huống – HĐTN, HN 8</title>
<style>
:root{
  --nen1:#eef4ff; --nen2:#fff4ea; --chu:#1e293b; --chu2:#475569; --kinh:rgba(255,255,255,.82); --vien:rgba(148,163,184,.35);
  --chinh:#4f46e5; --nhan1:#f97316; --nhan2:#0ea5e9; --dung:#16a34a; --dung-nen:#dcfce7; --sai:#dc2626; --sai-nen:#fee2e2;
  --cd:#4f46e5; --bong:0 10px 30px rgba(30,41,59,.12);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--chu);min-height:100vh;
  background:radial-gradient(circle at 10% 0%,#dbe7ff 0,transparent 45%),radial-gradient(circle at 95% 15%,#ffe4cc 0,transparent 40%),linear-gradient(160deg,var(--nen1),var(--nen2));}
button{font-family:inherit;cursor:pointer}
.dau{display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo h1{margin:0;font-size:26px;letter-spacing:.5px;background:linear-gradient(90deg,#4f46e5,#ec4899,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.logo small{display:block;color:var(--chu2);font-weight:600;font-size:13px}
.dau .phai{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--kinh);border:1px solid var(--vien);font-weight:700;font-size:14px}
.nut{border:0;border-radius:14px;padding:11px 18px;min-height:44px;font-weight:800;font-size:16px;color:#fff;
  background:linear-gradient(135deg,var(--cd),#ec4899);box-shadow:0 6px 16px rgba(79,70,229,.28);transition:transform .15s,box-shadow .15s}
.nut:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(79,70,229,.32)}
.nut:active{transform:translateY(1px) scale(.98)}
.nut.phu{background:var(--kinh);color:var(--chu);border:1px solid var(--vien);box-shadow:none}
.nut.nho{padding:7px 12px;min-height:38px;font-size:14px}
.nut[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.nhap{margin:0 22px 8px;padding:7px 14px;border-radius:12px;background:#fff7d6;border:1px dashed #eab308;color:#854d0e;font-weight:700;font-size:14px;text-align:center}
main{padding:6px 22px 40px;max-width:1360px;margin:0 auto}
.kinh{background:var(--kinh);border:1px solid var(--vien);border-radius:20px;box-shadow:var(--bong);backdrop-filter:blur(6px)}
.hien{animation:hien .3s ease}
@keyframes hien{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes noi{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rung{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.khong-hieu-ung *{animation:none!important;transition:none!important}
/* trang chủ */
.anh-hung{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding:22px;align-items:center}
.anh-hung h2{font-size:34px;margin:0 0 6px;line-height:1.15}
.anh-hung p{color:var(--chu2);font-size:17px;margin:6px 0 14px;line-height:1.5}
.o-ma{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.o-ma input{font-size:18px;padding:11px 14px;border-radius:14px;border:2px solid #c7d2fe;min-width:200px;font-weight:700}
.o-ma .goi-y{width:100%;font-size:13px;color:var(--chu2)}
.canh-bao-ma{color:var(--sai);font-weight:700;font-size:14px;width:100%}
.luoi-cd{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:18px}
.the-cd{position:relative;padding:16px;border-radius:20px;cursor:pointer;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--m) 12%,#fff));border:2px solid color-mix(in srgb,var(--m) 30%,transparent);box-shadow:var(--bong);transition:transform .18s}
.the-cd:hover{transform:translateY(-4px)}
.the-cd .bieu{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,var(--m),color-mix(in srgb,var(--m) 55%,#fff));box-shadow:0 6px 14px color-mix(in srgb,var(--m) 40%,transparent)}
.the-cd h3{margin:12px 0 2px;font-size:19px}
.the-cd .nho{color:var(--chu2);font-size:13px;font-weight:600}
.thanh{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:10px}
.thanh i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--m),#22c55e)}
/* chủ đề */
.tieu-de-cd{display:flex;align-items:center;gap:14px;padding:16px 20px;margin-bottom:16px}
.tieu-de-cd .bieu{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:var(--cd);color:#fff}
.tieu-de-cd h2{margin:0;font-size:26px}
.luoi-th{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.the-th{border-radius:18px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:var(--bong);border:2px solid transparent;transition:transform .18s,border-color .18s}
.the-th:hover{transform:translateY(-4px);border-color:var(--cd)}
.the-th svg{display:block;width:100%;height:auto}
.the-th .ben{padding:10px 14px 14px}
.the-th h3{margin:4px 0;font-size:18px}
.huy{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--cd) 14%,#fff);color:var(--cd)}
.huy.xong{background:var(--dung-nen);color:var(--dung)}
.huy.at{background:#ffedd5;color:#c2410c}
/* màn tình huống */
.man-th{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.khung-canh{padding:14px}
.khung-canh svg{width:100%;height:auto;border-radius:14px;display:block}
.khung-canh h2{margin:12px 4px 4px;font-size:24px}
.tom{font-size:17px;line-height:1.6;margin:6px 4px 4px}
.an-toan{margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:2px solid #fb923c;font-weight:700;color:#9a3412;display:flex;gap:10px;align-items:center}
.an-toan b{font-size:26px}
.bang-nv{padding:18px}
.cham{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.cham span{padding:5px 12px;border-radius:99px;font-weight:800;font-size:13px;background:#e2e8f0;color:#64748b}
.cham span.dang{background:var(--cd);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--cd) 25%,transparent)}
.cham span.da{background:var(--dung-nen);color:var(--dung)}
.hoi{font-size:20px;font-weight:800;margin:4px 0 12px;line-height:1.4}
.pa{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:16px;border:2px solid #e2e8f0;background:#fff;font-size:16.5px;line-height:1.45;color:var(--chu);transition:transform .12s,border-color .12s,background .2s}
.pa:hover{border-color:var(--cd);transform:translateX(3px)}
.pa .chu-cai{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;background:linear-gradient(135deg,var(--cd),#ec4899)}
.pa.dung{border-color:var(--dung);background:var(--dung-nen)}
.pa.dung .chu-cai{background:var(--dung)}
.pa.sai{border-color:var(--sai);background:var(--sai-nen);animation:rung .35s}
.pa.sai .chu-cai{background:var(--sai)}
.pa.chon{border-color:var(--cd);background:color-mix(in srgb,var(--cd) 10%,#fff)}
.pa .giai{display:block;margin-top:6px;font-size:14.5px;font-weight:600}
.pa.dung .giai{color:#166534}.pa.sai .giai{color:#991b1b}
.loi-bao{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:700;display:flex;gap:12px;align-items:center}
.loi-bao.tot{background:var(--dung-nen);color:#166534}
.loi-bao.chua{background:var(--sai-nen);color:#991b1b}
.hang-nut{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
/* phân loại */
.kho{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border-radius:14px;background:#f1f5f9;border:2px dashed #cbd5e1;margin-bottom:12px}
.the-pl{padding:9px 12px;border-radius:12px;background:#fff;border:2px solid #cbd5e1;font-weight:700;font-size:15px;cursor:grab;user-select:none;box-shadow:0 3px 8px rgba(0,0,0,.06)}
.the-pl.chon{border-color:var(--cd);box-shadow:0 0 0 4px color-mix(in srgb,var(--cd) 25%,transparent)}
.the-pl.dung{border-color:var(--dung);background:var(--dung-nen)}
.the-pl.sai{border-color:var(--sai);background:var(--sai-nen);animation:rung .35s}
.the-pl small{display:block;font-weight:600;font-size:12.5px;margin-top:3px}
.thung-hang{display:grid;gap:10px}
.thung{border-radius:16px;padding:10px;min-height:120px;background:#fff;border:2px solid var(--tm);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.thung h4{margin:0 0 4px;padding:6px 10px;border-radius:10px;color:#fff;background:var(--tm);font-size:15px;text-align:center}
.thung.sang{box-shadow:0 0 0 4px color-mix(in srgb,var(--tm) 30%,transparent)}
/* xếp bước */
.xep{list-style:none;padding:0;margin:0;position:relative}
.xep:before{content:"";position:absolute;left:24px;top:20px;bottom:20px;width:4px;border-radius:4px;background:linear-gradient(var(--cd),#ec4899,#f97316)}
.xep li{position:relative;display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px 10px 10px 8px;border-radius:14px;background:#fff;border:2px solid #e2e8f0;font-size:16px;font-weight:600;cursor:grab}
.xep li .so{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;background:var(--cd);z-index:1;box-shadow:0 0 0 4px #fff}
.xep li .chu{flex:1}
.xep li .mui{display:flex;flex-direction:column;gap:2px}
.xep li .mui button{border:0;border-radius:8px;width:34px;height:26px;background:#eef2ff;font-weight:900;color:var(--cd)}
.xep li.dung{border-color:var(--dung);background:var(--dung-nen)}.xep li.dung .so{background:var(--dung)}
.xep li.sai{border-color:var(--sai);background:var(--sai-nen)}.xep li.sai .so{background:var(--sai)}
.xep li.keo{opacity:.4}
/* ngân sách */
.ns{display:grid;grid-template-columns:1fr 210px;gap:14px;align-items:center}
.thu-nhap{padding:10px 14px;border-radius:14px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);font-weight:800;margin-bottom:10px}
.dong-ns{margin:10px 0}
.dong-ns label{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px}.dong-ns label>span:last-child{white-space:nowrap}
.dong-ns input{width:100%;accent-color:var(--mm);height:26px}
.dong-ns .tien{color:var(--chu2);font-weight:700}
.tong{margin-top:6px;padding:10px 14px;border-radius:12px;font-weight:900;text-align:center;font-size:17px}
.tong.ok{background:var(--dung-nen);color:var(--dung)}.tong.vuot{background:var(--sai-nen);color:var(--sai)}.tong.thieu{background:#fef9c3;color:#a16207}
.tieu-chi{list-style:none;padding:0;margin:10px 0 0;font-weight:700;font-size:15px}
.tieu-chi li{margin:4px 0}
/* lời của em */
.loi-em textarea{width:100%;min-height:120px;font-size:17px;padding:12px;border-radius:14px;border:2px solid #c7d2fe;font-family:inherit}
.cu{display:flex;gap:12px;align-items:flex-end}
.cu .bong-noi{flex:1;padding:12px 16px;border-radius:18px 18px 18px 4px;background:#eef2ff;font-weight:700;font-size:16px;line-height:1.45}
.cu svg{flex:none;animation:noi 3s ease-in-out infinite}
.hoan-thanh{text-align:center;padding:24px}
.sao{font-size:46px;letter-spacing:6px}
/* giáo viên */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:12px 0}
.kpi div{padding:16px;border-radius:18px;background:#fff;box-shadow:var(--bong);border-top:6px solid var(--k)}
.kpi b{display:block;font-size:36px;color:var(--k)}
.kpi span{color:var(--chu2);font-weight:700}
.thu{position:relative;height:300px}
.thu canvas{position:absolute;inset:0;width:100%;height:100%}
.bang-sai{width:100%;border-collapse:collapse;font-size:15px}
.bang-sai td,.bang-sai th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}
.dai-thu{background:repeating-linear-gradient(45deg,#fde68a,#fde68a 12px,#fef3c7 12px,#fef3c7 24px);color:#92400e;font-weight:900;text-align:center;padding:8px;border-radius:12px;margin-bottom:10px;letter-spacing:2px}
.nut-video{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;border:0;background:rgba(15,23,42,.72);color:#fff;font-size:34px;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .15s}
.nut-video:hover{transform:translate(-50%,-50%) scale(1.08)}
.khung-tranh{position:relative}
.nhan-video{position:absolute;right:12px;bottom:12px;padding:6px 12px;border-radius:999px;background:#fff;font-weight:800;font-size:14px;color:var(--cd);box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none}
#hopVideo{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.82);display:none;align-items:center;justify-content:center;padding:20px}
#hopVideo.mo{display:flex}
#hopVideo .ben{width:min(1100px,100%);background:#0f172a;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#hopVideo video{display:block;width:100%;max-height:78vh;background:#000}
#hopVideo .dong{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#e2e8f0;font-weight:700;gap:10px}
#phao{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
/* chiếu TV */
body.tv{font-size:19px}
body.tv .hoi{font-size:27px}
body.tv .pa{font-size:22px;padding:16px}
body.tv .pa .chu-cai{width:52px;height:52px;font-size:28px}
body.tv .tom{font-size:21px}
body.tv .xep li,body.tv .the-pl{font-size:20px}
body.tv .khung-canh h2{font-size:30px}
@media (max-width:620px){.thung-hang{grid-template-columns:repeat(2,1fr)!important}.pa{font-size:15.5px}.hoi{font-size:18px}.anh-hung h2{font-size:27px}}
@media (max-width:900px){.man-th,.anh-hung,.ns{grid-template-columns:1fr}.logo h1{font-size:21px}main{padding:6px 12px 30px}.dau{padding:10px 12px}.nhap{margin:0 12px 8px}}
</style>
</head>
<body>

  <linearGradient id="gTroi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
  <linearGradient id="gTuong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
  <linearGradient id="gTuong2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
  <linearGradient id="gHong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
  <linearGradient id="gCo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#22c55e"/></linearGradient>

</defs></svg>

<header class="dau">
  <div class="logo" onclick="diToi('trang-chu')" title="Về trang chủ">
    <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="#4f46e5"/><path d="M12 30c0-8 6-14 14-14s14 6 14 14" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/><circle cx="19" cy="30" r="5" fill="#fff"/><circle cx="33" cy="30" r="5" fill="#fff"/><circle cx="19" cy="30" r="2.4" fill="#1e293b"/><circle cx="33" cy="30" r="2.4" fill="#1e293b"/><path d="M24 36l2 3 2-3z" fill="#f97316"/></svg>
    <div><h1>EM XỬ LÍ TÌNH HUỐNG</h1><small>Hoạt động trải nghiệm, hướng nghiệp 8 · 33 tình huống SGK</small></div>
  </div>
  <div class="phai">
    <span class="chip" id="chipMa">👤 Chưa nhập mã</span>

    <button class="nut phu nho" id="nutTV" onclick="doiTV()">📺 Chiếu TV</button>

<div class="nhap">✅ BẢN NHÁP — thầy/cô duyệt trước khi dùng · Nội dung bám SGK HĐTN, HN 8 (Kết nối tri thức); phương án và lời giải thích do trợ lý soạn theo phần Gợi ý của SGK</div>

<script>
"use strict";
var DL = {"chu_de": [{"cd": 1, "ten": "Em với nhà trường", "mau": "#3b82f6", "icon": "🏫", "trang": "SGK tr.7–9"}, {"cd": 2, "ten": "Khám phá bản thân", "mau": "#8b5cf6", "icon": "🔍", "trang": "SGK tr.15–19"}, {"cd": 3, "ten": "Trách nhiệm với bản thân", "mau": "#f97316", "icon": "🎯", "trang": "SGK tr.22–27"}, {"cd": 4, "ten": "Rèn luyện bản thân", "mau": "#10b981", "icon": "💪", "trang": "SGK tr.30–35"}, {"cd": 5, "ten": "Em với gia đình", "mau": "#ec4899", "icon": "🏡", "trang": "SGK tr.38–41"}], "tinh_huong": [{"cd": 1, "trang": "tr.7", "nhan": "Tình huống 1", "ten": "Minh Hà muốn kết bạn", "canh": {"nen": "lop", "nguoi": [{"x": 120, "ao": "#ec4899", "toc": "dai", "cam": "lo"}, {"x": 270, "ao": "#a855f7", "toc": "buoc", "cam": "vui"}], "vat": [["giay", 190, 205]], "loi": []}, "tom": "Minh Hà vẽ rất đẹp nhưng nhút nhát, ngại giao tiếp. Minh Hà muốn kết bạn với Hồng Ánh vì hai bạn có nhiều điểm chung.", "nv": [{"loai": "chon", "hoi": "Minh Hà nên làm gì?", "chon": [{"t": "Mạnh dạn bắt chuyện về sở thích chung, rủ Hồng Ánh cùng vẽ hoặc tham gia một hoạt động.", "d": 1, "g": "Chủ động, tự tin làm quen là cách xây dựng tình bạn (SGK tr.6)."}, {"t": "Chờ Hồng Ánh bắt chuyện trước.", "d": 0, "g": "Có thể chờ mãi; nên chủ động."}, {"t": "Nhờ bạn khác nói hộ là mình muốn làm bạn.", "d": 0, "g": "Tự nói sẽ chân thành hơn."}, {"t": "Thôi, vì mình nhút nhát.", "d": 0, "g": "Mạnh dạn một chút sẽ có thêm bạn."}]}], "loi": "Em đã làm quen với một người bạn thân như thế nào?", "id": "c1-t1"}, {"cd": 1, "trang": "tr.7", "nhan": "Tình huống 2", "ten": "Nghe nói Khanh nói xấu mình", "canh": {"nen": "santruong", "nguoi": [{"x": 130, "ao": "#3b82f6", "toc": "ngan", "cam": "buon"}, {"x": 230, "ao": "#f97316", "toc": "ngan", "cam": "binh"}, {"x": 320, "ao": "#22c55e", "toc": "ngan", "cam": "binh"}], "vat": [], "loi": []}, "tom": "Minh buồn vì một bạn kể rằng nghe Khanh nói xấu Minh.", "nv": [{"loai": "chon", "hoi": "Minh nên làm gì?", "chon": [{"t": "Bình tĩnh, gặp riêng Khanh hỏi và trao đổi thẳng thắn để tránh hiểu lầm.", "d": 1, "g": "Trao đổi thẳng thắn khi hiểu lầm giúp giữ tình bạn (SGK tr.6)."}, {"t": "Nói xấu lại Khanh.", "d": 0, "g": "Trả đũa làm mâu thuẫn tăng."}, {"t": "Không chơi với Khanh nữa.", "d": 0, "g": "Chưa rõ thực hư đã cắt đứt là vội vàng."}, {"t": "Đăng lên mạng kể tội Khanh.", "d": 0, "g": "Làm sự việc tệ hơn."}]}], "loi": "Khi nghe người khác kể lại lời không hay về mình, em làm gì?", "id": "c1-t2"}, {"cd": 1, "trang": "tr.7", "nhan": "Tình huống 3", "ten": "Bạn thân sắp chuyển trường", "canh": {"nen": "santruong", "nguoi": [{"x": 150, "ao": "#ec4899", "toc": "dai", "cam": "buon"}, {"x": 260, "ao": "#eab308", "toc": "buoc", "cam": "buon"}], "vat": [["hop-qua", 205, 215]], "loi": []}, "tom": "Hiền buồn vì người bạn thân sắp chuyển trường.", "nv": [{"loai": "chon", "hoi": "Hiền có thể làm gì để giữ gìn tình bạn?", "chon": [{"t": "Dành thời gian bên bạn, làm một món quà hoặc đoạn phim kỉ niệm, hẹn giữ liên lạc.", "d": 1, "g": "Những việc làm giữ gìn tình bạn (SGK tr.7)."}, {"t": "Tránh mặt bạn cho đỡ buồn.", "d": 0, "g": "Bỏ lỡ thời gian quý còn lại bên nhau."}, {"t": "Giận bạn vì bỏ mình đi.", "d": 0, "g": "Chuyển trường thường do hoàn cảnh gia đình."}, {"t": "Thôi không liên lạc nữa.", "d": 0, "g": "Ở xa vẫn có thể giữ tình bạn."}]}], "loi": "Em sẽ viết điều gì muốn nói với bạn thân của mình?", "id": "c1-t3"}, {"cd": 1, "trang": "tr.9", "nhan": "Tình huống 1", "ten": "Bị doạ đăng ảnh", "canh": {"nen": "mang", "nguoi": [{"x": 110, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}], "vat": [["canh-bao", 330, 60]], "loi": []}, "tom": "Khi cả nhóm họp trực tuyến, Thành chụp lại ảnh Minh với biểu cảm không đẹp, rồi doạ sẽ đưa lên trang mạng xã hội của lớp nếu Minh không cho chép bài.", "nv": [{"loai": "chon", "hoi": "Minh nên làm gì?", "chon": [{"t": "Không cho chép bài, không trả lời tin nhắn đe doạ; lưu lại bằng chứng và kể ngay với thầy cô, cha mẹ.", "d": 1, "g": "Đúng bảng Nên của SGK: kể với người tin tưởng, không trả lời tin nhắn đe doạ."}, {"t": "Cho Thành chép bài để yên chuyện.", "d": 0, "g": "Chiều theo người bắt nạt thì họ sẽ đòi tiếp."}, {"t": "Doạ lại Thành.", "d": 0, "g": "Thể hiện hiếu chiến, thách thức là việc không nên làm."}, {"t": "Giấu kín vì xấu hổ.", "d": 0, "g": "Giấu giếm việc mình bị bắt nạt là không nên."}]}], "loi": "Nếu bạn em bị doạ đăng ảnh xấu lên mạng, em sẽ giúp bạn thế nào?", "an_toan": 1, "id": "c1-t4"}, {"cd": 1, "trang": "tr.9", "nhan": "Tình huống 2", "ten": "Bị trêu đùa ác ý", "canh": {"nen": "lop", "nguoi": [{"x": 140, "ao": "#3b82f6", "toc": "ngan", "cam": "cuoi"}, {"x": 250, "ao": "#ec4899", "toc": "dai", "cam": "buon"}], "vat": [], "loi": [[140, 40, "Ha ha, lại ngồi đây à?"]]}, "tom": "Duy Anh thường trêu đùa ác ý với Hạnh. Hạnh đã chuyển chỗ ngồi nhưng Duy Anh vẫn sang bàn trêu.", "nv": [{"loai": "chon", "hoi": "Hạnh và các bạn trong lớp nên làm gì?", "chon": [{"t": "Hạnh thể hiện rõ thái độ không chấp nhận và kể với thầy cô, cha mẹ; các bạn khác không cười theo, lên tiếng giúp Hạnh.", "d": 1, "g": "Đúng bảng Nên của SGK; không giúp khi chứng kiến bạn bị bắt nạt là việc không nên."}, {"t": "Hạnh cố chịu, rồi sẽ hết.", "d": 0, "g": "Giấu giếm khiến việc bắt nạt kéo dài."}, {"t": "Hạnh trêu lại Duy Anh thật nặng.", "d": 0, "g": "Đáp trả hiếu chiến có thể làm xung đột lớn hơn."}, {"t": "Các bạn khác cười cho vui.", "d": 0, "g": "Cổ vũ người bắt nạt."}]}], "loi": "Lớp em có thể làm gì để “Lớp học không có bắt nạt”?", "an_toan": 1, "id": "c1-t5"}, {"cd": 1, "trang": "tr.9", "nhan": "Tình huống 3", "ten": "Bị chặn đường đòi tiền", "canh": {"nen": "duonglang", "nguoi": [{"x": 120, "ao": "#1e293b", "toc": "ngan", "cam": "gian"}, {"x": 210, "ao": "#0ea5e9", "toc": "ngan", "cam": "lo"}, {"x": 300, "ao": "#1e293b", "toc": "ngan", "cam": "gian"}], "vat": [], "loi": []}, "tom": "Đức Anh là học sinh mới chuyển đến. Một nhóm học sinh thường chặn đường, đòi Đức Anh những thứ vô lí, đòi tiền ăn sáng và lục cặp của bạn.", "nv": [{"loai": "chon", "hoi": "Đức Anh nên làm gì?", "chon": [{"t": "Bỏ đi hoặc kêu to nhờ trợ giúp; không thách thức; kể ngay với thầy cô, cha mẹ.", "d": 1, "g": "Đúng bảng Nên của SGK tr.8."}, {"t": "Đưa tiền cho xong chuyện.", "d": 0, "g": "Nhóm bắt nạt sẽ tiếp tục đòi."}, {"t": "Rủ bạn đến đánh lại nhóm đó.", "d": 0, "g": "Bạo lực làm sự việc nguy hiểm hơn."}, {"t": "Im lặng vì mình là học sinh mới.", "d": 0, "g": "Cần báo người lớn để được bảo vệ."}]}], "loi": "Em biết những dấu hiệu nào của bắt nạt học đường?", "an_toan": 1, "id": "c1-t6"}, {"cd": 2, "trang": "tr.15", "nhan": "Hoạt động 2", "ten": "Minh hết giận Khoa", "canh": {"nen": "duonglang", "nguoi": [{"x": 140, "ao": "#3b82f6", "toc": "ngan", "cam": "gian"}, {"x": 260, "ao": "#22c55e", "toc": "ngan", "cam": "lo"}], "vat": [["xe-dap", 320, 205]], "loi": []}, "tom": "Minh và Khoa hẹn nhau đi thăm bạn ốm. Khoa đến trễ 15 phút, Minh rất bực bội. Nhưng khi thấy Khoa mồ hôi nhễ nhại, dắt chiếc xe đạp xẹp lốp, cơn giận của Minh tan biến, Minh thấy thương bạn.", "nv": [{"loai": "xep", "hoi": "Sắp xếp diễn biến cảm xúc của Minh.", "buoc": ["Hai bạn hẹn nhau đi thăm bạn ốm", "Khoa đến trễ 15 phút, Minh bực bội", "Minh thấy Khoa mồ hôi nhễ nhại, dắt xe xẹp lốp", "Cơn giận tan biến, Minh thương bạn"]}, {"loai": "chon", "hoi": "Điều gì giúp Minh điều chỉnh cảm xúc?", "chon": [{"t": "Hiểu lí do của bạn trước khi trách.", "d": 1, "g": "Suy nghĩ lại sự việc tích cực giúp điều chỉnh cảm xúc (SGK tr.15)."}, {"t": "Khoa xin lỗi rất nhiều.", "d": 0, "g": "Minh hết giận khi hiểu hoàn cảnh của bạn."}, {"t": "Minh cố quên đi.", "d": 0, "g": "Minh hiểu ra lí do chứ không cố quên."}, {"t": "Thời gian trôi qua.", "d": 0, "g": "Cảm xúc đổi ngay khi Minh hiểu chuyện."}]}], "loi": "Kể một lần cảm xúc của em thay đổi khi hiểu ra lí do của người khác.", "id": "c2-t1"}, {"cd": 2, "trang": "tr.16", "nhan": "Tình huống 1", "ten": "Bài kiểm tra 5 điểm", "canh": {"nen": "lop", "nguoi": [{"x": 180, "ao": "#3b82f6", "toc": "ngan", "cam": "buon"}], "vat": [["giay", 250, 205]], "loi": [], "bang": "Ngữ văn 8"}, "tom": "Bình nghĩ bài kiểm tra Ngữ văn của mình ít nhất được 7 điểm, nhưng chỉ được 5 điểm. Bình cho rằng thầy chấm chặt, cảm thấy buồn và thất vọng.", "nv": [{"loai": "chon", "hoi": "Bình nên điều chỉnh cảm xúc thế nào?", "chon": [{"t": "Hít thở sâu cho bình tĩnh; xem lại bài, tìm chỗ sai; hỏi thầy những chỗ chưa hiểu; đặt mục tiêu cho bài sau.", "d": 1, "g": "Lấy lại bình tĩnh rồi suy nghĩ tích cực (SGK tr.15)."}, {"t": "Đổ lỗi cho thầy chấm chặt.", "d": 0, "g": "Đổ lỗi không giúp Bình tiến bộ."}, {"t": "Xé bài kiểm tra cho đỡ tức.", "d": 0, "g": "Hành động tiêu cực."}, {"t": "Bỏ học Ngữ văn vì không có năng khiếu.", "d": 0, "g": "Suy nghĩ tiêu cực."}]}], "loi": "Khi điểm thấp hơn mong đợi, em làm gì?", "id": "c2-t2"}, {"cd": 2, "trang": "tr.16", "nhan": "Tình huống 2", "ten": "Hoa muốn làm báo tường", "canh": {"nen": "lop", "nguoi": [{"x": 130, "ao": "#ec4899", "toc": "dai", "cam": "chan"}, {"x": 260, "ao": "#3b82f6", "toc": "ngan", "cam": "binh"}], "vat": [["giay", 80, 205]], "loi": [[260, 40, "Hoa tập văn nghệ nhé!"]]}, "tom": "Hoa thích vẽ, đăng kí làm báo tường dịp 20-11. Nhưng lớp trưởng lại phân công Hoa tập văn nghệ. Hoa thấy khó chịu.", "nv": [{"loai": "chon", "hoi": "Hoa nên làm gì?", "chon": [{"t": "Bình tĩnh trao đổi với lớp trưởng về mong muốn của mình; nếu chưa đổi được thì vẫn hoàn thành phần việc được giao.", "d": 1, "g": "Điều chỉnh cảm xúc và cư xử có trách nhiệm."}, {"t": "Từ chối tập văn nghệ.", "d": 0, "g": "Bỏ việc chung vì không vừa ý."}, {"t": "Nói xấu lớp trưởng với các bạn.", "d": 0, "g": "Làm mâu thuẫn tăng."}, {"t": "Tập cho có lệ.", "d": 0, "g": "Ảnh hưởng tới tiết mục của lớp."}]}], "loi": "Khi được giao việc mình không thích, em làm thế nào?", "id": "c2-t3"}, {"cd": 2, "trang": "tr.18", "nhan": "Hoạt động 1", "ten": "Hùng thương thuyết với mẹ", "canh": {"nen": "nha", "nguoi": [{"x": 130, "ao": "#a855f7", "toc": "buoc", "cam": "lo", "vai": "nguoi-lon"}, {"x": 260, "ao": "#3b82f6", "toc": "ngan", "cam": "vui"}], "vat": [["bong", 320, 215]], "loi": [[260, 40, "Con thử 1 tháng thôi ạ!"]]}, "tom": "Hùng muốn tham gia câu lạc bộ bóng đá, mỗi tuần sinh hoạt một lần. Hùng thương thuyết với mẹ: xin thử một tháng, nếu ảnh hưởng đến học tập sẽ thôi.", "nv": [{"loai": "xep", "hoi": "Sắp xếp các bước thương thuyết của Hùng (SGK tr.18).", "buoc": ["Nêu yêu cầu cụ thể: tham gia CLB bóng đá, mỗi tuần một lần", "Lắng nghe mẹ, đưa ra thoả hiệp: xin thử một tháng", "Cam kết: nếu ảnh hưởng học tập sẽ thôi", "Chốt ý kiến hai mẹ con cùng đồng thuận"]}], "loi": "Em muốn thương thuyết với ai về việc gì? Em sẽ đưa ra thoả hiệp nào?", "id": "c2-t4"}, {"cd": 2, "trang": "tr.19", "nhan": "Hoạt động 2", "ten": "Đi dã ngoại bằng gì?", "canh": {"nen": "lop", "nguoi": [{"x": 110, "ao": "#3b82f6", "toc": "ngan", "cam": "binh"}, {"x": 200, "ao": "#ec4899", "toc": "dai", "cam": "binh"}, {"x": 290, "ao": "#22c55e", "toc": "ngan", "cam": "binh"}], "vat": [["xe-dap", 350, 205]], "loi": []}, "tom": "Lớp đi dã ngoại ở nơi cách trường khoảng 10 km. Một số bạn muốn thuê ô tô vì nhanh, an toàn; một số khác muốn đi xe đạp cho tiết kiệm.", "nv": [{"loai": "chon", "hoi": "Cách thương thuyết nào phù hợp?", "chon": [{"t": "Lắng nghe lí do hai bên; cùng tìm phương án dung hoà (VD thuê xe chung để giảm chi phí); xin ý kiến cô chủ nhiệm, phụ huynh rồi chốt phương án cả lớp đồng thuận.", "d": 1, "g": "Lắng nghe, thoả hiệp, tìm cách cả hai bên chấp nhận (SGK tr.18)."}, {"t": "Nhóm nào đông hơn thì quyết, không cần nghe nhóm kia.", "d": 0, "g": "Chưa lắng nghe, dễ mất đoàn kết."}, {"t": "Ai thích gì đi nấy.", "d": 0, "g": "Hoạt động chung cần thống nhất, đảm bảo an toàn."}, {"t": "Tranh cãi đến khi một bên chịu thua.", "d": 0, "g": "Tranh cãi gay gắt không phải thương thuyết."}]}], "loi": "Lớp em từng thương thuyết để chọn phương án nào chưa? Kết quả thế nào?", "id": "c2-t5"}, {"cd": 3, "trang": "tr.22", "nhan": "Hoạt động 1", "ten": "Ba bạn sống có trách nhiệm", "canh": {"nen": "santruong", "nguoi": [{"x": 110, "ao": "#3b82f6", "toc": "ngan", "cam": "vui"}, {"x": 210, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 310, "ao": "#22c55e", "toc": "ngan", "cam": "vui"}], "vat": [["sach", 160, 210]], "loi": []}, "tom": "Nam ham chơi điện tử, kết quả kiểm tra kém, thấy có lỗi với bố mẹ nên quyết tâm không chơi, dành thời gian ôn bài. Hạnh được rủ đi sinh nhật Lan nhưng mẹ ốm, bố đi làm xa, nên chúc mừng Lan trên lớp rồi về chăm mẹ. An được nhóm giao sưu tầm ảnh danh lam thắng cảnh, nhờ họ hàng, hàng xóm xin tạp chí, lịch cũ để hoàn thành.", "nv": [{"loai": "chon-nhieu", "hoi": "Chọn TẤT CẢ biểu hiện của sống có trách nhiệm.", "chon": [{"t": "Nam quyết tâm không chơi điện tử, dành thời gian ôn bài", "d": 1, "g": "Trách nhiệm với bản thân."}, {"t": "Hạnh chúc mừng Lan trên lớp rồi về chăm mẹ", "d": 1, "g": "Trách nhiệm với gia đình mà vẫn quan tâm bạn."}, {"t": "An nhờ mọi người giúp để hoàn thành phần việc", "d": 1, "g": "Trách nhiệm trong hoạt động chung."}, {"t": "Bỏ dở việc nhóm vì quá khó", "d": 0, "g": "Thiếu trách nhiệm."}, {"t": "Đi sinh nhật bạn dù mẹ đang ốm ở nhà", "d": 0, "g": "Chưa quan tâm đến gia đình."}]}], "loi": "Kể một việc em đã làm thể hiện trách nhiệm với bản thân hoặc mọi người.", "id": "c3-t1"}, {"cd": 3, "trang": "tr.23", "nhan": "Tình huống 1", "ten": "Cúc nghỉ ốm một tuần", "canh": {"nen": "lop", "nguoi": [{"x": 130, "ao": "#ec4899", "toc": "dai", "cam": "buon"}, {"x": 260, "ao": "#22c55e", "toc": "ngan", "cam": "vui"}], "vat": [["sach", 195, 205]], "loi": []}, "tom": "Cúc bị ốm phải nghỉ học một tuần, lực học yếu đi.", "nv": [{"loai": "chon", "hoi": "Là bạn cùng lớp, em sẽ làm gì?", "chon": [{"t": "Chép bài, giảng lại những phần Cúc nghỉ, rủ Cúc cùng học nhóm.", "d": 1, "g": "Trách nhiệm với bạn bè."}, {"t": "Để Cúc tự lo.", "d": 0, "g": "Thờ ơ với bạn gặp khó khăn."}, {"t": "Cho Cúc chép bài kiểm tra.", "d": 0, "g": "Gian lận không giúp bạn tiến bộ."}, {"t": "Chê Cúc học kém đi.", "d": 0, "g": "Làm bạn buồn."}]}], "loi": "Em đã giúp một bạn gặp khó khăn trong học tập như thế nào?", "id": "c3-t2"}, {"cd": 3, "trang": "tr.23", "nhan": "Tình huống 2", "ten": "Huy bị đau chân", "canh": {"nen": "duonglang", "nguoi": [{"x": 150, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}, {"x": 260, "ao": "#22c55e", "toc": "ngan", "cam": "vui"}], "vat": [["xe-dap", 330, 205]], "loi": []}, "tom": "Huy đá bóng bị đau chân, không tự đạp xe đến trường được. Nam ở gần nhà Huy.", "nv": [{"loai": "chon", "hoi": "Nam nên làm gì?", "chon": [{"t": "Chủ động chở hoặc đưa Huy đi học cho đến khi Huy khỏi.", "d": 1, "g": "Trách nhiệm, quan tâm tới bạn."}, {"t": "Chờ Huy nhờ mới giúp.", "d": 0, "g": "Nên chủ động khi thấy bạn cần."}, {"t": "Bảo Huy nghỉ học cho khỏi đi.", "d": 0, "g": "Nghỉ học ảnh hưởng việc học của Huy."}, {"t": "Thấy Huy đau chân thì trêu.", "d": 0, "g": "Thiếu tôn trọng bạn."}]}], "loi": "Em đã từng giúp bạn đến trường khi bạn gặp khó khăn chưa?", "id": "c3-t3"}, {"cd": 3, "trang": "tr.23", "nhan": "Tình huống 3", "ten": "Mai bị sốt", "canh": {"nen": "nha", "nguoi": [{"x": 170, "ao": "#ec4899", "toc": "buoc", "cam": "lo"}], "vat": [["hoa", 270, 210], ["lo-thuoc", 90, 215]], "loi": []}, "tom": "Mai được phân công mang lọ hoa trang trí lớp trong buổi sơ kết thi đua, nhưng sáng hôm đó Mai bị sốt.", "nv": [{"loai": "chon", "hoi": "Mai nên làm gì?", "chon": [{"t": "Báo ngay lớp trưởng hoặc cô chủ nhiệm, nhờ bạn mang lọ hoa thay, rồi nghỉ ngơi.", "d": 1, "g": "Có trách nhiệm với việc được giao và với sức khoẻ của mình."}, {"t": "Cố đi học để mang lọ hoa.", "d": 0, "g": "Đang sốt cần nghỉ; có thể nhờ bạn."}, {"t": "Ở nhà, không báo ai.", "d": 0, "g": "Lớp sẽ thiếu lọ hoa mà không biết."}, {"t": "Nhắn rằng mình quên.", "d": 0, "g": "Không trung thực."}]}], "loi": "Khi không thể làm việc được giao, em làm gì?", "id": "c3-t4"}, {"cd": 3, "trang": "tr.27", "nhan": "Tình huống 1", "ten": "Sinh nhật buổi tối", "canh": {"nen": "santruong", "nguoi": [{"x": 140, "ao": "#3b82f6", "toc": "ngan", "cam": "vui"}, {"x": 260, "ao": "#ec4899", "toc": "dai", "cam": "lo"}], "vat": [], "loi": [[140, 40, "Tối nay đi chúc mừng Hoa nhé!"]]}, "tom": "Nam rủ Mai buổi tối đến chúc mừng sinh nhật Hoa. Mai không muốn đi vào buổi tối vì sợ nguy hiểm.", "nv": [{"loai": "chon", "hoi": "Mai nên từ chối thế nào?", "chon": [{"t": "Từ chối, nói rõ lí do, đề xuất cách khác: gửi quà, chúc mừng Hoa trên lớp hoặc vào ban ngày.", "d": 1, "g": "Từ chối kèm phương án thay thế (SGK tr.26)."}, {"t": "Đồng ý đi cho Nam vui.", "d": 0, "g": "Làm điều mình thấy không an toàn."}, {"t": "Nói dối là bị ốm.", "d": 0, "g": "Không cần nói dối; nêu lí do thật."}, {"t": "Im lặng không trả lời.", "d": 0, "g": "Nên trả lời rõ ràng."}]}], "loi": "Em đã từng từ chối lời rủ của bạn như thế nào?", "id": "c3-t5"}, {"cd": 3, "trang": "tr.27", "nhan": "Tình huống 2", "ten": "Rủ tẩy chay bạn", "canh": {"nen": "lop", "nguoi": [{"x": 130, "ao": "#f97316", "toc": "ngan", "cam": "gian"}, {"x": 250, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}], "vat": [], "loi": [[130, 40, "Đừng chơi với Huy nữa!"]]}, "tom": "Long giận Huy, rủ Minh không chơi với Huy nữa.", "nv": [{"loai": "chon", "hoi": "Minh nên làm gì?", "chon": [{"t": "Từ chối: vẫn chơi với cả hai bạn; khuyên Long nói chuyện với Huy để làm lành.", "d": 1, "g": "Không tham gia cô lập bạn khác."}, {"t": "Nghe theo Long để Long không giận.", "d": 0, "g": "Cô lập bạn là một dấu hiệu bắt nạt."}, {"t": "Kể lại cho Huy để Huy giận Long.", "d": 0, "g": "Làm mâu thuẫn tăng."}, {"t": "Rủ thêm cả lớp không chơi với Huy.", "d": 0, "g": "Bắt nạt bằng cách cô lập."}]}], "loi": "Khi hai bạn của em giận nhau, em làm gì?", "id": "c3-t6"}, {"cd": 3, "trang": "tr.27", "nhan": "Tình huống 3", "ten": "Lời mời hút thuốc", "canh": {"nen": "nhavanhoa", "nguoi": [{"x": 140, "ao": "#f97316", "toc": "ngan", "cam": "cuoi"}, {"x": 260, "ao": "#22c55e", "toc": "ngan", "cam": "lo"}], "vat": [["canh-bao", 340, 70]], "loi": [[140, 35, "Thử đi! Cảm giác đặc biệt lắm!"]]}, "tom": "Ở sân nhà văn hoá, Sơn đưa thuốc lá cho Tuấn và nói: “Thử đi! Cảm giác đặc biệt lắm đấy”.", "nv": [{"loai": "chon", "hoi": "Tuấn nên từ chối thế nào?", "chon": [{"t": "Từ chối thẳng, dứt khoát: “Không, mình không hút” rồi rời đi; khuyên Sơn bỏ thuốc.", "d": 1, "g": "Tình huống có hại cho sức khoẻ: từ chối thẳng, dứt khoát (SGK tr.26)."}, {"t": "Thử một hơi cho biết.", "d": 0, "g": "Thuốc lá gây nghiện, hại sức khoẻ."}, {"t": "Cầm lấy rồi vứt đi khi Sơn không thấy.", "d": 0, "g": "Chưa từ chối rõ ràng."}, {"t": "Hẹn để lần khác.", "d": 0, "g": "Trì hoãn khiến Sơn tiếp tục mời."}]}], "loi": "Em sẽ nói gì nếu bị bạn rủ làm việc có hại cho sức khoẻ?", "id": "c3-t7"}, {"cd": 4, "trang": "tr.30", "nhan": "Hoạt động 1", "ten": "Áo khoác giảm 50%", "canh": {"dt": "Cửa hàng online", "tin": [["Áo khoác GIẢM 50%!", "do"], ["Mẫu mới nhất!", "vang"], ["Đăng kí nhận tư vấn", "xam"]], "nen": "mang", "nguoi": [{"x": 110, "ao": "#ec4899", "toc": "dai", "cam": "buon"}], "vat": [["quan-ao", 300, 220]], "loi": []}, "tom": "Hà xem quảng cáo áo khoác giảm giá 50% trên mạng xã hội, đăng kí thông tin. Nhân viên gọi điện tư vấn, Hà mua “mẫu mới nhất”. Khi nhận hàng, áo không giống quảng cáo và không đổi được. Hà rất thất vọng, tiếc tiền.", "nv": [{"loai": "chon-nhieu", "hoi": "Hà rút ra được những điều gì? Chọn TẤT CẢ ý đúng.", "chon": [{"t": "Không tin hoàn toàn vào quảng cáo giảm giá", "d": 1, "g": "Quảng cáo có thể phóng đại."}, {"t": "Xem đánh giá, nguồn gốc, chính sách đổi trả trước khi mua", "d": 1, "g": "Giúp tránh mua phải hàng kém."}, {"t": "Cân nhắc mình có thật cần không", "d": 1, "g": "Người tiêu dùng thông thái mua theo nhu cầu."}, {"t": "Cứ giảm giá 50% là nên mua ngay", "d": 0, "g": "Giảm giá chưa chắc là rẻ, là tốt."}, {"t": "Người tư vấn càng nhiệt tình thì hàng càng tốt", "d": 0, "g": "Lời tư vấn nhằm bán được hàng."}]}], "loi": "Em hoặc người thân đã từng mua hàng vì quảng cáo chưa? Kết quả thế nào?", "id": "c4-t1"}, {"cd": 4, "trang": "tr.31", "nhan": "Tình huống 1", "ten": "Mua 1 tặng 1", "canh": {"nen": "duonglang", "nguoi": [{"x": 150, "ao": "#ec4899", "toc": "dai", "cam": "lo"}, {"x": 270, "ao": "#f97316", "toc": "ngan", "cam": "vui", "vai": "nguoi-lon"}], "vat": [["hop-qua", 90, 215]], "loi": [[270, 40, "Mua 1 tặng 1 đây!"]]}, "tom": "Lan được mời vào quán đồ ăn vặt mới mở có khuyến mãi “mua 1 tặng 1”. Lan đang đói, nhưng nếu mua thì sẽ không đủ tiền mua quà sinh nhật bạn.", "nv": [{"loai": "chon", "hoi": "Lan nên làm gì?", "chon": [{"t": "Không mua; giữ tiền mua quà như đã định, về nhà ăn nhẹ.", "d": 1, "g": "Chi tiêu theo kế hoạch, không bị khuyến mãi lôi kéo."}, {"t": "Mua vì được tặng thêm, rất lời.", "d": 0, "g": "Sẽ thiếu tiền mua quà sinh nhật."}, {"t": "Mua rồi mượn tiền bạn mua quà.", "d": 0, "g": "Vay mượn vì chi tiêu không cần thiết."}, {"t": "Mua quà rẻ hơn để còn tiền ăn.", "d": 0, "g": "Đổi kế hoạch chỉ vì khuyến mãi."}]}], "loi": "Em có hay bị khuyến mãi lôi kéo không? Em làm gì để tránh?", "id": "c4-t2"}, {"cd": 4, "trang": "tr.31", "nhan": "Tình huống 2", "ten": "Thuốc giảm cân nhanh", "canh": {"nen": "nha", "nguoi": [{"x": 120, "ao": "#a855f7", "toc": "buoc", "cam": "vui"}, {"x": 220, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}, {"x": 320, "ao": "#eab308", "toc": "buoc", "cam": "vui", "vai": "nguoi-lon"}], "vat": [["lo-thuoc", 270, 215]], "loi": [[320, 40, "Uống là giảm cân nhanh!"]]}, "tom": "Chị gái Hoàng tin lời cô hàng xóm tiếp thị một loại thực phẩm chức năng giảm cân nhanh. Hoàng không yên tâm.", "nv": [{"loai": "chon", "hoi": "Hoàng nên nói gì với chị?", "chon": [{"t": "Khuyên chị tìm hiểu nguồn gốc sản phẩm, hỏi ý kiến bác sĩ; giảm cân nên bằng ăn uống, tập luyện hợp lí.", "d": 1, "g": "Bảo vệ sức khoẻ, không tin lời tiếp thị."}, {"t": "Ủng hộ chị mua thử.", "d": 0, "g": "Sản phẩm không rõ nguồn gốc có thể hại sức khoẻ."}, {"t": "Mắng cô hàng xóm lừa đảo.", "d": 0, "g": "Thiếu lễ phép, chưa có căn cứ."}, {"t": "Mặc kệ chị.", "d": 0, "g": "Nên góp ý vì sức khoẻ của chị."}]}], "loi": "Em đã thấy quảng cáo sản phẩm sức khoẻ nào đáng nghi ngờ chưa?", "id": "c4-t3"}, {"cd": 4, "trang": "tr.31", "nhan": "Tình huống 3", "ten": "Quà mừng thọ ông", "canh": {"dt": "Quà tặng online", "tin": [["Ấm chén giảm 30%", "do"], ["Kèm bình hoa -50%", "vang"], ["Chỉ còn hôm nay!", "xam"]], "nen": "mang", "nguoi": [{"x": 110, "ao": "#ec4899", "toc": "dai", "cam": "lo"}], "vat": [["hop-qua", 280, 215]], "loi": []}, "tom": "Hoa và chị chọn quà mừng thọ ông trên mạng: bộ ấm chén giảm giá 30%; nếu mua kèm bình hoa thì bình hoa được giảm 50%.", "nv": [{"loai": "chon", "hoi": "Hai chị em nên quyết định thế nào?", "chon": [{"t": "Chọn món ông thích, vừa số tiền đã định; chỉ mua thêm bình hoa nếu thật cần; so sánh giá ở nơi khác.", "d": 1, "g": "Mua theo nhu cầu, không bị ưu đãi mua kèm lôi kéo."}, {"t": "Mua cả hai vì giảm tới 50%.", "d": 0, "g": "Mua kèm món không cần là tốn thêm tiền."}, {"t": "Mua món đắt nhất cho sang.", "d": 0, "g": "Đắt chưa chắc phù hợp với ông."}, {"t": "Đặt ngay kẻo hết khuyến mãi.", "d": 0, "g": "Vội vàng dễ mua sai."}]}], "loi": "Em thường chọn quà cho người thân như thế nào?", "id": "c4-t4"}, {"cd": 4, "trang": "tr.31", "nhan": "Tình huống 4", "ten": "Đơn hàng gần 100 000 đồng", "canh": {"nen": "duonglang", "nguoi": [{"x": 170, "ao": "#22c55e", "toc": "ngan", "cam": "lo"}], "vat": [["hop-qua", 280, 215], ["dong-xu", 90, 220]], "loi": []}, "tom": "Long đi mua đồ thực hành cho nhóm. Cửa hàng có áp phích “Đơn hàng trên 100 000 đồng được tặng quà”. Đơn hàng của Long gần 100 000 đồng.", "nv": [{"loai": "chon", "hoi": "Long nên làm gì?", "chon": [{"t": "Chỉ mua đúng đồ thực hành cần; không mua thêm thứ không cần chỉ để được quà.", "d": 1, "g": "Tiền của nhóm cần chi đúng việc."}, {"t": "Mua thêm vài món cho đủ để nhận quà.", "d": 0, "g": "Tiêu tiền của nhóm vào thứ không cần."}, {"t": "Mua thêm rồi giữ quà cho mình.", "d": 0, "g": "Không công bằng với nhóm."}, {"t": "Hỏi bán hàng có quà gì rồi mới quyết.", "d": 0, "g": "Món quà không phải mục tiêu mua sắm."}]}], "loi": "Em có từng mua thêm hàng chỉ để được quà tặng không?", "id": "c4-t5"}, {"cd": 4, "trang": "tr.33", "nhan": "Hoạt động 1, 2", "ten": "Ý tưởng kinh doanh của Ngọc", "canh": {"nen": "lop", "nguoi": [{"x": 120, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 220, "ao": "#a855f7", "toc": "buoc", "cam": "vui"}, {"x": 320, "ao": "#eab308", "toc": "dai", "cam": "vui"}], "vat": [["hop-qua", 270, 210], ["hoa", 60, 205]], "loi": [], "bang": "Đồ thủ công"}, "tom": "Ngọc và nhóm bạn thích làm đồ thủ công như móc chìa khoá, dây buộc tóc, hoa cài áo. Tìm hiểu, nhóm thấy nhiều người cùng sở thích nên nảy ra ý tưởng kinh doanh. Kế hoạch mẫu trong SGK: vốn 400 000 đồng; doanh thu dự kiến 500 000 đồng/tháng; lãi dự kiến 100 000 đồng/tháng.", "nv": [{"loai": "xep", "hoi": "Sắp xếp các nội dung của kế hoạch kinh doanh (theo mẫu SGK tr.33).", "buoc": ["Ý tưởng kinh doanh: đồ làm bằng tay", "Đối tượng khách hàng và nhu cầu", "Kế hoạch tiếp thị: giới thiệu trong trường, trên mạng xã hội", "Vốn và chi phí nguyên liệu", "Kênh bán hàng: trực tiếp, trực tuyến", "Doanh thu và lãi dự kiến"]}, {"loai": "chon", "hoi": "Doanh thu dự kiến 500 000 đồng/tháng, lãi dự kiến 100 000 đồng/tháng. Chi phí mỗi tháng là bao nhiêu?", "chon": [{"t": "400 000 đồng", "d": 1, "g": "Lãi = doanh thu − chi phí, nên chi phí = 500 000 − 100 000 = 400 000 đồng."}, {"t": "600 000 đồng", "d": 0, "g": "Đó là doanh thu cộng lãi, không phải chi phí."}, {"t": "100 000 đồng", "d": 0, "g": "Đó là lãi."}, {"t": "500 000 đồng", "d": 0, "g": "Đó là doanh thu."}]}], "loi": "Nếu kinh doanh nhỏ, em sẽ chọn ý tưởng gì? Vì sao?", "id": "c4-t6"}, {"cd": 4, "trang": "tr.35", "nhan": "Tình huống 1", "ten": "Muốn kết bạn với Mai", "canh": {"nen": "lop", "nguoi": [{"x": 140, "ao": "#ec4899", "toc": "dai", "cam": "lo"}, {"x": 270, "ao": "#a855f7", "toc": "buoc", "cam": "vui"}], "vat": [], "loi": [], "bang": "English Club"}, "tom": "Lan tham gia câu lạc bộ tiếng Anh, có thiện cảm với Mai và muốn kết bạn.", "nv": [{"loai": "chon", "hoi": "Lan nên làm gì?", "chon": [{"t": "Chủ động chào hỏi, bắt chuyện, rủ Mai cùng luyện nói tiếng Anh.", "d": 1, "g": "Chủ động kết bạn là biểu hiện tự chủ (SGK tr.34)."}, {"t": "Chờ Mai bắt chuyện trước.", "d": 0, "g": "Có thể bỏ lỡ cơ hội kết bạn."}, {"t": "Gửi lời mời kết bạn trên mạng rồi thôi.", "d": 0, "g": "Nên làm quen trực tiếp."}, {"t": "Nhờ bạn khác hỏi hộ.", "d": 0, "g": "Tự làm quen sẽ chân thành hơn."}]}], "loi": "Em đã chủ động làm quen với ai gần đây?", "id": "c4-t7"}, {"cd": 4, "trang": "tr.35", "nhan": "Tình huống 2", "ten": "Bình luận trên mạng", "canh": {"dt": "Bình luận", "tin": [["Chúc mừng nhóm!", "xanh"], ["Chắc may mắn thôi…", "xam"], ["Chưa phải tốt nhất", "xam"]], "nen": "mang", "nguoi": [{"x": 110, "ao": "#3b82f6", "toc": "ngan", "cam": "buon"}], "vat": [["cup", 160, 230]], "loi": []}, "tom": "Nhóm của Thắng đạt giải Nhất cuộc thi sáng tạo khoa học kĩ thuật của trường và đăng ảnh lên mạng xã hội. Có bình luận cho rằng nhóm chỉ may mắn, sản phẩm chưa phải tốt nhất.", "nv": [{"loai": "chon", "hoi": "Thắng nên ứng xử thế nào?", "chon": [{"t": "Bình tĩnh, cảm ơn góp ý, trả lời lịch sự và tiếp tục hoàn thiện sản phẩm.", "d": 1, "g": "Bình luận, trả lời bình luận tích cực là biểu hiện tự chủ trên mạng xã hội (SGK tr.34)."}, {"t": "Trả lời gay gắt, chê lại người bình luận.", "d": 0, "g": "Dễ gây tranh cãi trên mạng."}, {"t": "Xoá ảnh, không tham gia thi nữa.", "d": 0, "g": "Để một bình luận làm mất động lực."}, {"t": "Rủ cả nhóm vào bình luận chê lại.", "d": 0, "g": "Làm mâu thuẫn lan rộng."}]}], "loi": "Khi đọc bình luận không hay về mình trên mạng, em làm gì?", "id": "c4-t8"}, {"cd": 4, "trang": "tr.35", "nhan": "Tình huống 3", "ten": "Chọn người dẫn chương trình", "canh": {"nen": "sankhau", "nguoi": [{"x": 130, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}, {"x": 230, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 320, "ao": "#a855f7", "toc": "buoc", "cam": "vui"}], "vat": [["mic", 270, 170]], "loi": []}, "tom": "Chào mừng ngày 22-12, Cường làm đội trưởng đội văn nghệ, phải chọn người dẫn chương trình. Mai, bạn function am(loai) {

    AC = AC || new (window.AudioContext || window.webkitAudioContext)();

    notes.forEach(function (f, i) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = loai === "sai" ? "triangle" : "sine"; o.frequency.value = f;
      var t0 = AC.currentTime + i * 0.11;

      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + 0.3);
    });
  } catch (e) {}
}

  KHO.luot.forEach(function (l) { var t = TH[l.id]; if (t) dong.push([l.ma, t.cd, t.ten, t.trang, l.nv + 1, l.dung ? "Có" : "Không", l.lan, l.t]); });
  taiFile("ket-qua-tinh-huong-HDTN8-" + ngayTen() + ".csv", "﻿" + dong.map(function (r) { return r.map(oCSV).join(","); }).join("\n"), "text/csv");
}
function xuatLoi() {
  var dong = [["Ma", "ChuDe", "TinhHuong", "TrangSGK", "LoiCuaEm", "ThoiGian"]];
  KHO.loi.forEach(function (l) { var t = TH[l.id]; if (t) dong.push([l.ma, t.cd, t.ten, t.trang, l.text, l.t]); });
  taiFile("loi-cua-em-HDTN8-" + ngayTen() + ".csv", "﻿" + dong.map(function (r) { return r.map(oCSV).join(","); }).join("\n"), "text/csv");
}
function saoLuu() { taiFile("sao-luu-tinh-huong-HDTN8-" + ngayTen() + ".json", JSON.stringify(KHO), "application/json"); }
function nhapSaoLuu(inp) {
  var f = inp.files[0]; if (!f) return;
  var r = new FileReader(); r.onload = function () { try { var k = JSON.parse(r.result); if (!k.luot) throw 0; KHO.luot = KHO.luot.concat(k.luot); KHO.loi = KHO.loi.concat(k.loi || []); ghiKho(); alert("Đã nhập thêm " + k.luot.length + " lượt."); ve(); } catch (e) { alert("File không đúng định dạng sao lưu của app."); } }; r.readAsText(f);
}
function xoaDL() { if (confirm("Xoá toàn bộ kết quả trên máy này? Nên bấm Sao lưu trước. Không khôi phục được.")) { KHO.luot = []; KHO.loi = []; ghiKho(); ve(); } }
