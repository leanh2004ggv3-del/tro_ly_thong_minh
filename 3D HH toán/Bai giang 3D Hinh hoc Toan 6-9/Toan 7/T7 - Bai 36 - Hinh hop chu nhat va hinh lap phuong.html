<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--nen);color:var(--chu);font-family:"Segoe UI",Arial,sans-serif}
body{display:flex;flex-direction:column}

.logo{font-size:30px}.tt{flex:1;min-width:220px}#ttl{font-size:21px;font-weight:700}#sub{font-size:13px;opacity:.85}
#tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{border:0;border-radius:10px;padding:9px 16px;font-size:16px;font-weight:600;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.tab.on{background:#ffd34d;color:#1d2b53}.tab:hover{background:rgba(255,255,255,.28)}.tab.on:hover{background:#ffd34d}
main{flex:1;display:flex;min-height:0}
#stage{flex:1.65;position:relative;min-width:0}#cv{display:block;touch-action:none}
.hud{position:absolute;left:12px;bottom:10px;font-size:12px;color:#33415f;background:rgba(255,255,255,.75);padding:4px 9px;border-radius:8px}
.cam{position:absolute;right:10px;top:10px;display:flex;gap:6px}.cam button{border:1px solid var(--vien);background:rgba(255,255,255,.9);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--chu)}
#panel{flex:1;max-width:520px;min-width:330px;overflow:auto;padding:12px 14px 20px;background:var(--the);border-left:1px solid var(--vien);font-size:17px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{border:1px solid var(--vien);background:#f4f7fc;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--chu)}
.chip.on{background:var(--xanh);color:#fff;border-color:var(--xanh)}.chip.ok{box-shadow:inset 0 0 0 2px var(--la)}
.card{border:1px solid var(--vien);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fbfcff}.card.head{background:linear-gradient(135deg,#fff8e1,#fff)}
.kicker{font-size:12.5px;color:var(--mo);text-transform:uppercase;letter-spacing:.3px}.ttl{font-weight:700;font-size:17.5px}
.stepbar{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mo)}.dots{display:flex;gap:5px;flex-wrap:wrap}.dots i{width:16px;height:16px;border-radius:50%;background:#dfe6f1;cursor:pointer}
.dots i.xong{background:var(--la)}.dots i.dang{background:var(--cam);box-shadow:0 0 0 3px rgba(224,138,30,.25)}
.say{font-size:19px;margin:10px 0;padding:10px 12px;border-left:5px solid var(--cam);background:#fffaf0;border-radius:6px}

.note{font-size:13.5px;color:var(--mo);margin-top:10px;border-top:1px dashed var(--vien);padding-top:8px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:1px solid var(--vien);background:#fff;border-radius:10px;padding:9px 14px;font-size:15.5px;cursor:pointer;color:var(--chu);font-weight:600}
.btn.main{background:var(--xanh);color:#fff;border-color:var(--xanh)}.btn.warn{background:var(--cam);color:#fff;border-color:var(--cam)}.btn:disabled{opacity:.4;cursor:default}
.gtkl{border-collapse:collapse;width:100%;margin:8px 0;font-size:16.5px}.gtkl th{width:44px;border-right:2px solid var(--chu);vertical-align:top;padding:4px 6px}.gtkl td{padding:4px 8px}.gtkl tr:first-child td,.gtkl tr:first-child th{border-bottom:2px solid var(--chu)}
.proof{padding-left:24px;margin:6px 0}.proof li{padding:6px 8px;border-radius:8px;margin:4px 0;cursor:pointer}.proof li.dang{background:#fff4dc;outline:2px solid #ffc861}.proof li.xong{color:#33415f}.proof li.chua{color:#99a3b8}
.ly{font-size:14.5px;color:#1aa37a;font-style:italic}.an{font-style:italic}
.goc{display:inline-block;position:relative;padding-top:3px}.goc::before{content:"";position:absolute;left:8%;right:8%;top:0;height:6px;border-top:1.6px solid currentColor;border-radius:50% 50% 0 0}
.m{font-family:"Times New Roman",serif;font-style:italic;font-size:1.08em}

.sign.on{outline:3px solid var(--xanh);background:#f1f7ff}.sign b{color:#1d2b53}.sign small{color:var(--mo)}
.banner{font-size:18px;font-weight:700;padding:10px 12px;border-radius:10px;margin:6px 0;text-align:center}.banner.yes{background:#dcfce7;color:#166534}.banner.no{background:#fee2e2;color:#991b1b}
.sec{font-weight:800;color:#2f4f8f;margin:12px 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:.4px}
.opts{display:flex;flex-direction:column;gap:7px;margin:8px 0}.opt{text-align:left;border:2px solid var(--vien);background:#fff;border-radius:10px;padding:9px 12px;font-size:16.5px;cursor:pointer;color:var(--chu)}
.opt:hover{border-color:var(--xanh)}.opt.dung{border-color:var(--la);background:#dcfce7}.opt.sai{border-color:var(--do);background:#fee2e2;animation:rung .35s}.opt.chon{border-color:var(--cam);background:#fff4dc}
.so-tt{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--cam);color:#fff;text-align:center;margin-right:8px;font-size:14px;line-height:24px}

.fb{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:16.5px}.fb.dung{background:#dcfce7;color:#14532d}.fb.sai{background:#fee2e2;color:#7f1d1d}
.so label{display:inline-block;margin:6px 12px 6px 0;font-size:18px}.so input{width:70px;font-size:18px;padding:5px;border:2px solid var(--vien);border-radius:8px;text-align:center}
.score{font-size:15px;margin-bottom:6px}.bar{height:9px;background:#e6ecf5;border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#2f7de1)}
.hint{font-size:14px;color:var(--mo)}
.meas{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:14px;margin:6px 0}.meas div{background:#f4f7fc;border-radius:8px;padding:4px 6px;text-align:center}
footer{font-size:12.5px;padding:5px 14px;background:#fff7d6;color:#6b5200;border-top:1px solid #f0dc8a;display:flex;gap:14px;flex-wrap:wrap}
@media (max-width:900px){main{flex-direction:column}#stage{flex:none;height:56vh}#panel{max-width:none;border-left:0;border-top:1px solid var(--vien)}}

<body>
<header><div class="logo">📐</div><div class="tt"><div id="ttl"></div><div id="sub"></div></div><nav id="tabs"></nav></header>
<main><div id="stage"><canvas id="cv"></canvas><div class="hud">🖱 Kéo nền để xoay bảng 3D · cuộn để phóng to/thu nhỏ</div>
<div class="cam"><button id="vNghieng">🧊 Nghiêng 3D</button><button id="vThang">⬇ Nhìn thẳng</button><button id="vKhung">⤢ Vừa khung</button></div></div>
<aside id="panel"></aside></main>
<footer><b>✅ BẢN NHÁP — thầy/cô duyệt trước khi dùng</b><span>Nội dung theo SGK Toán 7 tập hai (KNTT) tr.85–93</span><span>Triway giáo viên · bài giảng 3D Hình học</span></footer>
<script>
/* ===================== ĐỘNG CƠ BÀI GIẢNG 3D HÌNH HỌC (dùng chung Toán 6–9) =====================
   Tự viết, không thư viện, không gọi mạng. Bảng giấy nằm trong mặt phẳng y = 0 của cảnh 3D.
   Điểm trên giấy [x, y] (cm)  →  điểm 3D [x, độ cao, y].
   Hình (FIG) = {P:{A:[x,y],…}, base:[mục], steps:[{say, items:[mục], tool:(p,tip)=>[dụng cụ], dur}]}
   Mục vẽ: seg · arc · ang · tick · par · poly · pt · txt · circ  (xem drawItem)
   Dụng cụ: ruler · pencil · compass · eke · protr                    (xem drawTool)            */
'use strict';
const D2R=Math.PI/180;
const V={add:(a,b)=>[a[0]+b[0],a[1]+b[1]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1]],mul:(a,k)=>[a[0]*k,a[1]*k],
 len:a=>Math.hypot(a[0],a[1]),dist:(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]),lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],
 mid:(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],unit:a=>{const l=Math.hypot(a[0],a[1])||1;return[a[0]/l,a[1]/l]},
 perp:a=>[-a[1],a[0]],dot:(a,b)=>a[0]*b[0]+a[1]*b[1],cross:(a,b)=>a[0]*b[1]-a[1]*b[0],
 pol:(p,deg,r)=>[p[0]+r*Math.cos(deg*D2R),p[1]+r*Math.sin(deg*D2R)],dir:(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0])/D2R};
/* giao hai đường thẳng p1p2, p3p4 */
V.x=(p1,p2,p3,p4)=>{const d1=V.sub(p2,p1),d2=V.sub(p4,p3),den=V.cross(d1,d2);if(Math.abs(den)<1e-9)return null;const t=V.cross(V.sub(p3,p1),d2)/den;return V.add(p1,V.mul(d1,t))};
/* chân đường vuông góc từ p xuống ab */
V.foot=(p,a,b)=>{const d=V.sub(b,a),t=V.dot(V.sub(p,a),d)/V.dot(d,d);return V.add(a,V.mul(d,t))};
/* giao hai đường tròn; ref: chọn giao điểm gần ref */
V.cc=(c1,r1,c2,r2,ref)=>{const d=V.dist(c1,c2),a=(r1*r1-r2*r2+d*d)/(2*d),h=Math.sqrt(Math.max(0,r1*r1-a*a)),u=V.unit(V.sub(c2,c1)),m=V.add(c1,V.mul(u,a)),n=V.perp(u);
 const p=V.add(m,V.mul(n,h)),q=V.sub(m,V.mul(n,h));return !ref?p:(V.dist(p,ref)<V.dist(q,ref)?p:q)};
/* góc tại v giữa va, vb (độ, 0–180) */
V.angle=(v,a,b)=>{const x=V.unit(V.sub(a,v)),y=V.unit(V.sub(b,v));return Math.acos(Math.max(-1,Math.min(1,V.dot(x,y))))/D2R};
/* 3D */
const W={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],
 dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
 nrm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]},len:a=>Math.hypot(a[0],a[1],a[2])};
const w3=(p,h)=>[p[0],h||0,p[1]];   // giấy → 3D

/* ---------------- CAMERA ---------------- */
const CAM={yaw:-16,pitch:56,dist:20,T:[0,0,0],F:800,cx:0,cy:0,pos:[0,0,0],f:[0,0,1],r:[1,0,0],u:[0,1,0],goal:null,fit:null};
let cv,ctx,DPR=1,CW=0,CH=0;
function camSetup(){
 if(CAM.goal){const g=CAM.goal,k=.16;let done=true;for(const key of['yaw','pitch','dist']){if(g[key]==null)continue;const d=g[key]-CAM[key];if(Math.abs(d)>.05){CAM[key]+=d*k;done=false}else CAM[key]=g[key]}
  if(g.T){for(let i=0;i<3;i++){const d=g.T[i]-CAM.T[i];if(Math.abs(d)>.005){CAM.T[i]+=d*k;done=false}else CAM.T[i]=g.T[i]}}if(done)CAM.goal=null}
 const y=CAM.yaw*D2R,p=Math.min(89.4,Math.max(8,CAM.pitch))*D2R;
 CAM.pos=W.add(CAM.T,W.mul([Math.sin(y)*Math.cos(p),Math.sin(p),-Math.cos(y)*Math.cos(p)],CAM.dist));
 CAM.f=W.nrm(W.sub(CAM.T,CAM.pos));CAM.r=W.nrm(W.cross([0,1,0],CAM.f));CAM.u=W.cross(CAM.f,CAM.r);
 CAM.cx=CW/2;CAM.cy=CH/2;CAM.F=(Math.min(CW,CH)/2)/Math.tan(22*D2R)}
function P3(w){const d=W.sub(w,CAM.pos),z=W.dot(d,CAM.f)||1e-6;return[CAM.cx+CAM.F*W.dot(d,CAM.r)/z,CAM.cy-CAM.F*W.dot(d,CAM.u)/z,z]}
function P(p,h){return P3(w3(p,h))}
/* màn hình → điểm trên giấy */
function unproject(sx,sy){const d=W.add(CAM.f,W.add(W.mul(CAM.r,(sx-CAM.cx)/CAM.F),W.mul(CAM.u,-(sy-CAM.cy)/CAM.F)));if(Math.abs(d[1])<1e-6)return null;const t=-CAM.pos[1]/d[1];if(t<0)return null;return[CAM.pos[0]+d[0]*t,CAM.pos[2]+d[2]*t]}
/* vừa khung theo các điểm */
function camFit(pts,opt){opt=opt||{};let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of pts){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
 const R=Math.max(x1-x0,(y1-y0)*1.15)/2+ (opt.pad==null?1.6:opt.pad),T=[(x0+x1)/2,opt.ty||0,(y0+y1)/2+(opt.dy||0)];CAM.fit={T,dist:R/Math.tan(22*D2R)*(opt.zoom||1.25)*(CW/CH<1.2?1.25:1)};
 const g={T,dist:CAM.fit.dist};if(opt.yaw!=null)g.yaw=opt.yaw;if(opt.pitch!=null)g.pitch=opt.pitch;
 if(opt.now){Object.assign(CAM,{T:g.T.slice(),dist:g.dist});if(g.yaw!=null)CAM.yaw=g.yaw;if(g.pitch!=null)CAM.pitch=g.pitch;CAM.goal=null}else CAM.goal=g;
 BOARD.x0=x0-2.2;BOARD.x1=x1+2.2;BOARD.y0=y0-2.2;BOARD.y1=y1+2.2}
const BOARD={x0:-2,x1:10,y0:-2,y1:6,grid:true};

/* ---------------- VẼ CẢNH ---------------- */
const COL={line:'#1d2b53',cons:'#8a94b8',hl:'#e0532f',a:'#2f7de1',b:'#e08a1e',c:'#1aa37a',d:'#b04cc8',ok:'#16a34a',bad:'#dc2626',paper:'#fffdf6'};
function bg(){const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#dfe9f5');g.addColorStop(1,'#b9c9dc');ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH)}
function poly2(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}}
function drawBoard(){const b=BOARD,th=.35,c=[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]];
 // bóng
 poly2(c.map(p=>P(V.add(p,[.35,-.35]),-th-.02)),'rgba(40,60,90,.18)');
 // cạnh dày (mặt bên nhìn thấy)
 for(let i=0;i<4;i++){const a=c[i],q=c[(i+1)%4];const f=[P(a,0),P(q,0),P(q,-th),P(a,-th)];const n=V.perp(V.unit(V.sub(q,a)));const out=w3(V.mul(n,-1));const vis=W.dot(out,W.sub(CAM.pos,w3(V.mid(a,q))))>0;if(vis)poly2(f,'#d9cfb4','#b9ad8f',1)}
 poly2(c.map(p=>P(p,0)),COL.paper,'#c9bfa3',1.2);
 if(b.grid){ctx.lineWidth=.8;ctx.strokeStyle='rgba(90,140,200,.18)';ctx.beginPath();
  for(let x=Math.ceil(b.x0);x<=b.x1;x++){const p=P([x,b.y0]),q=P([x,b.y1]);ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1])}
  for(let y=Math.ceil(b.y0);y<=b.y1;y++){const p=P([b.x0,y]),q=P([b.x1,y]);ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1])}ctx.stroke()}}
let FIG={P:{}};
const R=p=>typeof p==='string'?(FIG.P[p]||(()=>{throw new Error('Thiếu điểm '+p)})()):p;
function centroid(){const ps=Object.values(FIG.P);if(!ps.length)return[0,0];return V.mul(ps.reduce((s,p)=>V.add(s,p),[0,0]),1/ps.length)}
function line2(a,b,col,w,dash){const p=P(a),q=P(b);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.stroke();ctx.setLineDash([])}
function text3(p,s,o){o=o||{};const q=P(p,o.h||0);ctx.font=(o.font||'italic bold '+(o.size||22)+'px "Times New Roman",serif');ctx.textAlign=o.align||'center';ctx.textBaseline='middle';
 if(o.box){const w=ctx.measureText(s).width+12,h=(o.size||22)+6;ctx.fillStyle=o.box;roundRect(q[0]-w/2,q[1]-h/2,w,h,6);ctx.fill()}
 ctx.lineWidth=4;ctx.strokeStyle=o.halo||'rgba(255,253,246,.95)';if(!o.box)ctx.strokeText(s,q[0],q[1]);ctx.fillStyle=o.col||COL.line;ctx.fillText(s,q[0],q[1])}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
/* đầu bút hiện tại của một mục đang vẽ */
function segEnds(it){const a=R(it.a),b=R(it.b),u=V.unit(V.sub(b,a)),e=it.ext||[0,0];return[V.sub(a,V.mul(u,e[0])),V.add(b,V.mul(u,e[1]))]}
function tipOf(it,pr){if(it.t==='seg'){const[s,e]=segEnds(it);return V.lerp(s,e,pr)}if(it.t==='arc'||it.t==='circ'){const a0=it.a0||0,a1=it.t==='circ'?a0+360:it.a1;return V.pol(R(it.c),a0+(a1-a0)*pr,it.r)}return R(it.p||it.a||it.c)}
function angSweep(v,a,b){let s=V.dir(v,a),e=V.dir(v,b);let d=((e-s)%360+540)%360-180;return[s,d]}
function drawItem(it,pr){if(pr<=0)return;const al=Math.min(1,pr*1.6);ctx.globalAlpha=it.t==='seg'||it.t==='arc'||it.t==='circ'?1:al;
 const col=it.col||(it.cons?COL.cons:COL.line);
 switch(it.t){
 case'seg':{const[s,e]=segEnds(it);line2(s,V.lerp(s,e,pr),col,it.w||(it.cons?1.6:2.8),it.dash);break}
 case'arc':case'circ':{const c=R(it.c),a0=it.a0||0,a1=it.t==='circ'?a0+360:it.a1,n=Math.max(8,Math.ceil(Math.abs(a1-a0)/3));ctx.beginPath();
  for(let i=0;i<=n;i++){const t=i/n*pr,q=P(V.pol(c,a0+(a1-a0)*t,it.r));i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}
  if(it.fill&&pr>=1){ctx.fillStyle=it.fill;ctx.fill()}ctx.strokeStyle=col;ctx.lineWidth=it.w||(it.cons?1.4:2.6);ctx.setLineDash(it.dash||[]);ctx.stroke();ctx.setLineDash([]);break}
 case'ang':{const v=R(it.v),a=R(it.a),b=R(it.b),c2=it.col||COL.hl;
  if(it.right){const u1=V.mul(V.unit(V.sub(a,v)),it.r||.45),u2=V.mul(V.unit(V.sub(b,v)),it.r||.45);const q=[v,V.add(v,u1),V.add(V.add(v,u1),u2),V.add(v,u2)].map(p=>P(p));
