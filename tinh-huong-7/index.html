<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Em xử lí tình huống – HĐTN, HN 7</title>
<style>
:root{
  --nen1:#eef4ff; --nen2:#fff4ea; --chu:#1e293b; --chu2:#475569; --kinh:rgba(255,255,255,.82); --vien:rgba(148,163,184,.35);
  --chinh:#4f46e5; --nhan1:#f97316; --nhan2:#0ea5e9; --dung:#16a34a; --dung-nen:#dcfce7; --sai:#dc2626; --sai-nen:#fee2e2;
  --cd:#4f46e5; --bong:0 10px 30px rgba(30,41,59,.12);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--chu);min-height:100vh;
  background:radial-gradient(circle at 10% 0%,#dbe7ff 0,transparent 45%),radial-gradient(circle at 95% 15%,#ffe4cc 0,transparent 40%),linear-gradient(160deg,var(--nen1),var(--nen2));}
button{font-family:inherit;cursor:pointer}
.dau{display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo h1{margin:0;font-size:26px;letter-spacing:.5px;background:linear-gradient(90deg,#4f46e5,#ec4899,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.logo small{display:block;color:var(--chu2);font-weight:600;font-size:13px}
.dau .phai{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--kinh);border:1px solid var(--vien);font-weight:700;font-size:14px}
.nut{border:0;border-radius:14px;padding:11px 18px;min-height:44px;font-weight:800;font-size:16px;color:#fff;
  background:linear-gradient(135deg,var(--cd),#ec4899);box-shadow:0 6px 16px rgba(79,70,229,.28);transition:transform .15s,box-shadow .15s}
.nut:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(79,70,229,.32)}
.nut:active{transform:translateY(1px) scale(.98)}
.nut.phu{background:var(--kinh);color:var(--chu);border:1px solid var(--vien);box-shadow:none}
.nut.nho{padding:7px 12px;min-height:38px;font-size:14px}
.nut[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.nhap{margin:0 22px 8px;padding:7px 14px;border-radius:12px;background:#fff7d6;border:1px dashed #eab308;color:#854d0e;font-weight:700;font-size:14px;text-align:center}
main{padding:6px 22px 40px;max-width:1360px;margin:0 auto}
.kinh{background:var(--kinh);border:1px solid var(--vien);border-radius:20px;box-shadow:var(--bong);backdrop-filter:blur(6px)}
.hien{animation:hien .3s ease}
@keyframes hien{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes noi{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rung{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.khong-hieu-ung *{animation:none!important;transition:none!important}
/* trang chủ */
.anh-hung{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding:22px;align-items:center}
.anh-hung h2{font-size:34px;margin:0 0 6px;line-height:1.15}
.anh-hung p{color:var(--chu2);font-size:17px;margin:6px 0 14px;line-height:1.5}
.o-ma{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.o-ma input{font-size:18px;padding:11px 14px;border-radius:14px;border:2px solid #c7d2fe;min-width:200px;font-weight:700}
.o-ma .goi-y{width:100%;font-size:13px;color:var(--chu2)}
.canh-bao-ma{color:var(--sai);font-weight:700;font-size:14px;width:100%}
.luoi-cd{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:18px}
.the-cd{position:relative;padding:16px;border-radius:20px;cursor:pointer;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--m) 12%,#fff));border:2px solid color-mix(in srgb,var(--m) 30%,transparent);box-shadow:var(--bong);transition:transform .18s}
.the-cd:hover{transform:translateY(-4px)}
.the-cd .bieu{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,var(--m),color-mix(in srgb,var(--m) 55%,#fff));box-shadow:0 6px 14px color-mix(in srgb,var(--m) 40%,transparent)}
.the-cd h3{margin:12px 0 2px;font-size:19px}
.the-cd .nho{color:var(--chu2);font-size:13px;font-weight:600}
.thanh{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:10px}
.thanh i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--m),#22c55e)}
/* chủ đề */
.tieu-de-cd{display:flex;align-items:center;gap:14px;padding:16px 20px;margin-bottom:16px}
.tieu-de-cd .bieu{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:var(--cd);color:#fff}
.tieu-de-cd h2{margin:0;font-size:26px}
.luoi-th{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.the-th{border-radius:18px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:var(--bong);border:2px solid transparent;transition:transform .18s,border-color .18s}
.the-th:hover{transform:translateY(-4px);border-color:var(--cd)}
.the-th svg{display:block;width:100%;height:auto}
.the-th .ben{padding:10px 14px 14px}
.the-th h3{margin:4px 0;font-size:18px}
.huy{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--cd) 14%,#fff);color:var(--cd)}
.huy.xong{background:var(--dung-nen);color:var(--dung)}
.huy.at{background:#ffedd5;color:#c2410c}
/* màn tình huống */
.man-th{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.khung-canh{padding:14px}
.khung-canh svg{width:100%;height:auto;border-radius:14px;display:block}
.khung-canh h2{margin:12px 4px 4px;font-size:24px}
.tom{font-size:17px;line-height:1.6;margin:6px 4px 4px}
.an-toan{margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:2px solid #fb923c;font-weight:700;color:#9a3412;display:flex;gap:10px;align-items:center}
.an-toan b{font-size:26px}
.bang-nv{padding:18px}
.cham{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.cham span{padding:5px 12px;border-radius:99px;font-weight:800;font-size:13px;background:#e2e8f0;color:#64748b}
.cham span.dang{background:var(--cd);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--cd) 25%,transparent)}
.cham span.da{background:var(--dung-nen);color:var(--dung)}
.hoi{font-size:20px;font-weight:800;margin:4px 0 12px;line-height:1.4}
.pa{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:16px;border:2px solid #e2e8f0;background:#fff;font-size:16.5px;line-height:1.45;color:var(--chu);transition:transform .12s,border-color .12s,background .2s}
.pa:hover{border-color:var(--cd);transform:translateX(3px)}
.pa .chu-cai{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;background:linear-gradient(135deg,var(--cd),#ec4899)}
.pa.dung{border-color:var(--dung);background:var(--dung-nen)}
.pa.dung .chu-cai{background:var(--dung)}
.pa.sai{border-color:var(--sai);background:var(--sai-nen);animation:rung .35s}
.pa.sai .chu-cai{background:var(--sai)}
.pa.chon{border-color:var(--cd);background:color-mix(in srgb,var(--cd) 10%,#fff)}
.pa .giai{display:block;margin-top:6px;font-size:14.5px;font-weight:600}
.pa.dung .giai{color:#166534}.pa.sai .giai{color:#991b1b}
.loi-bao{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:700;display:flex;gap:12px;align-items:center}
.loi-bao.tot{background:var(--dung-nen);color:#166534}
.loi-bao.chua{background:var(--sai-nen);color:#991b1b}
.hang-nut{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
/* phân loại */
.kho{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border-radius:14px;background:#f1f5f9;border:2px dashed #cbd5e1;margin-bottom:12px}
.the-pl{padding:9px 12px;border-radius:12px;background:#fff;border:2px solid #cbd5e1;font-weight:700;font-size:15px;cursor:grab;user-select:none;box-shadow:0 3px 8px rgba(0,0,0,.06)}
.the-pl.chon{border-color:var(--cd);box-shadow:0 0 0 4px color-mix(in srgb,var(--cd) 25%,transparent)}
.the-pl.dung{border-color:var(--dung);background:var(--dung-nen)}
.the-pl.sai{border-color:var(--sai);background:var(--sai-nen);animation:rung .35s}
.the-pl small{display:block;font-weight:600;font-size:12.5px;margin-top:3px}
.thung-hang{display:grid;gap:10px}
.thung{border-radius:16px;padding:10px;min-height:120px;background:#fff;border:2px solid var(--tm);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.thung h4{margin:0 0 4px;padding:6px 10px;border-radius:10px;color:#fff;background:var(--tm);font-size:15px;text-align:center}
.thung.sang{box-shadow:0 0 0 4px color-mix(in srgb,var(--tm) 30%,transparent)}
/* xếp bước */
.xep{list-style:none;padding:0;margin:0;position:relative}
.xep:before{content:"";position:absolute;left:24px;top:20px;bottom:20px;width:4px;border-radius:4px;background:linear-gradient(var(--cd),#ec4899,#f97316)}
.xep li{position:relative;display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px 10px 10px 8px;border-radius:14px;background:#fff;border:2px solid #e2e8f0;font-size:16px;font-weight:600;cursor:grab}
.xep li .so{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;background:var(--cd);z-index:1;box-shadow:0 0 0 4px #fff}
.xep li .chu{flex:1}
.xep li .mui{display:flex;flex-direction:column;gap:2px}
.xep li .mui button{border:0;border-radius:8px;width:34px;height:26px;background:#eef2ff;font-weight:900;color:var(--cd)}
.xep li.dung{border-color:var(--dung);background:var(--dung-nen)}.xep li.dung .so{background:var(--dung)}
.xep li.sai{border-color:var(--sai);background:var(--sai-nen)}.xep li.sai .so{background:var(--sai)}
.xep li.keo{opacity:.4}
/* ngân sách */
.ns{display:grid;grid-template-columns:1fr 210px;gap:14px;align-items:center}
.thu-nhap{padding:10px 14px;border-radius:14px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);font-weight:800;margin-bottom:10px}
.dong-ns{margin:10px 0}
.dong-ns label{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px}.dong-ns label>span:last-child{white-space:nowrap}
.dong-ns input{width:100%;accent-color:var(--mm);height:26px}
.dong-ns .tien{color:var(--chu2);font-weight:700}
.tong{margin-top:6px;padding:10px 14px;border-radius:12px;font-weight:900;text-align:center;font-size:17px}
.tong.ok{background:var(--dung-nen);color:var(--dung)}.tong.vuot{background:var(--sai-nen);color:var(--sai)}.tong.thieu{background:#fef9c3;color:#a16207}
.tieu-chi{list-style:none;padding:0;margin:10px 0 0;font-weight:700;font-size:15px}
.tieu-chi li{margin:4px 0}
/* lời của em */
.loi-em textarea{width:100%;min-height:120px;font-size:17px;padding:12px;border-radius:14px;border:2px solid #c7d2fe;font-family:inherit}
.cu{display:flex;gap:12px;align-items:flex-end}
.cu .bong-noi{flex:1;padding:12px 16px;border-radius:18px 18px 18px 4px;background:#eef2ff;font-weight:700;font-size:16px;line-height:1.45}
.cu svg{flex:none;animation:noi 3s ease-in-out infinite}
.hoan-thanh{text-align:center;padding:24px}
.sao{font-size:46px;letter-spacing:6px}
/* giáo viên */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:12px 0}
.kpi div{padding:16px;border-radius:18px;background:#fff;box-shadow:var(--bong);border-top:6px solid var(--k)}
.kpi b{display:block;font-size:36px;color:var(--k)}
.kpi span{color:var(--chu2);font-weight:700}
.thu{position:relative;height:300px}
.thu canvas{position:absolute;inset:0;width:100%;height:100%}
.bang-sai{width:100%;border-collapse:collapse;font-size:15px}
.bang-sai td,.bang-sai th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}
.dai-thu{background:repeating-linear-gradient(45deg,#fde68a,#fde68a 12px,#fef3c7 12px,#fef3c7 24px);color:#92400e;font-weight:900;text-align:center;padding:8px;border-radius:12px;margin-bottom:10px;letter-spacing:2px}
.nut-video{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;border:0;background:rgba(15,23,42,.72);color:#fff;font-size:34px;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .15s}
.nut-video:hover{transform:translate(-50%,-50%) scale(1.08)}
.khung-tranh{position:relative}
.nhan-video{position:absolute;right:12px;bottom:12px;padding:6px 12px;border-radius:999px;background:#fff;font-weight:800;font-size:14px;color:var(--cd);box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none}
#hopVideo{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.82);display:none;align-items:center;justify-content:center;padding:20px}
#hopVideo.mo{display:flex}
#hopVideo .ben{width:min(1100px,100%);background:#0f172a;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#hopVideo video{display:block;width:100%;max-height:78vh;background:#000}
#hopVideo .dong{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#e2e8f0;font-weight:700;gap:10px}
#phao{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
/* chiếu TV */
body.tv{font-size:19px}
body.tv .hoi{font-size:27px}
body.tv .pa{font-size:22px;padding:16px}
body.tv .pa .chu-cai{width:52px;height:52px;font-size:28px}
body.tv .tom{font-size:21px}
body.tv .xep li,body.tv .the-pl{font-size:20px}
body.tv .khung-canh h2{font-size:30px}
@media (max-width:620px){.thung-hang{grid-template-columns:repeat(2,1fr)!important}.pa{font-size:15.5px}.hoi{font-size:18px}.anh-hung h2{font-size:27px}}
@media (max-width:900px){.man-th,.anh-hung,.ns{grid-template-columns:1fr}.logo h1{font-size:21px}main{padding:6px 12px 30px}.dau{padding:10px 12px}.nhap{margin:0 12px 8px}}
</style>
</head>
<body>

  <linearGradient id="gTroi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
  <linearGradient id="gTuong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
  <linearGradient id="gTuong2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
  <linearGradient id="gHong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
  <linearGradient id="gCo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#22c55e"/></linearGradient>

</defs></svg>

<header class="dau">
  <div class="logo" onclick="diToi('trang-chu')" title="Về trang chủ">
    <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="#4f46e5"/><path d="M12 30c0-8 6-14 14-14s14 6 14 14" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/><circle cx="19" cy="30" r="5" fill="#fff"/><circle cx="33" cy="30" r="5" fill="#fff"/><circle cx="19" cy="30" r="2.4" fill="#1e293b"/><circle cx="33" cy="30" r="2.4" fill="#1e293b"/><path d="M24 36l2 3 2-3z" fill="#f97316"/></svg>
    <div><h1>EM XỬ LÍ TÌNH HUỐNG</h1><small>Hoạt động trải nghiệm, hướng nghiệp 7 · 22 tình huống SGK</small></div>
  </div>
  <div class="phai">
    <span class="chip" id="chipMa">👤 Chưa nhập mã</span>

    <button class="nut phu nho" id="nutTV" onclick="doiTV()">📺 Chiếu TV</button>

<div class="nhap">✅ BẢN NHÁP — thầy/cô duyệt trước khi dùng · Nội dung bám SGK HĐTN, HN 7 (Kết nối tri thức); phương án và lời giải thích do trợ lý soạn theo phần Gợi ý của SGK</div>

<script>
"use strict";
var DL = {"chu_de": [{"cd": 1, "ten": "Em với nhà trường", "mau": "#3b82f6", "icon": "🏫", "trang": "SGK tr.8"}, {"cd": 2, "ten": "Khám phá bản thân", "mau": "#8b5cf6", "icon": "🔍", "trang": "SGK tr.17–18"}, {"cd": 3, "ten": "Trách nhiệm với bản thân", "mau": "#f97316", "icon": "🎯", "trang": "SGK tr.23–24"}, {"cd": 4, "ten": "Rèn luyện bản thân", "mau": "#10b981", "icon": "💪", "trang": "SGK tr.30"}, {"cd": 5, "ten": "Em với gia đình", "mau": "#ec4899", "icon": "🏡", "trang": "SGK tr.34–38"}, {"cd": 6, "ten": "Em với cộng đồng", "mau": "#eab308", "icon": "🤝", "trang": "SGK tr.41–42"}], "tinh_huong": [{"cd": 1, "trang": "tr.8", "nhan": "Tình huống 1", "ten": "Thanh trong giờ thực hành", "canh": {"nen": "lop", "nguoi": [{"x": 110, "ao": "#f97316", "toc": "ngan", "cam": "binh"}, {"x": 210, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 300, "ao": "#22c55e", "toc": "ngan", "cam": "vui"}], "vat": [["sach", 70, 205], ["ly-nuoc", 255, 205]], "loi": [], "bang": "KHTN 7"}, "tom": "Trong giờ thực hành Khoa học tự nhiên, cả nhóm đang làm thí nghiệm thì Thanh mang bài tập Toán ra làm.", "nv": [{"loai": "chon", "hoi": "Em là một bạn trong nhóm. Em đề xuất cách nào?", "chon": [{"t": "Nhẹ nhàng nhắc Thanh cùng làm thí nghiệm, giao cho Thanh một phần việc cụ thể.", "d": 1, "g": "Vừa hợp tác, vừa giúp Thanh tham gia nhiệm vụ chung."}, {"t": "Báo ngay thầy cô để Thanh bị phạt.", "d": 0, "g": "Nên nhắc nhở bạn trước; chỉ nhờ thầy cô khi bạn không thay đổi."}, {"t": "Mặc kệ, cả nhóm tự làm.", "d": 0, "g": "Bỏ mặc thì Thanh không học được, nhóm cũng thiếu người."}, {"t": "Chê Thanh trước cả nhóm.", "d": 0, "g": "Chê bai làm bạn tự ái, khó hợp tác."}]}], "loi": "Khi làm việc nhóm, em đã giúp bạn cùng tham gia thế nào?", "id": "c1-t1"}, {"cd": 1, "trang": "tr.8", "nhan": "Tình huống 2", "ten": "Thành viên bị ốm", "canh": {"nen": "sankhau", "nguoi": [{"x": 130, "ao": "#ec4899", "toc": "dai", "cam": "lo"}, {"x": 220, "ao": "#a855f7", "toc": "buoc", "cam": "lo"}, {"x": 310, "ao": "#3b82f6", "toc": "ngan", "cam": "binh"}], "vat": [], "loi": []}, "tom": "Nhóm của Hà được giao biểu diễn một tiểu phẩm trong buổi sinh hoạt dưới cờ. Ngay trước ngày biểu diễn, một thành viên của nhóm bị ốm.", "nv": [{"loai": "chon", "hoi": "Nhóm của Hà nên làm gì?", "chon": [{"t": "Hỏi thăm bạn ốm; cả nhóm phân công lại vai, tập bù và xin ý kiến thầy cô.", "d": 1, "g": "Hợp tác, linh hoạt giải quyết vấn đề nảy sinh."}, {"t": "Xin huỷ tiết mục.", "d": 0, "g": "Chưa tìm cách đã bỏ cuộc."}, {"t": "Gọi bạn ốm đến diễn bằng được.", "d": 0, "g": "Không quan tâm đến sức khoẻ của bạn."}, {"t": "Trách bạn ốm làm hỏng việc của nhóm.", "d": 0, "g": "Ốm là điều không mong muốn, bạn cần được thông cảm."}]}], "loi": "Nhóm em đã từng gặp trục trặc gì? Các bạn giải quyết ra sao?", "id": "c1-t2"}, {"cd": 1, "trang": "tr.8", "nhan": "Tình huống 3", "ten": "Bạn mới lớp 7B", "canh": {"nen": "santruong", "nguoi": [{"x": 120, "ao": "#3b82f6", "toc": "ngan", "cam": "buon"}, {"x": 250, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 330, "ao": "#22c55e", "toc": "ngan", "cam": "vui"}], "vat": [], "loi": [[260, 40, "Minh ơi, ra chơi cùng nhé!"]]}, "tom": "Minh là học sinh mới chuyển đến lớp 7B. Minh nhút nhát, giờ ra chơi thường ngồi một mình.", "nv": [{"loai": "chon", "hoi": "Em sẽ làm gì để giúp Minh?", "chon": [{"t": "Rủ Minh cùng chơi, giới thiệu Minh với các bạn, mời Minh vào nhóm học tập.", "d": 1, "g": "Chủ động, thân thiện giúp Minh hoà đồng."}, {"t": "Để Minh tự làm quen.", "d": 0, "g": "Bạn nhút nhát cần người chủ động trước."}, {"t": "Trêu Minh là “người mới”.", "d": 0, "g": "Trêu chọc làm bạn tổn thương."}, {"t": "Chờ cô chủ nhiệm giao việc mới giúp.", "d": 0, "g": "Có thể chủ động giúp bạn ngay."}]}], "loi": "Em đã làm gì để lớp mình thân thiện hơn?", "id": "c1-t3"}, {"cd": 2, "trang": "tr.17", "nhan": "Hoạt động 1", "ten": "Nước rớt từ tầng hai", "canh": {"nen": "santruong", "nguoi": [{"x": 110, "ao": "#3b82f6", "toc": "ngan", "cam": "gian"}, {"x": 210, "ao": "#22c55e", "toc": "ngan", "cam": "binh"}, {"x": 320, "ao": "#f97316", "toc": "ngan", "cam": "lo"}], "vat": [["ly-nuoc", 330, 90]], "loi": [[320, 40, "Tớ xin lỗi!"]]}, "tom": "Long và Kiên đang trực nhật thì bị nước từ tầng hai rớt xuống ướt người, do Minh lớp bên cạnh tưới hoa ở lan can. Long tức giận chạy lên giằng chiếc ca nhựa vứt xuống đất. Kiên ngăn Long lại, nén giận nhắc nhở Minh. Minh xin lỗi.", "nv": [{"loai": "phan-loai", "hoi": "Xếp cách thể hiện cảm xúc của mỗi bạn.", "thung": ["Kiểm soát cảm xúc tốt", "Chưa kiểm soát được"], "the": [{"t": "Long giằng ca nhựa của Minh vứt xuống đất", "th": 1, "g": "Để cơn giận điều khiển hành động."}, {"t": "Kiên ngăn Long lại", "th": 0, "g": "Bình tĩnh, ngăn xung đột."}, {"t": "Kiên nén giận, nhắc nhở Minh", "th": 0, "g": "Bày tỏ khó chịu đúng cách."}, {"t": "Minh xin lỗi hai bạn", "th": 0, "g": "Biết nhận lỗi, làm dịu tình huống."}]}], "loi": "Khi tức giận, em thường làm gì để bình tĩnh lại?", "id": "c2-t1"}, {"cd": 2, "trang": "tr.18", "nhan": "Tình huống 1", "ten": "Lan bị nói xấu", "canh": {"nen": "lop", "nguoi": [{"x": 110, "ao": "#ec4899", "toc": "dai", "cam": "gian"}, {"x": 250, "ao": "#a855f7", "toc": "buoc", "cam": "cuoi"}, {"x": 330, "ao": "#eab308", "toc": "dai", "cam": "cuoi"}], "vat": [], "loi": []}, "tom": "Lan tình cờ nghe Mai và Ly nói xấu mình sau lưng. Lan rất tức giận.", "nv": [{"loai": "chon", "hoi": "Lan nên làm gì để giải toả cảm xúc?", "chon": [{"t": "Hít thở sâu cho bình tĩnh; sau đó gặp riêng hai bạn nói chuyện thẳng thắn, hoặc tâm sự với người tin cậy.", "d": 1, "g": "Lấy lại bình tĩnh trước, rồi mới giải quyết."}, {"t": "Nói xấu lại hai bạn.", "d": 0, "g": "Trả đũa làm mâu thuẫn tăng."}, {"t": "Đăng bài trên mạng nói về hai bạn.", "d": 0, "g": "Đưa chuyện lên mạng làm sự việc tệ hơn."}, {"t": "Chạy đến quát mắng hai bạn ngay.", "d": 0, "g": "Đang giận dễ nói lời làm tổn thương."}]}], "loi": "Em có cách giải toả cảm xúc tiêu cực nào hiệu quả?", "id": "c2-t2"}, {"cd": 2, "trang": "tr.18", "nhan": "Tình huống 2", "ten": "Hoà giận Nam", "canh": {"nen": "lop", "nguoi": [{"x": 140, "ao": "#3b82f6", "toc": "ngan", "cam": "gian"}, {"x": 260, "ao": "#22c55e", "toc": "ngan", "cam": "buon"}], "vat": [["giay", 200, 205]], "loi": [], "bang": "Toán 7"}, "tom": "Hoà và Nam là bạn thân, ngồi cùng bàn. Trong giờ kiểm tra Toán, Hoà cầu cứu Nam cho chép bài nhưng Nam từ chối. Hoà giận, tránh mặt Nam. Nam rất buồn.", "nv": [{"loai": "chon", "hoi": "Nếu là Nam, em sẽ làm gì?", "chon": [{"t": "Chủ động nói chuyện với Hoà, giải thích vì sao không cho chép, rủ Hoà cùng ôn bài.", "d": 1, "g": "Giữ được trung thực và cả tình bạn."}, {"t": "Cũng tránh mặt Hoà.", "d": 0, "g": "Không nói chuyện thì hai bạn càng xa nhau."}, {"t": "Hứa lần sau sẽ cho Hoà chép.", "d": 0, "g": "Cho chép bài là gian lận."}, {"t": "Kể với cả lớp chuyện Hoà xin chép bài.", "d": 0, "g": "Làm Hoà xấu hổ, mâu thuẫn tăng."}]}], "loi": "Nếu bạn giận em vì em làm điều đúng, em sẽ nói gì với bạn?", "id": "c2-t3"}, {"cd": 3, "trang": "tr.23", "nhan": "Tình huống 1", "ten": "Bị doạ trên mạng", "canh": {"nen": "mang", "nguoi": [{"x": 110, "ao": "#22c55e", "toc": "ngan", "cam": "lo"}], "vat": [["canh-bao", 330, 60]], "loi": []}, "tom": "Buổi trưa, Hưng đang cầm hộp cơm thì bị Huy va phải làm hộp cơm rơi xuống đất. Dù Huy đã xin lỗi, Hưng vẫn tức giận, nói xấu Huy trên mạng và đưa ra một số lời đe doạ.", "nv": [{"loai": "chon", "hoi": "Nếu là Huy, em sẽ làm gì để tự bảo vệ?", "chon": [{"t": "Không đáp trả; lưu lại tin nhắn, bài đăng; báo ngay thầy cô, cha mẹ.", "d": 1, "g": "Bị đe doạ là việc người lớn phải biết và cùng xử lí."}, {"t": "Đe doạ lại Hưng trên mạng.", "d": 0, "g": "Đáp trả làm sự việc nghiêm trọng hơn."}, {"t": "Mua đồ ăn đền Hưng để Hưng thôi doạ.", "d": 0, "g": "Huy đã xin lỗi. Bị đe doạ thì cần báo người lớn."}, {"t": "Giấu kín vì sợ.", "d": 0, "g": "Giữ kín một mình làm Huy càng lo sợ."}]}], "loi": "Nếu bạn em bị nói xấu, đe doạ trên mạng, em sẽ giúp bạn thế nào?", "an_toan": 1, "id": "c3-t1"}, {"cd": 3, "trang": "tr.23", "nhan": "Tình huống 2", "ten": "Bị chặn đường đòi xe", "canh": {"nen": "duonglang", "nguoi": [{"x": 130, "ao": "#1e293b", "toc": "ngan", "cam": "gian", "vai": "nguoi-lon"}, {"x": 220, "ao": "#0ea5e9", "toc": "ngan", "cam": "lo"}, {"x": 310, "ao": "#1e293b", "toc": "ngan", "cam": "gian", "vai": "nguoi-lon"}], "vat": [["xe-dap", 220, 205]], "loi": []}, "tom": "Trên đường đi học về, Toàn đi đến một quãng đường vắng. Đột nhiên, có hai người lạ mặt lao ra chặn đường, đòi Toàn đưa chiếc xe đạp thể thao mẹ mới mua.", "nv": [{"loai": "chon", "hoi": "Toàn nên làm gì?", "chon": [{"t": "Giữ bình tĩnh, không giằng co; tính mạng quan trọng hơn tài sản. Tìm cách chạy đến chỗ đông người, báo ngay người thân và người có trách nhiệm.", "d": 1, "g": "Ưu tiên an toàn bản thân, nhờ người lớn và cơ quan chức năng xử lí."}, {"t": "Giằng co, chống trả để giữ xe.", "d": 0, "g": "Chống trả người lạ có thể bị làm hại."}, {"t": "Đi theo hai người lạ để nói chuyện.", "d": 0, "g": "Đi theo người lạ rất nguy hiểm."}, {"t": "Về nhà im lặng vì sợ bị mắng.", "d": 0, "g": "Cần báo người lớn để được giúp đỡ."}]}], "loi": "Đường em đi học có đoạn nào vắng không? Em sẽ làm gì để an toàn hơn?", "an_toan": 1, "id": "c3-t2"}, {"cd": 3, "trang": "tr.24", "nhan": "Tình huống 3", "ten": "Người lạ đi theo", "canh": {"nen": "duonglang", "nguoi": [{"x": 170, "ao": "#ec4899", "toc": "buoc", "cam": "lo"}, {"x": 290, "ao": "#1e293b", "toc": "ngan", "cam": "binh", "vai": "nguoi-lon"}], "vat": [], "loi": [[290, 35, "Cho chú xin số điện thoại!"]]}, "tom": "Hôm Chủ nhật, Nhàn sang nhà bác hàng xóm chơi. Lúc về, trời đã gần tối. Nhàn phát hiện có một người đàn ông cứ đi sát ngay sau mình, rồi tiến lại gần xin số điện thoại.", "nv": [{"loai": "chon", "hoi": "Nhàn nên làm gì?", "chon": [{"t": "Không cho số điện thoại; đi nhanh về phía có đông người hoặc nhà người quen; báo ngay bố mẹ, người thân.", "d": 1, "g": "Đúng gợi ý SGK: chạy đến chỗ đông người, báo người thân, người có trách nhiệm."}, {"t": "Cho số điện thoại cho xong chuyện.", "d": 0, "g": "Không đưa thông tin cá nhân cho người lạ."}, {"t": "Dừng lại nói chuyện với người đó.", "d": 0, "g": "Đứng lại một mình với người lạ lúc trời tối là nguy hiểm."}, {"t": "Rẽ vào đường tắt vắng cho nhanh.", "d": 0, "g": "Đường vắng càng nguy hiểm hơn."}]}], "loi": "Em biết những số điện thoại khẩn cấp nào? (Ví dụ: 111 là tổng đài bảo vệ trẻ em)", "an_toan": 1, "id": "c3-t3"}, {"cd": 3, "trang": "tr.24", "nhan": "Tình huống 4", "ten": "Con rắn bên đường", "canh": {"nen": "trangtrai", "nguoi": [{"x": 160, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}, {"x": 250, "ao": "#ec4899", "toc": "dai", "cam": "lo"}], "vat": [["ran", 330, 225]], "loi": []}, "tom": "Nam và Hoài đang đi trên một con đường nhỏ, hai bên là cây cối rậm rạp thì bất ngờ có một con rắn bò ra.", "nv": [{"loai": "chon", "hoi": "Hai bạn nên làm gì?", "chon": [{"t": "Đứng yên rồi lùi lại từ từ, tránh xa con rắn; không trêu, không đánh rắn. Nếu bị cắn, gọi người lớn và đến cơ sở y tế ngay.", "d": 1, "g": "Giữ khoảng cách an toàn, không kích động con rắn."}, {"t": "Lấy gậy đánh con rắn.", "d": 0, "g": "Rắn có thể tấn công lại."}, {"t": "Chạy hoảng loạn vào bụi rậm.", "d": 0, "g": "Dễ ngã, có thể gặp thêm rắn."}, {"t": "Lại gần chụp ảnh.", "d": 0, "g": "Đến gần rắn rất nguy hiểm."}]}], "loi": "Khi đi qua nơi cây cối rậm rạp, em cần chú ý gì?", "id": "c3-t4"}, {"cd": 4, "trang": "tr.30", "nhan": "Hoạt động 1", "ten": "Sinh nhật của Hằng", "canh": {"nen": "nha", "nguoi": [{"x": 140, "ao": "#ec4899", "toc": "dai", "cam": "lo"}, {"x": 250, "ao": "#a855f7", "toc": "buoc", "cam": "vui"}, {"x": 330, "ao": "#22c55e", "toc": "ngan", "cam": "vui"}], "vat": [["banh-kem", 200, 215], ["ly-nuoc", 290, 215]], "loi": [[270, 40, "Gọi thêm trà sữa nhé!"]]}, "tom": "Bố mẹ Hằng là công nhân, thường phải tăng ca. Mẹ cho Hằng 300 000 đồng tổ chức sinh nhật. Hằng định mua bánh, nến, hoa và đặt phông nền đẹp, nhưng thấy phông đắt nên mua phụ kiện về tự trang trí, có thể tiết kiệm khoảng 50 000 đồng. Trong buổi tiệc, các bạn đề nghị gọi thêm trà sữa; Hằng giật mình nhưng vẫn gật đầu đồng ý.", "nv": [{"loai": "chon", "hoi": "Em nhận xét gì về cách chi tiêu của Hằng?", "chon": [{"t": "Hằng biết tự trang trí để tiết kiệm, nhưng chưa kiểm soát được khi đồng ý mua thêm trà sữa ngoài dự tính.", "d": 1, "g": "Đánh giá đủ cả điểm tốt và điểm chưa tốt."}, {"t": "Hằng chi tiêu rất hợp lí, không cần rút kinh nghiệm.", "d": 0, "g": "Mua thêm trà sữa ngoài kế hoạch có thể vượt số tiền."}, {"t": "Hằng nên đặt phông nền đắt cho đẹp.", "d": 0, "g": "Đẹp nhưng vượt khả năng chi tiêu."}, {"t": "Hằng nên tiêu hết số tiền mẹ cho.", "d": 0, "g": "Tiết kiệm được thì nên để dành."}]}], "loi": "Khi đi chơi với bạn, em làm gì để không chi tiêu quá số tiền mình có?", "id": "c4-t1"}, {"cd": 4, "trang": "tr.30", "nhan": "Tình huống 1", "ten": "Lan đi chợ", "canh": {"nen": "duonglang", "nguoi": [{"x": 150, "ao": "#ec4899", "toc": "dai", "cam": "lo"}, {"x": 270, "ao": "#a855f7", "toc": "buoc", "cam": "vui", "vai": "nguoi-lon"}], "vat": [["ca", 220, 215], ["dong-xu", 100, 220]], "loi": [[270, 40, "Cháu mua mớ cá này đi!"]]}, "tom": "Mẹ đưa Lan 100 000 đồng đi chợ, dặn mua cả rau, mắm, muối. Ở chợ, cô hàng xóm mời Lan mua mớ cá giá 90 000 đồng. Lan muốn ủng hộ cô.", "nv": [{"loai": "chon", "hoi": "Lan nên làm gì?", "chon": [{"t": "Mua đủ những thứ mẹ dặn trước; nếu muốn mua cá thì gọi hỏi ý mẹ, hoặc lễ phép hẹn cô hôm khác.", "d": 1, "g": "Chi tiêu theo kế hoạch, tôn trọng lời dặn của mẹ."}, {"t": "Mua ngay mớ cá 90 000 đồng.", "d": 0, "g": "Sẽ không đủ tiền mua rau, mắm, muối."}, {"t": "Mua cá rồi nói với mẹ là hết tiền.", "d": 0, "g": "Không trung thực với mẹ."}, {"t": "Mượn tiền cô hàng xóm để mua cả hai.", "d": 0, "g": "Vay mượn khi chưa hỏi ý bố mẹ là không nên."}]}], "loi": "Khi được giao tiền đi mua đồ, em làm thế nào để chi tiêu đúng?", "id": "c4-t2"}, {"cd": 4, "trang": "tr.30", "nhan": "Tình huống 2", "ten": "Tiền mừng tuổi của Hà", "canh": {"nen": "nha", "nguoi": [{"x": 170, "ao": "#ec4899", "toc": "dai", "cam": "lo"}], "vat": [["dong-xu", 260, 215], ["quan-ao", 320, 210]], "loi": []}, "tom": "Hà có 300 000 đồng tiền mừng tuổi, định mua một chiếc áo ấm. Áo cũ của Hà hơi ngắn nhưng vẫn mặc được. Công việc của bố đang gặp khó khăn, chi phí của gia đình hạn hẹp.", "nv": [{"loai": "chon", "hoi": "Nếu là Hà, em sẽ làm gì?", "chon": [{"t": "Hỏi ý kiến bố mẹ; vì áo cũ còn mặc được nên có thể chưa mua, để dành tiền cho khoản cần hơn của gia đình.", "d": 1, "g": "Cân nhắc nhu cầu thật sự và hoàn cảnh gia đình."}, {"t": "Mua ngay áo đắt nhất cho đẹp.", "d": 0, "g": "Chưa cân nhắc hoàn cảnh gia đình."}, {"t": "Tiêu hết vào đồ ăn vặt.", "d": 0, "g": "Chi tiêu không có kế hoạch."}, {"t": "Giấu bố mẹ để tự tiêu.", "d": 0, "g": "Nên trao đổi với bố mẹ."}]}], "loi": "Em đã dùng tiền mừng tuổi của mình như thế nào?", "id": "c4-t3"}, {"cd": 5, "trang": "tr.34", "nhan": "Hoạt động 1", "ten": "Chăm sóc đúng cách", "canh": {"nen": "nha", "nguoi": [{"x": 130, "ao": "#64748b", "toc": "bac", "cam": "buon", "vai": "nguoi-lon"}, {"x": 250, "ao": "#ec4899", "toc": "dai", "cam": "lo"}], "vat": [["lo-thuoc", 200, 215], ["ly-nuoc", 300, 215]], "loi": []}, "tom": "Bố đi làm về vừa đói vừa mệt, Minh pha nước chanh mời bố. Bà bị đau bụng đi ngoài, Hương tìm lọ thuốc kháng sinh đưa bà uống trong lúc chờ bố mẹ về.", "nv": [{"loai": "phan-loai", "hoi": "Xếp mỗi việc làm vào đúng nhóm.", "thung": ["Nên làm", "Không nên làm"], "the": [{"t": "Pha nước chanh cho bố uống khi bố đang đói", "th": 1, "g": "SGK: không nên cho uống nước chanh khi bụng đang đói."}, {"t": "Tự lấy thuốc kháng sinh cho bà uống", "th": 1, "g": "SGK: thuốc kháng sinh phải dùng theo đơn bác sĩ."}, {"t": "Mời bố ngồi nghỉ, dọn cơm cho bố ăn", "th": 0, "g": "Phù hợp khi bố vừa đói vừa mệt."}, {"t": "Cho bà nằm nghỉ, gọi ngay bố mẹ hoặc người lớn", "th": 0, "g": "Báo người lớn để đưa bà đi khám kịp thời."}]}], "loi": "Em đã từng chăm sóc người thân khi bị mệt, ốm như thế nào?", "id": "c5-t1"}, {"cd": 5, "trang": "tr.35", "nhan": "Tình huống 1", "ten": "Bố mệt trong bữa cơm", "canh": {"nen": "nha", "nguoi": [{"x": 140, "ao": "#3b82f6", "toc": "ngan", "cam": "buon", "vai": "nguoi-lon"}, {"x": 260, "ao": "#ec4899", "toc": "dai", "cam": "lo"}], "vat": [["noi-com", 200, 215]], "loi": []}, "tom": "Bố Lan mệt mỏi vì công việc. Trong bữa ăn, bố uể oải, ăn không ngon miệng.", "nv": [{"loai": "chon", "hoi": "Lan nên làm gì?", "chon": [{"t": "Hỏi han bố, gắp món bố thích; sau bữa ăn dọn dẹp để bố nghỉ ngơi, có thể bóp vai cho bố.", "d": 1, "g": "Lời nói và việc làm quan tâm giúp bố thoải mái hơn."}, {"t": "Ăn nhanh rồi đi chơi.", "d": 0, "g": "Thờ ơ khi bố đang mệt."}, {"t": "Kể chuyện ồn ào cho bố vui.", "d": 0, "g": "Bố đang mệt, cần yên tĩnh."}, {"t": "Hỏi bố sao không ăn rồi thôi.", "d": 0, "g": "Chưa có hành động chăm sóc cụ thể."}]}], "loi": "Em làm gì khi thấy người thân mệt mỏi sau giờ làm việc?", "id": "c5-t2"}, {"cd": 5, "trang": "tr.35", "nhan": "Tình huống 2", "ten": "Trông ông ở bệnh viện", "canh": {"nen": "nha", "nguoi": [{"x": 150, "ao": "#64748b", "toc": "bac", "cam": "lo", "vai": "nguoi-lon"}, {"x": 280, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}], "vat": [["giuong", 160, 225]], "loi": []}, "tom": "Ông Vinh bị ốm nặng, phải nằm viện. Cuối tuần, Vinh vào trông ông. Ông bất ngờ lên cơn ho và muốn nôn.", "nv": [{"loai": "chon", "hoi": "Vinh nên làm gì?", "chon": [{"t": "Đỡ ông ngồi dậy hoặc nằm nghiêng, đưa khăn, chậu; bấm chuông hoặc gọi ngay y tá, bác sĩ.", "d": 1, "g": "Giúp ông an toàn và nhờ nhân viên y tế kịp thời."}, {"t": "Tự lấy thuốc cho ông uống.", "d": 0, "g": "Ở bệnh viện, thuốc do bác sĩ chỉ định."}, {"t": "Chạy về nhà gọi bố mẹ.", "d": 0, "g": "Để ông một mình lúc đang mệt là nguy hiểm."}, {"t": "Ngồi chờ ông hết ho.", "d": 0, "g": "Cần hỗ trợ và báo y tá ngay."}]}], "loi": "Em biết những việc gì có thể làm khi trông người thân nằm viện?", "id": "c5-t3"}, {"cd": 5, "trang": "tr.37", "nhan": "Hoạt động 1", "ten": "Hiếu và lời góp ý", "canh": {"nen": "nha", "nguoi": [{"x": 110, "ao": "#a855f7", "toc": "buoc", "cam": "buon", "vai": "nguoi-lon"}, {"x": 190, "ao": "#3b82f6", "toc": "ngan", "cam": "buon", "vai": "nguoi-lon"}, {"x": 290, "ao": "#f97316", "toc": "ngan", "cam": "gian"}], "vat": [["tivi", 350, 150]], "loi": [[290, 40, "Sao bố mẹ cứ can thiệp vào con thế?"]]}, "tom": "Hiếu ham chơi, sao nhãng việc học, còn bỏ mặc em ốm. Bố mẹ góp ý thì Hiếu mắt không rời ti vi, chưa nghe hết đã cãi: “Sao bố mẹ cứ thích can thiệp vào cuộc sống của con thế?”. Bố mẹ rất buồn và thất vọng.", "nv": [{"loai": "chon", "hoi": "Hiếu nên làm gì?", "chon": [{"t": "Tắt ti vi, nhìn bố mẹ, nghe hết ý kiến, nhận lỗi và thay đổi.", "d": 1, "g": "Đó là lắng nghe tích cực: dừng việc, tập trung, đặt mình vào vị trí người thân."}, {"t": "Vừa xem ti vi vừa “vâng” cho xong.", "d": 0, "g": "Nghe cho có, không tiếp thu."}, {"t": "Cãi lại để bố mẹ thôi nói.", "d": 0, "g": "Thiếu tôn trọng, làm bố mẹ buồn."}, {"t": "Bỏ vào phòng đóng cửa.", "d": 0, "g": "Né tránh không giải quyết được vấn đề."}]}], "loi": "Khi bố mẹ góp ý, em thường phản ứng thế nào? Em muốn thay đổi điều gì?", "id": "c5-t4"}, {"cd": 5, "trang": "tr.38", "nhan": "Tình huống 1", "ten": "Hảo và trò chơi điện tử", "canh": {"nen": "nha", "nguoi": [{"x": 130, "ao": "#a855f7", "toc": "buoc", "cam": "binh", "vai": "nguoi-lon"}, {"x": 260, "ao": "#22c55e", "toc": "ngan", "cam": "vui"}], "vat": [["dien-thoai", 300, 160]], "loi": [[130, 40, "Xong việc nhà, học bài rồi mới chơi nhé!"]]}, "tom": "Hảo ham chơi trò chơi điện tử, quên cả học và lao động. Mẹ nói Hảo chỉ được chơi khi đã làm xong việc nhà và học bài.", "nv": [{"loai": "chon", "hoi": "Nếu là Hảo, em sẽ làm gì?", "chon": [{"t": "Dừng chơi, lắng nghe mẹ, đồng ý và cùng mẹ thống nhất thời gian chơi hợp lí.", "d": 1, "g": "Lắng nghe tích cực, tiếp thu ý kiến xác đáng."}, {"t": "Chơi nốt ván rồi tính.", "d": 0, "g": "Chưa tôn trọng lời mẹ."}, {"t": "Lén chơi khi mẹ không để ý.", "d": 0, "g": "Không trung thực."}, {"t": "Cãi rằng bạn bè ai cũng chơi /* ngân sách */
var MUC = [{ t: "Chi thiết yếu (ăn sáng, học tập…)", m: "#0ea5e9" }, { t: "Chi sở thích (vui chơi, giải trí…)", m: "#f97316" }, { t: "Cho, tặng (quà, từ thiện…)", m: "#ec4899" }, { t: "Tiết kiệm", m: "#16a34a" }];

function layPT() { return [0, 1, 2, 3].map(function (i) { return +document.getElementById("tr" + i).value; }); }
function capNhatNS() {

    g += v >= tong ? '<circle cx="100" cy="100" r="80" fill="' + MUC[i].m + '"/>' : '<path d="M100 100 L' + x1 + ' ' + y1 + ' A80 80 0 ' + (a > Math.PI ? 1 : 0) + ' 1 ' + x2 + ' ' + y2 + 'Z" fill="' + MUC[i].m + '" stroke="#fff" stroke-width="2"/>';

  g += '<circle cx="100" cy="100" r="44" fill="#fff"/><text x="100" y="98" text-anchor="middle" font-size="22" font-weight="900" fill="' + (s === 100 ? "#16a34a" : "#dc2626") + '">' + s + '%</text><text x="100" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">đã phân bổ</text>';

function kiemNS() {
  if (TT.xong) return;
  var nv = TT.t.nv[TT.b], p = layPT(), s = p.reduce(function (a, b) { return a + b; }, 0), ds;
  if (nv.dich) {

/* lời của em */

  p.innerHTML = chamTienTrinh() + '<div class="cu">' + cu(86) + '<div class="bong-noi">' + e(t.loi) + '</div></div>'
    + '<div class="loi-em" style="margin-top:12px"><textarea id="oLoi" maxlength="600" placeholder="Viết 1–3 câu bằng lời của em… (không ghi họ tên ai)">' + e(cu_ ? cu_.text : "") + '</textarea></div>'
    + '<div style="font-size:13px;color:var(--chu2);margin-top:4px">Phần này không chấm điểm. Thầy cô xem trong file xuất.</div>'
    + '<div class="hang-nut"><button class="nut phu" onclick="hoanThanh(false)">Bỏ qua</button><button class="nut" onclick="hoanThanh(true)">Lưu và hoàn thành ⭐</button></div>';
}

  var ds = DL.tinh_huong.filter(function (x) { return x.cd === t.cd; }), k = ds.indexOf(t), sau = ds[k + 1];

}

/* ---------------- GIÁO VIÊN ---------------- */
function duLieuThu() {
  var luot = [], loi = [], ma = ["Nhóm 1", "Nhóm 2", "Nhóm 3", "Nhóm 4", "Nhóm 5", "Nhóm 6"], r = 7;
  function ng() { r = (r * 9301 + 49297) % 233280; return r / 233280; }
  DL.tinh_huong.forEach(function (t, k) { ma.forEach(function (m) { t.nv.forEach(function (_, i) { var kho = (t.cd === 4 && i === 1) || t.id === "c3-t8" || t.id === "c2-t4" ? .45 : .78; var d = ng() < kho; luot.push({ ma: m, id: t.id, nv: i, dung: d ? 1 : 0, lan: d ? 1 : 2 + Math.floor(ng() * 2), t: "2026-11-2" + (k % 5) + "T08:00:00" }); }); }); });

}
function thongKe(kho) {

  return theo;
}
function veGV(m, q) {
  var kho = q.mau ? duLieuThu() : KHO, tk = thongKe(kho), ds = Object.keys(tk).map(function (k) { return tk[k]; });
  var tongN = kho.luot.length, tongD = kho.luot.reduce(function (a, l) { return a + l.dung; }, 0);
  var soMa = {}; kho.luot.forEach(function (l) { soMa[l.ma] = 1; });
  var h = (q.mau ? '<div class="dai-thu">DỮ LIỆU THỬ — CHỈ ĐỂ XEM GIAO DIỆN</div>' : '')
    + '<div class="kinh" style="padding:18px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="font-size:34px">📊</div><div><h2 style="margin:0">Bảng của thầy cô</h2><div style="color:var(--chu2);font-weight:600">Dữ liệu nằm trong trình duyệt của máy này. Cuối tuần nhớ bấm “Sao lưu”.</div></div><button class="nut phu" style="margin-left:auto" onclick="diToi(\'trang-chu\')">← Trang chủ</button></div>'
    + '<div class="kpi"><div style="--k:#4f46e5"><b>' + tongN + '</b><span>lượt làm nhiệm vụ</span></div><div style="--k:#0ea5e9"><b>' + Object.keys(soMa).length + '</b><span>mã HS / nhóm đã làm</span></div><div style="--k:#16a34a"><b>' + (tongN ? Math.round(100 * tongD / tongN) : 0) + '%</b><span>đúng ngay lần đầu</span></div><div style="--k:#ec4899"><b>' + kho.loi.length + '</b><span>“lời của em” đã viết</span></div></div>'
    + '<h3 style="margin:16px 0 6px">Tỉ lệ đúng ngay lần đầu theo tình huống</h3><div class="thu"><canvas id="bieuDo"></canvas></div>'
    + '<h3 style="margin:16px 0 6px">5 nhiệm vụ lớp hay chọn sai nhất → gợi ý nội dung cho tiết Sinh hoạt lớp</h3><table class="bang-sai"><tr><th>Tình huống</th><th>Nhiệm vụ</th><th>Số lượt</th><th>Đúng lần đầu</th></tr>'
    + ds.filter(function (x) { return x.n; }).sort(function (a, b) { return a.d / a.n - b.d / b.n; }).slice(0, 5).map(function (x) { var t = TH[x.id]; return '<tr><td><b>' + e(t.ten) + '</b> <span class="huy">CĐ' + t.cd + ' · ' + t.trang + '</span></td><td>' + (x.nv + 1) + '. ' + e(t.nv[x.nv].hoi) + '</td><td>' + x.n + '</td><td style="font-weight:900;color:' + (x.d / x.n < .6 ? "#dc2626" : "#16a34a") + '">' + Math.round(100 * x.d / x.n) + '%</td></tr>'; }).join("")
    + '</table>' + (ds.length ? '' : '<p style="color:var(--chu2)">Chưa có lượt làm nào trên máy này.</p>')
    + '<div class="hang-nut" style="justify-content:flex-start"><button class="nut" onclick="xuatCSV()">⬇ Xuất kết quả (CSV)</button><button class="nut" onclick="xuatLoi()">⬇ Xuất lời của em (CSV)</button><button class="nut phu" onclick="saoLuu()">💾 Sao lưu</button><label class="nut phu" style="display:inline-flex;align-items:center">📂 Nhập sao lưu<input type="file" accept=".json" style="display:none" onchange="nhapSaoLuu(this)"></label><button class="nut phu" onclick="xoaDL()">🗑 Xoá dữ liệu</button></div></div>';
  m.innerHTML = h;
  veBieuDo(tk);
}
function veBieuDo(tk) {
  var cv = document.getElementById("bieuDo"), r = cv.getBoundingClientRect(), dp = window.devicePixelRatio || 1;
  cv.width = r.width * dp; cv.height = r.height * dp; var x = cv.getContext("2d"); x.scale(dp, dp);
  var W = r.width, H = r.height, L = 40, B = 46, n = DL.tinh_huong.length, bw = (W - L - 10) / n;
  x.font = "12px Segoe UI"; x.fillStyle = "#64748b"; x.strokeStyle = "#e2e8f0";
  [0, 25, 50, 75, 100].forEach(function (v) { var y = H - B - (H - B - 14) * v / 100; x.beginPath(); x.moveTo(L, y); x.lineTo(W, y); x.stroke(); x.fillText(v + "%", 4, y + 4); });
  DL.tinh_huong.forEach(function (t, i) {
    var n_ = 0, d = 0; Object.keys(tk).forEach(function (k) { if (tk[k].id === t.id) { n_ += tk[k].n; d += tk[k].d; } });
    var v = n_ ? d / n_ : 0, h = (H - B - 14) * v, x0 = L + i * bw + 3;
    var g = x.createLinearGradient(0, H - B - h, 0, H - B); g.addColorStop(0, CD[t.cd].mau); g.addColorStop(1, "#ffffff");
    x.fillStyle = n_ ? g : "#f1f5f9"; x.beginPath(); if (x.roundRect) x.roundRect(x0, H - B - h, bw - 6, h, 5); else x.rect(x0, H - B - h, bw - 6, h); x.fill();
    x.save(); x.translate(x0 + (bw - 6) / 2, H - B + 8); x.rotate(Math.PI / 3); x.fillStyle = "#334155"; x.font = "11px Segoe UI"; x.fillText(t.id.replace("c", "CĐ").replace("-t", "-"), 0, 0); x.restore();
  });
}
function taiFile(ten, noiDung, kieu) {
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([noiDung], { type: kieu })); a.download = ten; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function oCSV(v) { v = String(v == null ? "" : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function ngayTen() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function xuatCSV() {
  var dong = [["Ma", "ChuDe", "TinhHuong", "TrangSGK", "NhiemVu", "DungLanDau", "SoLanThu", "ThoiGian"]];
  KHO.luot.forEach(function (l) { var t = TH[l.id]; if (t) dong.push([l.ma, t.cd, t.ten, t.trang, l.nv + 1, l.dung ? "Có" : "Không", l.lan, l.t]); });
  taiFile("ket-qua-tinh-huong-HDTN7-" + ngayTen() + ".csv", "﻿" + dong.map(function (r) { return r.map(oCSV).join(","); }).join("\n"), "text/csv");
}
function xuatLoi() {
  var dong = [["Ma", "ChuDe", "TinhHuong", "TrangSGK", "LoiCuaEm", "ThoiGian"]];
  KHO.loi.forEach(function (l) { var t = TH[l.id]; if (t) dong.push([l.ma, t.cd, t.ten, t.trang, l.text, l.t]); });
  taiFile("loi-cua-em-HDTN7-" + ngayTen() + ".csv", "﻿" + dong.map(function (r) { return r.map(oCSV).join(","); }).join("\n"), "text/csv");
}
function saoLuu() { taiFile("sao-luu-tinh-huong-HDTN7-" + ngayTen() + ".json", JSON.stringify(KHO), "application/json"); }
function nhapSaoLuu(inp) {
  var f = inp.files[0]; if (!f) return;
  var r = new FileReader(); r.onload = function () { try { var k = JSON.parse(r.result); if (!k.luot) throw 0; KHO.luot = KHO.luot.concat(k.luot); KHO.loi = KHO.loi.concat(k.loi || []); ghiKho(); alert("Đã nhập thêm " + k.luot.length + " lượt."); ve(); } catch (e) { alert("File không đúng định dạng sao lưu của app."); } }; r.readAsText(f);
}
function xoaDL() { if (confirm("Xoá toàn bộ kết quả trên máy này? Nên bấm Sao lưu trước. Không khôi phục được.")) { KHO.luot = []; KHO.loi = []; ghiKho(); ve(); } }

capNhatChip();
ve();
</script>
