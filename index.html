                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Upload Sách giáo khoa (PDF/Word)</label>
                        <div className="relative">
                          <input
                            type="file"
                            accept=".pdf,.doc,.docx"
                            onChange={(e) => setPpctFile(e.target.files ? e.target.files[0] : null)}
                            className="hidden"
                            id="ppct-file-upload-input"
                          />
                          <label
                            htmlFor="ppct-file-upload-input"
                            className="w-full px-3 py-2 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg flex items-center justify-between cursor-pointer transition-colors"
                          >
                            <span className="truncate text-slate-700 font-medium">{ppctFile ? ppctFile.name : 'Chọn tệp PDF / DOCX...'}</span>
                            <i data-lucide="upload-cloud" className="w-4 h-4 text-blue-600 shrink-0 ml-2"></i>
                          </label>
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                      <div className="text-xs text-blue-700 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-200 flex items-center gap-1.5">
                        <i data-lucide="info" className="w-4 h-4 shrink-0"></i>
                        <span>AI sẽ tự động đọc file SGK và phân bổ số tiết khớp 100% với tổng {ppctTotalPeriods} tiết đã nhập.</span>
                      </div>
                      <button
                        onClick={handleGeneratePpct}
                        disabled={isGeneratingPpct}
                        className="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-6 py-2.5 rounded-lg flex items-center space-x-2 shadow-md transition-all disabled:opacity-50"
                      >
                        {isGeneratingPpct ? (
                          <>
                            <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i>
                            <span>AI Đang Đọc SGK & Xử Lý PPCT...</span>
                          </>
                        ) : (
                          <>
                            <i data-lucide="sparkles" className="w-4 h-4"></i>
                            <span>Tạo Bảng Phân Phối Chương Trình 7 Cột</span>
                          </>
                        )}
                      </button>
                    </div>
                  </div>

                  {/* PPCT 7-Column Result Table Card */}
                  <div className="bg-white/90 backdrop-blur-md rounded-xl border border-slate-200/80 shadow-sm p-6 space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                      <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2">
                        <i data-lucide="table" className="w-4 h-4 text-blue-600"></i>
                        <span>Bảng Kết Quả Phân Phối Chương Trình ({ppctSubject} - {ppctGrade} • {ppctTotalPeriods} Tiết)</span>
                      </h3>
                      <span className="text-xs font-semibold text-blue-700 bg-blue-50 px-2.5 py-1 rounded border border-blue-200">
                        Cấu trúc Chuẩn 7 cột Bộ GD&ĐT
                      </span>
                    </div>

                    {isGeneratingPpct ? (
                      <div className="p-12 text-center space-y-3">
                        <i data-lucide="loader-2" className="w-8 h-8 text-blue-600 animate-spin mx-auto"></i>
                        <p className="text-sm font-semibold text-slate-700">Mô hình AI đang bóc tách chủ đề từ tài liệu SGK và cân đối tiến trình giảng dạy...</p>
                      </div>
                    ) : ppctData && ppctData.length > 0 ? (
                      <div className="overflow-x-auto rounded-lg border border-slate-200">
                        <table className="min-w-full divide-y divide-slate-200 text-xs">
                          <thead className="bg-slate-900 text-slate-200 font-semibold">
                            <tr>
                              <th className="px-3 py-3 text-left w-20">Tiết PPCT</th>
                              <th className="px-4 py-3 text-left">Tên Bài Học / Chủ Đề</th>
                              <th className="px-3 py-3 text-center w-16">Số Tiết</th>
                              <th className="px-3 py-3 text-left w-28">Thời Điểm (Tuần)</th>
                              <th className="px-4 py-3 text-left">Thiết Bị Dạy Học</th>
                              <th className="px-3 py-3 text-left w-32">Địa Điểm Dạy</th>
                              <th className="px-3 py-3 text-left w-28">Ghi Chú</th>
                            </tr>
                          </thead>
                          <tbody className="bg-white divide-y divide-slate-200 text-slate-800">
                            {ppctData.map((item, idx) => (
                              <tr key={idx} className="hover:bg-blue-50/50 transition-colors">
                                <td className="px-3 py-3 font-bold text-blue-700">{item.tietPpct}</td>
                                <td className="px-4 py-3 font-semibold text-slate-900">{item.baiHoc}</td>
                                <td className="px-3 py-3 text-center font-bold bg-slate-50">{item.soTiet}</td>
                                <td className="px-3 py-3 text-slate-600">{item.thoiDiem}</td>
                                <td className="px-4 py-3 text-slate-700">{item.thietBi}</td>
                                <td className="px-3 py-3 text-slate-700">{item.diaDiem}</td>
                                <td className="px-3 py-3 text-slate-500 italic">{item.ghiChu || '-'}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    ) : null}
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* AUTHENTICATION MODAL (LOGIN / REGISTER) */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 text-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
                {/* Modal Header */}
                <div className="bg-slate-900 p-5 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center space-x-3">
                    <div className="bg-emerald-600/20 text-emerald-400 p-2.5 rounded-xl border border-emerald-500/30">
                      <i data-lucide={authTab === 'LOGIN' ? 'log-in' : 'user-plus'} className="w-5 h-5"></i>
                    </div>
                    <div>
                      <h3 className="font-bold text-base text-white">
                        {authTab === 'LOGIN' ? 'Đăng Nhập Tài Khoản' : 'Tạo Tài Khoản Giáo Viên'}
                      </h3>
                      <p className="text-xs text-slate-400">Hệ thống Trợ lý AI Bộ môn Công nghệ & Hướng nghiệp</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowAuthModal(false)}
                    className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                {/* Switch Tabs */}
                <div className="flex border-b border-slate-800 bg-slate-950/60">
                  <button
                    onClick={() => { setAuthTab('LOGIN'); setAuthError(''); setAuthSuccess(''); }}
                    className={`flex-1 py-3 text-xs font-bold text-center border-b-2 transition-all ${
                      authTab === 'LOGIN' ? 'border-emerald-500 text-emerald-400 bg-slate-900' : 'border-transparent text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    ĐĂNG NHẬP
                  </button>
                  <button
                    onClick={() => { setAuthTab('REGISTER'); setAuthError(''); setAuthSuccess(''); }}
                    className={`flex-1 py-3 text-xs font-bold text-center border-b-2 transition-all ${
                      authTab === 'REGISTER' ? 'border-emerald-500 text-emerald-400 bg-slate-900' : 'border-transparent text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    ĐĂNG KÝ MỚI
                  </button>
                </div>

                {/* Form Body */}
                <form onSubmit={handleAuthSubmit} className="p-6 space-y-4">
                  {authError && (
                    <div className="bg-rose-500/10 border border-rose-500/30 text-rose-300 p-3 rounded-xl text-xs flex items-center gap-2">
                      <i data-lucide="alert-circle" className="w-4 h-4 shrink-0 text-rose-400"></i>
                      <span>{authError}</span>
                    </div>
                  )}

                  {authSuccess && (
                    <div className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 p-3 rounded-xl text-xs flex items-center gap-2">
                      <i data-lucide="check-circle-2" className="w-4 h-4 shrink-0 text-emerald-400"></i>
                      <span>{authSuccess}</span>
                    </div>
                  )}

                  {authTab === 'REGISTER' && (
                    <>
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Họ và Tên Giáo Viên *</label>
                        <div className="relative">
                          <i data-lucide="user" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                          <input
                            type="text"
                            required
                            value={authForm.fullName}
                            onChange={(e) => setAuthForm({ ...authForm, fullName: e.target.value })}
                            className="w-full pl-9 pr-3 py-2 text-sm bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-emerald-500"
                            placeholder="Thầy/Cô Nguyễn Văn A"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1">Trường Công Tác</label>
                          <input
                            type="text"
                            value={authForm.schoolName}
                            onChange={(e) => setAuthForm({ ...authForm, schoolName: e.target.value })}
                            className="w-full px-3 py-2 text-sm bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-emerald-500"
                            placeholder="THCS Chu Văn An"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-1">Phân Môn</label>
                          <select
                            value={authForm.subject}
                            onChange={(e) => setAuthForm({ ...authForm, subject: e.target.value })}
                            className="w-full px-3 py-2 text-sm bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-emerald-500"
                          >
                            <option value="Công nghệ">Công nghệ</option>
                            <option value="Hoạt động trải nghiệm, hướng nghiệp">HĐTN, Hướng nghiệp</option>
                            <option value="Công nghệ & Hướng nghiệp">Cả 2 phân môn</option>
                          </select>
                        </div>
                      </div>
                    </>
                  )}

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Địa chỉ Email *</label>
                    <div className="relative">
                      <i data-lucide="mail" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                      <input
                        type="email"
                        required
                        value={authForm.email}
                        onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                        className="w-full pl-9 pr-3 py-2 text-sm bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-emerald-500"
                        placeholder="teacher@edu.vn"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Mật khẩu *</label>
                    <div className="relative">
                      <i data-lucide="lock" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                      <input
                        type="password"
                        required
                        value={authForm.password}
                        onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                        className="w-full pl-9 pr-3 py-2 text-sm bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-emerald-500"
                        placeholder="••••••••"
                      />
                    </div>
                  </div>

                  {authTab === 'REGISTER' && (
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Nhập lại Mật khẩu *</label>
                      <div className="relative">
                        <i data-lucide="shield-check" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                        <input
                          type="password"
                          required
                          value={authForm.confirmPassword}
                          onChange={(e) => setAuthForm({ ...authForm, confirmPassword: e.target.value })}
                          className="w-full pl-9 pr-3 py-2 text-sm bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-emerald-500"
                          placeholder="••••••••"
                        />
                      </div>
                    </div>
                  )}

                  <button
                    type="submit"
                    className="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm py-2.5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
                  >
                    <i data-lucide={authTab === 'LOGIN' ? 'log-in' : 'user-plus'} className="w-4 h-4"></i>
                    <span>{authTab === 'LOGIN' ? 'Xác Nhận Đăng Nhập' : 'Tạo Tài Khoản Mới'}</span>
                  </button>

                  {authTab === 'LOGIN' && (
                    <div className="text-center pt-2 text-xs text-slate-400">
                      Chưa có tài khoản?{' '}
                      <button
                        type="button"
                        onClick={() => { setAuthTab('REGISTER'); setAuthError(''); setAuthSuccess(''); }}
                        className="text-emerald-400 font-semibold hover:underline"
                      >
                        Đăng ký ngay tại đây
                      </button>
                      <div className="mt-2 text-[11px] bg-slate-950/70 p-2.5 rounded-lg border border-slate-800 space-y-1 text-left">
                        <p className="text-emerald-400 font-semibold flex items-center gap-1">
                          <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                          <span>Tài khoản Admin: <strong>dangvansach86@gmail.com</strong> (hoặc <strong>dangvansach86</strong>) | MK: <strong>20121984@</strong></span>
                        </p>
                        <p className="text-slate-400">
                          💡 Tài khoản Demo Giáo viên: <strong>teacher.demo@edu.vn</strong> | MK: <strong>123456</strong>
                        </p>
                      </div>
                    </div>
                  )}
                </form>
              </div>
            </div>
          )}

          {/* FOOTER - STUDENT & SYSTEM CREDITS FROM DIAGRAM */}
          <footer className="bg-slate-900 text-slate-400 border-t border-slate-800 py-4 text-xs mt-auto">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
              <div className="flex items-center space-x-2">
                <i data-lucide="crown" className="w-4 h-4 text-amber-400"></i>
                <span>Admin Quản Trị Hệ Thống: <strong className="text-white">Đặng Văn Sạch (dangvansach86)</strong></span>
              </div>
              <p className="text-slate-500">Dự án Classroom App • Tự động hóa Giảng dạy Môn Công nghệ & Hướng nghiệp GDPT 2018</p>
              <div>Xuất bản: 24/08/2026 19:39</div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
