      {

        title: 'Kế hoạch bài dạy: Quy trình thiết kế kỹ thuật',
        gradeLevel: 8,
        subjectModule: 'Công nghệ',
        topicName: 'Thiết kế kỹ thuật',
        durationPeriods: 2,
        contentMarkdown: `# BÀI DẠY: QUY TRÌNH THIẾT KẾ KỸ THUẬT (LỚP 8)\n- Môn học: Công nghệ\n- Thời lượng: 2 tiết\n\n## I. MỤC TIÊU BÀI HỌC\n1. Kiến thức: Trình bày được các bước chính trong quy trình thiết kế kỹ thuật.\n2. Năng lực: Vận dụng quy trình thiết kế để đề xuất sản phẩm học tập đơn giản.\n3. Phẩm chất: Cẩn thận, làm việc nhóm khoa học.\n\n## II. THIẾT BỊ DẠY HỌC VÀ HỌC LIỆU\n1. Giáo viên: Kế hoạch bài dạy, máy chiếu, sơ đồ quy trình 5 bước.\n2. Học sinh: SGK Công nghệ 8, phiếu học tập số 1.\n\n## III. TIẾN TRÌNH DẠY HỌC (CÔNG VĂN 5512)\n### HOẠT ĐỘNG 1: MỞ ĐẦU (KHỞI ĐỘNG - 5-7 phút)\na) Mục tiêu: Tạo nhu cầu tìm hiểu về cách thiết kế chiếc hộp đựng dụng cụ học tập.\nb) Nội dung: GV giao nhiệm vụ quan sát 2 mẫu hộp khác nhau.\nc) Sản phẩm: Đề xuất cải tiến của HS.\nd) Tổ chức thực hiện: GV nêu vấn đề -> HS thảo luận cặp đôi -> GV kết luận dẫn dắt vào bài.\n\n### HOẠT ĐỘNG 2: HÌNH THÀNH KIẾN THỨC MỚI (20 phút)\na) Mục tiêu: Học sinh tìm hiểu 5 bước thiết kế kỹ thuật.\nb) Nội dung: Đọc SGK, phân tích ví dụ thiết kế quạt mini.\nc) Sản phẩm: Sơ đồ tư duy 5 bước thiết kế.\nd) Tổ chức thực hiện: Nhóm 4 HS thảo luận và trình bày bảng phụ.\n\n### HOẠT ĐỘNG 3: LUYỆN TẬP (10 phút)\na) Mục tiêu: Củng cố thứ tự các bước.\nb) Nội dung: Trả lời câu hỏi trắc nghiệm tương tác.\nc) Sản phẩm: Đáp án trên phiếu bài tập.\n\n### HOẠT ĐỘNG 4: VẬN DỤNG (5 phút)\na) Mục tiêu: Vận dụng thiết kế đồ dùng tái chế tại nhà.\nb) Nội dung: Giao nhiệm vụ phác thảo ý tưởng chậu cây từ chai nhựa.\nc) Sản phẩm: Bản vẽ phác nộp vào tiết sau.`,
        createdAt: '2026-08-24 14:20'

      {
        id: '2',
        title: 'KHBD: Khám phá bản thân & Chọn nghề tương lai',

        topicName: 'Định hướng nghề nghiệp',
        durationPeriods: 3,
        contentMarkdown: `# BÀI DẠY: KHÁM PHÁ BẢN THÂN VÀ ĐỊNH HƯỚNG NGHỀ NGHIỆP (LỚP 9)\n- Môn học: Hoạt động trải nghiệm, hướng nghiệp\n- Thời lượng: 3 tiết\n\n## I. MỤC TIÊU BÀI HỌC\n- Nhận diện sở thích, năng lực cá nhân và yêu cầu của thị trường lao động hiện đại.\n- Xây dựng kế hoạch rèn luyện bản thân thích ứng với các ngành nghề kỹ thuật - công nghệ.\n\n## II. TIẾN TRÌNH DẠY HỌC\n### HOẠT ĐỘNG 1: MỞ ĐẦU - Trò chơi "Tôi là ai trong tương lai?"\n### HOẠT ĐỘNG 2: Khám phá các nhóm ngành nghề kỹ thuật phổ biến.\n### HOẠT ĐỘNG 3: Thực hành làm trắc nghiệm định hướng Holland.\n### HOẠT ĐỘNG 4: Lập sơ đồ cây nghề nghiệp cá nhân.`,

      const [gradeSelect, setGradeSelect] = useState(8);
      const [subjectSelect, setSubjectSelect] = useState('Công nghệ');
      const [periodsSelect, setPeriodsSelect] = useState(2);

          window.lucide.createIcons();

      }, [activeTab, lessons, isGenerating, generatedStreamText, showUploadModal]);

      // AI Lesson Plan Streaming Generator Handler
      const handleGenerateLesson = () => {
        setIsGenerating(true);
        setGeneratedStreamText('');

        const promptTemplate = `# BÀI DẠY: ${topicInput.toUpperCase()} (LỚP ${gradeSelect})\n- Môn học: ${subjectSelect}\n- Thời lượng: ${periodsSelect} tiết\n\n## I. MỤC TIÊU BÀI HỌC\n1. Kiến thức: Nêu được khái niệm ${topicInput}, ưu điểm của mô hình ứng dụng công nghệ cao trong thực tiễn.\n2. Năng lực:\n   - Năng lực Công nghệ: Nhận thức các thiết bị cảm biến, hệ thống tưới tự động trong nhà kính.\n   - Năng lực chung: Giao tiếp & Hợp tác nhóm khi thiết kế mô hình.\n3. Phẩm chất: Yêu thiên nhiên, có ý thức ứng dụng công nghệ bảo vệ môi trường.\n\n## II. THIẾT BỊ DẠY HỌC VÀ HỌC LIỆU\n- Máy chiếu, video mô phỏng nhà kính thông minh, phiếu học tập nhóm.\n\n## III. TIẾN TRÌNH DẠY HỌC (CÔNG VĂN 5512)\n\n### HOẠT ĐỘNG 1: MỞ ĐẦU (KHỞI ĐỘNG - 7 phút)\na) Mục tiêu: Kích thích tò mò về sự khác biệt giữa nông nghiệp truyền thống và công nghệ cao.\nb) Nội dung: Xem clip 2 phút về nông trại thẳng đứng tại Singapore.\nc) Sản phẩm: Câu trả lời thảo luận của đại diện các nhóm.\nd) Tổ chức thực hiện:\n   - Bước 1 (Giao nhiệm vụ): GV chiếu clip và đặt câu hỏi: "Tại sao không cần đất vẫn trồng được rau sạch?"\n   - Bước 2 (Thực hiện): HS quan sát, trao đổi cặp đôi.\n   - Bước 3 (Báo cáo): 2-3 cặp HS xung phong phát biểu.\n   - Bước 4 (Kết luận): GV nhận xét, chốt kiến thức dẫn dắt vào bài mới.\n\n### HOẠT ĐỘNG 2: HÌNH THÀNH KIẾN THỨC MỚI (20 phút)\na) Mục tiêu: Khám phá cấu tạo hệ thống tưới nhỏ giọt & điều hòa nhiệt độ trong nhà kính.\nb) Nội dung: Đọc SGK mục 2, thảo luận hoàn thành phiếu học tập số 1.\nc) Sản phẩm: Phiếu học tập đã điền đầy đủ các bộ phận chính.\nd) Tổ chức thực hiện: Chia lớp thành 4 nhóm tương ứng 4 góc trải nghiệm.\n\n### HOẠT ĐỘNG 3: LUYỆN TẬP (10 phút)\na) Mục tiêu: Củng cố nguyên lý vận hành của cảm biến độ ẩm.\nb) Nội dung: Giải quyết tình huống giả định khi thời tiết nắng nóng kéo dài.\nc) Sản phẩm: Đề xuất phương án tự động bật máy phun sương.\n\n### HOẠT ĐỘNG 4: VẬN DỤNG (5 phút)\na) Mục tiêu: Đề xuất ý tưởng mô hình trồng cây thủy canh tại góc học tập.\nb) Nội dung: Giao bài tập dự án nhóm làm tại nhà.\nc) Sản phẩm: Bản vẽ thiết kế mô hình nộp vào tuần sau.`;

        const lines = promptTemplate.split('\n');
        let currentText = '';
        let index = 0;

        const interval = setInterval(() => {
          if (index < lines.length) {
            currentText += lines[index] + '\n';
            setGeneratedStreamText(currentText);
            index++;
          } else {
            clearInterval(interval);
            setIsGenerating(false);
            // Auto save to lesson list
            const newLesson = {
              id: Date.now().toString(),
              title: `KHBD: ${topicInput}`,
              gradeLevel: Number(gradeSelect),
              subjectModule: subjectSelect,
              topicName: topicInput,
              durationPeriods: Number(periodsSelect),
              contentMarkdown: currentText,
              createdAt: new Date().toISOString().slice(0, 16).replace('T', ' ')
            };
            setLessons(prev => [newLesson, ...prev]);
            setSelectedLesson(newLesson);
          }
        }, 60);
      };

      // Export Word Function
      const exportToWord = (plan) => {
        const textContent = `TRƯỜNG THCS / THPT CHUYÊN\nTỔ MÔN: CÔNG NGHỆ - HƯỚNG NGHIỆP\n\n${plan.contentMarkdown}`;
        const blob = new Blob([textContent], { type: 'application/msword;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${plan.title.replace(/\s+/g, '_')}.doc`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

              </style>

              <pre>${plan.contentMarkdown}</pre>
              <script>window.onload = function() { window.print(); }<\/script>
            </body>
          </html>
        `);
        win.document.close();
      };

      return (

                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight tracking-wide flex items-center gap-2">
                    Classroom App <span className="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded-full border border-emerald-500/30">AI Assistant</span>
                  </h1>
                  <p className="text-xs text-slate-400">Trợ lý AI Bộ Môn Công Nghệ & Hoạt Động Trải Nghiệm - Hướng Nghiệp</p>
                </div>
              </div>

              {/* Status Indicators representing Architecture Diagram */}
              <div className="hidden md:flex items-center space-x-6 text-xs text-slate-300">
                <div className="flex items-center gap-1.5 bg-slate-800 px-3 py-1.5 rounded-md border border-slate-700">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>Vercel Edge CDN & API</span>
                </div>
                <div className="flex items-center gap-1.5 bg-slate-800 px-3 py-1.5 rounded-md border border-slate-700">
                  <i data-lucide="shield-check" className="w-4 h-4 text-cyan-400"></i>
                  <span>Supabase Auth Guard (Active)</span>
                </div>
                <div className="flex items-center gap-2 border-l border-slate-700 pl-4">
                  <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" className="w-8 h-8 rounded-full border border-emerald-500" />
                  <div className="text-left">
                    <p className="font-semibold text-white">Thầy Nguyễn Văn An</p>
                    <p className="text-[10px] text-slate-400">Giáo viên Công nghệ</p>
                  </div>
                </div>
              </div>
            </div>
          </header>

          <div className="flex-1 flex max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 gap-6">
            {/* SIDEBAR NAVIGATION */}
            <aside className="w-64 bg-white rounded-xl border border-slate-200 shadow-sm p-4 flex flex-col justify-between hidden md:flex">
              <div className="space-y-1">
                <div className="px-3 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                  Chức năng chính
                </div>
                <button
                  onClick={() => setActiveTab('AI_GENERATOR')}

                >
