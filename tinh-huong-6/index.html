<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Em xử lí tình huống – HĐTN, HN 6</title>
<style>
:root{
  --nen1:#eef4ff; --nen2:#fff4ea; --chu:#1e293b; --chu2:#475569; --kinh:rgba(255,255,255,.82); --vien:rgba(148,163,184,.35);
  --chinh:#4f46e5; --nhan1:#f97316; --nhan2:#0ea5e9; --dung:#16a34a; --dung-nen:#dcfce7; --sai:#dc2626; --sai-nen:#fee2e2;
  --cd:#4f46e5; --bong:0 10px 30px rgba(30,41,59,.12);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--chu);min-height:100vh;
  background:radial-gradient(circle at 10% 0%,#dbe7ff 0,transparent 45%),radial-gradient(circle at 95% 15%,#ffe4cc 0,transparent 40%),linear-gradient(160deg,var(--nen1),var(--nen2));}
button{font-family:inherit;cursor:pointer}
.dau{display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo h1{margin:0;font-size:26px;letter-spacing:.5px;background:linear-gradient(90deg,#4f46e5,#ec4899,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.logo small{display:block;color:var(--chu2);font-weight:600;font-size:13px}
.dau .phai{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--kinh);border:1px solid var(--vien);font-weight:700;font-size:14px}
.nut{border:0;border-radius:14px;padding:11px 18px;min-height:44px;font-weight:800;font-size:16px;color:#fff;
  background:linear-gradient(135deg,var(--cd),#ec4899);box-shadow:0 6px 16px rgba(79,70,229,.28);transition:transform .15s,box-shadow .15s}
.nut:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(79,70,229,.32)}
.nut:active{transform:translateY(1px) scale(.98)}
.nut.phu{background:var(--kinh);color:var(--chu);border:1px solid var(--vien);box-shadow:none}
.nut.nho{padding:7px 12px;min-height:38px;font-size:14px}
.nut[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.nhap{margin:0 22px 8px;padding:7px 14px;border-radius:12px;background:#fff7d6;border:1px dashed #eab308;color:#854d0e;font-weight:700;font-size:14px;text-align:center}
main{padding:6px 22px 40px;max-width:1360px;margin:0 auto}
.kinh{background:var(--kinh);border:1px solid var(--vien);border-radius:20px;box-shadow:var(--bong);backdrop-filter:blur(6px)}
.hien{animation:hien .3s ease}
@keyframes hien{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes noi{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rung{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.khong-hieu-ung *{animation:none!important;transition:none!important}
/* trang chủ */
.anh-hung{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding:22px;align-items:center}
.anh-hung h2{font-size:34px;margin:0 0 6px;line-height:1.15}
.anh-hung p{color:var(--chu2);font-size:17px;margin:6px 0 14px;line-height:1.5}
.o-ma{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.o-ma input{font-size:18px;padding:11px 14px;border-radius:14px;border:2px solid #c7d2fe;min-width:200px;font-weight:700}
.o-ma .goi-y{width:100%;font-size:13px;color:var(--chu2)}
.canh-bao-ma{color:var(--sai);font-weight:700;font-size:14px;width:100%}
.luoi-cd{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:18px}
.the-cd{position:relative;padding:16px;border-radius:20px;cursor:pointer;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--m) 12%,#fff));border:2px solid color-mix(in srgb,var(--m) 30%,transparent);box-shadow:var(--bong);transition:transform .18s}
.the-cd:hover{transform:translateY(-4px)}
.the-cd .bieu{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,var(--m),color-mix(in srgb,var(--m) 55%,#fff));box-shadow:0 6px 14px color-mix(in srgb,var(--m) 40%,transparent)}
.the-cd h3{margin:12px 0 2px;font-size:19px}
.the-cd .nho{color:var(--chu2);font-size:13px;font-weight:600}
.thanh{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:10px}
.thanh i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--m),#22c55e)}
/* chủ đề */
.tieu-de-cd{display:flex;align-items:center;gap:14px;padding:16px 20px;margin-bottom:16px}
.tieu-de-cd .bieu{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:var(--cd);color:#fff}
.tieu-de-cd h2{margin:0;font-size:26px}
.luoi-th{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.the-th{border-radius:18px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:var(--bong);border:2px solid transparent;transition:transform .18s,border-color .18s}
.the-th:hover{transform:translateY(-4px);border-color:var(--cd)}
.the-th svg{display:block;width:100%;height:auto}
.the-th .ben{padding:10px 14px 14px}
.the-th h3{margin:4px 0;font-size:18px}
.huy{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--cd) 14%,#fff);color:var(--cd)}
.huy.xong{background:var(--dung-nen);color:var(--dung)}
.huy.at{background:#ffedd5;color:#c2410c}
/* màn tình huống */
.man-th{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.khung-canh{padding:14px}
.khung-canh svg{width:100%;height:auto;border-radius:14px;display:block}
.khung-canh h2{margin:12px 4px 4px;font-size:24px}
.tom{font-size:17px;line-height:1.6;margin:6px 4px 4px}
.an-toan{margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:2px solid #fb923c;font-weight:700;color:#9a3412;display:flex;gap:10px;align-items:center}
.an-toan b{font-size:26px}
.bang-nv{padding:18px}
.cham{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.cham span{padding:5px 12px;border-radius:99px;font-weight:800;font-size:13px;background:#e2e8f0;color:#64748b}
.cham span.dang{background:var(--cd);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--cd) 25%,transparent)}
.cham span.da{background:var(--dung-nen);color:var(--dung)}
.hoi{font-size:20px;font-weight:800;margin:4px 0 12px;line-height:1.4}
.pa{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:16px;border:2px solid #e2e8f0;background:#fff;font-size:16.5px;line-height:1.45;color:var(--chu);transition:transform .12s,border-color .12s,background .2s}
.pa:hover{border-color:var(--cd);transform:translateX(3px)}
.pa .chu-cai{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;background:linear-gradient(135deg,var(--cd),#ec4899)}
.pa.dung{border-color:var(--dung);background:var(--dung-nen)}
.pa.dung .chu-cai{background:var(--dung)}
.pa.sai{border-color:var(--sai);background:var(--sai-nen);animation:rung .35s}
.pa.sai .chu-cai{background:var(--sai)}
.pa.chon{border-color:var(--cd);background:color-mix(in srgb,var(--cd) 10%,#fff)}
.pa .giai{display:block;margin-top:6px;font-size:14.5px;font-weight:600}
.pa.dung .giai{color:#166534}.pa.sai .giai{color:#991b1b}
.loi-bao{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:700;display:flex;gap:12px;align-items:center}
.loi-bao.tot{background:var(--dung-nen);color:#166534}
.loi-bao.chua{background:var(--sai-nen);color:#991b1b}
.hang-nut{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
/* phân loại */
.kho{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border-radius:14px;background:#f1f5f9;border:2px dashed #cbd5e1;margin-bottom:12px}
.the-pl{padding:9px 12px;border-radius:12px;background:#fff;border:2px solid #cbd5e1;font-weight:700;font-size:15px;cursor:grab;user-select:none;box-shadow:0 3px 8px rgba(0,0,0,.06)}
.the-pl.chon{border-color:var(--cd);box-shadow:0 0 0 4px color-mix(in srgb,var(--cd) 25%,transparent)}
.the-pl.dung{border-color:var(--dung);background:var(--dung-nen)}
.the-pl.sai{border-color:var(--sai);background:var(--sai-nen);animation:rung .35s}
.the-pl small{display:block;font-weight:600;font-size:12.5px;margin-top:3px}
.thung-hang{display:grid;gap:10px}
.thung{border-radius:16px;padding:10px;min-height:120px;background:#fff;border:2px solid var(--tm);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.thung h4{margin:0 0 4px;padding:6px 10px;border-radius:10px;color:#fff;background:var(--tm);font-size:15px;text-align:center}
.thung.sang{box-shadow:0 0 0 4px color-mix(in srgb,var(--tm) 30%,transparent)}
/* xếp bước */
.xep{list-style:none;padding:0;margin:0;position:relative}
.xep:before{content:"";position:absolute;left:24px;top:20px;bottom:20px;width:4px;border-radius:4px;background:linear-gradient(var(--cd),#ec4899,#f97316)}
.xep li{position:relative;display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px 10px 10px 8px;border-radius:14px;background:#fff;border:2px solid #e2e8f0;font-size:16px;font-weight:600;cursor:grab}
.xep li .so{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;background:var(--cd);z-index:1;box-shadow:0 0 0 4px #fff}
.xep li .chu{flex:1}
.xep li .mui{display:flex;flex-direction:column;gap:2px}
.xep li .mui button{border:0;border-radius:8px;width:34px;height:26px;background:#eef2ff;font-weight:900;color:var(--cd)}
.xep li.dung{border-color:var(--dung);background:var(--dung-nen)}.xep li.dung .so{background:var(--dung)}
.xep li.sai{border-color:var(--sai);background:var(--sai-nen)}.xep li.sai .so{background:var(--sai)}
.xep li.keo{opacity:.4}
/* ngân sách */
.ns{display:grid;grid-template-columns:1fr 210px;gap:14px;align-items:center}
.thu-nhap{padding:10px 14px;border-radius:14px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);font-weight:800;margin-bottom:10px}
.dong-ns{margin:10px 0}
.dong-ns label{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px}.dong-ns label>span:last-child{white-space:nowrap}
.dong-ns input{width:100%;accent-color:var(--mm);height:26px}
.dong-ns .tien{color:var(--chu2);font-weight:700}
.tong{margin-top:6px;padding:10px 14px;border-radius:12px;font-weight:900;text-align:center;font-size:17px}
.tong.ok{background:var(--dung-nen);color:var(--dung)}.tong.vuot{background:var(--sai-nen);color:var(--sai)}.tong.thieu{background:#fef9c3;color:#a16207}
.tieu-chi{list-style:none;padding:0;margin:10px 0 0;font-weight:700;font-size:15px}
.tieu-chi li{margin:4px 0}
/* lời của em */
.loi-em textarea{width:100%;min-height:120px;font-size:17px;padding:12px;border-radius:14px;border:2px solid #c7d2fe;font-family:inherit}
.cu{display:flex;gap:12px;align-items:flex-end}
.cu .bong-noi{flex:1;padding:12px 16px;border-radius:18px 18px 18px 4px;background:#eef2ff;font-weight:700;font-size:16px;line-height:1.45}
.cu svg{flex:none;animation:noi 3s ease-in-out infinite}
.hoan-thanh{text-align:center;padding:24px}
.sao{font-size:46px;letter-spacing:6px}
/* giáo viên */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:12px 0}
.kpi div{padding:16px;border-radius:18px;background:#fff;box-shadow:var(--bong);border-top:6px solid var(--k)}
.kpi b{display:block;font-size:36px;color:var(--k)}
.kpi span{color:var(--chu2);font-weight:700}
.thu{position:relative;height:300px}
.thu canvas{position:absolute;inset:0;width:100%;height:100%}
.bang-sai{width:100%;border-collapse:collapse;font-size:15px}
.bang-sai td,.bang-sai th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}
.dai-thu{background:repeating-linear-gradient(45deg,#fde68a,#fde68a 12px,#fef3c7 12px,#fef3c7 24px);color:#92400e;font-weight:900;text-align:center;padding:8px;border-radius:12px;margin-bottom:10px;letter-spacing:2px}
.nut-video{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;border:0;background:rgba(15,23,42,.72);color:#fff;font-size:34px;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .15s}
.nut-video:hover{transform:translate(-50%,-50%) scale(1.08)}
.khung-tranh{position:relative}
.nhan-video{position:absolute;right:12px;bottom:12px;padding:6px 12px;border-radius:999px;background:#fff;font-weight:800;font-size:14px;color:var(--cd);box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none}
#hopVideo{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.82);display:none;align-items:center;justify-content:center;padding:20px}
#hopVideo.mo{display:flex}
#hopVideo .ben{width:min(1100px,100%);background:#0f172a;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#hopVideo video{display:block;width:100%;max-height:78vh;background:#000}
#hopVideo .dong{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#e2e8f0;font-weight:700;gap:10px}
#phao{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
/* chiếu TV */
body.tv{font-size:19px}
body.tv .hoi{font-size:27px}
body.tv .pa{font-size:22px;padding:16px}
body.tv .pa .chu-cai{width:52px;height:52px;font-size:28px}
body.tv .tom{font-size:21px}
body.tv .xep li,body.tv .the-pl{font-size:20px}
body.tv .khung-canh h2{font-size:30px}
@media (max-width:620px){.thung-hang{grid-template-columns:repeat(2,1fr)!important}.pa{font-size:15.5px}.hoi{font-size:18px}.anh-hung h2{font-size:27px}}
@media (max-width:900px){.man-th,.anh-hung,.ns{grid-template-columns:1fr}.logo h1{font-size:21px}main{padding:6px 12px 30px}.dau{padding:10px 12px}.nhap{margin:0 12px 8px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gTroi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
  <linearGradient id="gTuong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
  <linearGradient id="gTuong2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
  <linearGradient id="gHong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>
  <linearGradient id="gCo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#22c55e"/></linearGradient>

  <linearGradient id="gRem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#991b1b"/><stop offset=".5" stop-color="#dc2626"/><stop offset="1" stop-color="#991b1b"/></linearGradient>

  <linearGradient id="gGom" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a3412"/><stop offset=".5" stop-color="#ea580c"/><stop offset="1" stop-color="#9a3412"/></linearGradient>
  <linearGradient id="gXu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#ca8a04"/></linearGradient>
  <radialGradient id="gDen" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs></svg>

<header class="dau">
  <div class="logo" onclick="diToi('trang-chu')" title="Về trang chủ">
    <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="#4f46e5"/><path d="M12 30c0-8 6-14 14-14s14 6 14 14" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/><circle cx="19" cy="30" r="5" fill="#fff"/><circle cx="33" cy="30" r="5" fill="#fff"/><circle cx="19" cy="30" r="2.4" fill="#1e293b"/><circle cx="33" cy="30" r="2.4" fill="#1e293b"/><path d="M24 36l2 3 2-3z" fill="#f97316"/></svg>
    <div><h1>EM XỬ LÍ TÌNH HUỐNG</h1><small>Hoạt động trải nghiệm, hướng nghiệp 6 · 26 tình huống SGK</small></div>
  </div>
  <div class="phai">
    <span class="chip" id="chipMa">👤 Chưa nhập mã</span>
    <button class="nut phu nho" id="nutAm" onclick="doiAm()">🔊 Âm thanh</button>
    <button class="nut phu nho" id="nutTV" onclick="doiTV()">📺 Chiếu TV</button>
    <button class="nut phu nho" onclick="diToi('gv')">📊 Giáo viên</button>
  </div>
</header>
<div class="nhap">✅ BẢN NHÁP — thầy/cô duyệt trước khi dùng · Nội dung bám SGK HĐTN, HN 6 (Kết nối tri thức); phương án và lời giải thích do trợ lý soạn theo phần Gợi ý của SGK</div>

<script>
"use strict";
var DL = {"chu_de": [{"cd": 1, "ten": "Em với nhà trường", "mau": "#3b82f6", "icon": "🏫", "trang": "SGK tr.6–10"}, {"cd": 2, "ten": "Khám phá bản thân", "mau": "#8b5cf6", "icon": "🔍", "trang": "SGK tr.12–14"}, {"cd": 3, "ten": "Trách nhiệm với bản thân", "mau": "#f97316", "icon": "🎯", "trang": "SGK tr.20"}, {"cd": 4, "ten": "Rèn luyện bản thân", "mau": "#10b981", "icon": "💪", "trang": "SGK tr.23–25"}, {"cd": 5, "ten": "Em với gia đình", "mau": "#ec4899", "icon": "🏡", "trang": "SGK tr.28–31"}, {"cd": 7, "ten": "Em với thiên nhiên và môi trường", "mau": "#14b8a6", "icon": "🌿", "trang": "SGK tr.42"}], "tinh_huong": [{"cd": 1, "trang": "tr.6", "nhan": "Tình huống 1", "ten": "Tâm khép mình", "canh": {"nen": "lop", "nguoi": [{"x": 100, "ao": "#ec4899", "toc": "dai", "cam": "buon"}, {"x": 260, "ao": "#a855f7", "toc": "buoc", "cam": "vui"}, {"x": 335, "ao": "#22c55e", "toc": "ngan", "cam": "vui"}], "vat": [], "loi": [[270, 40, "Tâm ơi, chơi cùng bọn mình nhé!"]]}, "tom": "Hương thấy Tâm, một bạn mới trong lớp, rất khép mình và nhút nhát. Hương muốn giúp Tâm hoà đồng với các bạn.", "nv": [{"loai": "chon", "hoi": "Hương nên làm gì để Tâm hoà đồng hơn?", "chon": [{"t": "Chủ động bắt chuyện, rủ Tâm cùng chơi, cùng làm việc nhóm và giới thiệu Tâm với các bạn.", "d": 1, "g": "Hương thân thiện, chủ động tạo cơ hội để Tâm làm quen và hoà nhập."}, {"t": "Để Tâm yên, vì chắc Tâm thích ngồi một mình.", "d": 0, "g": "Bỏ mặc khiến Tâm càng khó làm quen. Bạn mới thường cần người chủ động trước."}, {"t": "Trêu Tâm cho Tâm mạnh dạn hơn.", "d": 0, "g": "Trêu chọc làm bạn tổn thương, càng ngại giao tiếp."}, {"t": "Nói với cả lớp rằng Tâm rất nhút nhát.", "d": 0, "g": "Nói về điểm yếu của bạn trước lớp làm bạn xấu hổ."}]}], "loi": "Em đã từng giúp một bạn mới hoà đồng với lớp chưa? Em đã làm gì?", "id": "c1-t1"}, {"cd": 1, "trang": "tr.6", "nhan": "Tình huống 2", "ten": "Hưng chưa hiểu bài", "canh": {"nen": "lop", "nguoi": [{"x": 130, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}, {"x": 270, "ao": "#a855f7", "toc": "dai", "cam": "binh", "vai": "gv"}], "vat": [["sach", 190, 205]], "loi": [[130, 40, "Mình chưa hiểu bài Toán…"]], "bang": "Toán 6"}, "tom": "Sau tiết học, Hưng vẫn chưa hiểu bài Toán vừa học.", "nv": [{"loai": "chon", "hoi": "Hưng nên làm gì?", "chon": [{"t": "Mạnh dạn hỏi thầy cô, nhờ bạn giảng lại, rồi tự làm lại bài.", "d": 1, "g": "Chủ động hỏi khi chưa hiểu là cách học tốt ở môi trường mới."}, {"t": "Chép lời giải của bạn cho xong.", "d": 0, "g": "Chép bài không giúp Hưng hiểu, lần sau vẫn không làm được."}, {"t": "Bỏ qua, chắc bài sau sẽ hiểu.", "d": 0, "g": "Kiến thức Toán nối tiếp nhau, bỏ qua sẽ càng hổng."}, {"t": "Không hỏi vì sợ bị các bạn chê.", "d": 0, "g": "Hỏi khi chưa hiểu là bình thường, thầy cô và bạn bè sẵn lòng giúp."}]}], "loi": "Khi chưa hiểu bài, em thường làm gì?", "id": "c1-t2"}, {"cd": 1, "trang": "tr.9", "nhan": "Trường hợp", "ten": "Minh và Thanh", "canh": {"nen": "lop", "nguoi": [{"x": 130, "ao": "#f97316", "toc": "ngan", "cam": "gian"}, {"x": 260, "ao": "#3b82f6", "toc": "ngan", "cam": "gian"}], "vat": [["sach", 195, 205]], "loi": [[260, 40, "Sao cậu nói xấu tớ?"]]}, "tom": "Minh muốn chép bài của Thanh nhưng Thanh không cho. Minh nói xấu Thanh với các bạn. Thanh tức giận, mắng Minh. Cả hai bạn đều thấy tổn thương.", "nv": [{"loai": "phan-loai", "hoi": "Xếp mỗi việc làm vào đúng nhóm.", "thung": ["Nên làm", "Không nên làm"], "the": [{"t": "Thanh không cho Minh chép bài", "th": 0, "g": "Trung thực, giúp bạn tự học."}, {"t": "Minh nói xấu Thanh với các bạn", "th": 1, "g": "Nói xấu làm bạn tổn thương, mâu thuẫn tăng."}, {"t": "Thanh tức giận, mắng Minh", "th": 1, "g": "Mắng nhau không giải quyết được vấn đề."}, {"t": "Hai bạn gặp nhau nói chuyện để hiểu và thông cảm", "th": 0, "g": "Cách giải quyết mâu thuẫn tích cực (gợi ý SGK)."}, {"t": "Thanh giảng lại bài để Minh tự làm", "th": 0, "g": "Vừa giúp bạn, vừa không làm hộ."}]}], "loi": "Nếu là Minh, em sẽ nói gì với Thanh để làm lành?", "id": "c1-t3"}, {"cd": 1, "trang": "tr.10", "nhan": "Tình huống 1", "ten": "Hương giận Lan", "canh": {"nen": "santruong", "nguoi": [{"x": 110, "ao": "#a855f7", "toc": "buoc", "cam": "gian"}, {"x": 230, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 310, "ao": "#eab308", "toc": "dai", "cam": "vui"}], "vat": [], "loi": [[110, 40, "Lan chẳng chơi với mình nữa…"]]}, "tom": "Lan chơi thân với Hương. Gần đây Lan hay đi cùng Mai, một bạn mới. Hương giận Lan.", "nv": [{"loai": "chon", "hoi": "Nếu là Lan, em sẽ làm gì?", "chon": [{"t": "Chủ động gặp Hương nói chuyện, giải thích, rủ cả ba cùng chơi.", "d": 1, "g": "Trao đổi thẳng thắn giúp giữ tình bạn cũ mà vẫn có thêm bạn mới."}, {"t": "Mặc kệ, Hương giận thì thôi.", "d": 0, "g": "Không nói chuyện thì hiểu lầm còn mãi, tình bạn dễ rạn nứt."}, {"t": "Thôi chơi với Mai để Hương vui.", "d": 0, "g": "Không cần bỏ bạn mới. Có thể chơi chung cả ba."}, {"t": "Kể với Mai về tính hay giận của Hương.", "d": 0, "g": "Nói xấu bạn làm mâu thuẫn tăng."}]}], "loi": "Em làm gì để giữ tình bạn khi có thêm bạn mới?", "id": "c1-t4"}, {"cd": 1, "trang": "tr.10", "nhan": "Tình huống 2", "ten": "Nam rủ Hải chơi điện tử", "canh": {"nen": "santruong", "nguoi": [{"x": 140, "ao": "#f97316", "toc": "ngan", "cam": "vui"}, {"x": 260, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}], "vat": [["dien-thoai", 200, 150]], "loi": [[140, 40, "Không đi thì đừng chơi với tớ!"]]}, "tom": "Nam rủ Hải đi chơi điện tử. Hải không muốn đi. Nam doạ sẽ không chơi với Hải nữa.", "nv": [{"loai": "chon", "hoi": "Nếu là Hải, em sẽ làm gì?", "chon": [{"t": "Từ chối khéo, nói rõ lí do, rủ Nam làm việc khác lành mạnh như đá bóng, học nhóm.", "d": 1, "g": "Hải giữ được điều đúng mà vẫn giữ tình bạn."}, {"t": "Đi chơi cho Nam khỏi giận.", "d": 0, "g": "Làm việc mình không muốn chỉ vì bị doạ là bị lôi kéo."}, {"t": "Mắng Nam một trận.", "d": 0, "g": "Mắng nhau làm mâu thuẫn tăng."}, {"t": "Nói dối bố mẹ để đi chơi cùng Nam.", "d": 0, "g": "Nói dối bố mẹ là sai, lại dễ gặp nguy hiểm."}]}], "loi": "Khi bị bạn rủ làm việc em không muốn, em từ chối thế nào?", "id": "c1-t5"}, {"cd": 2, "trang": "tr.12–13", "nhan": "Ba trường hợp", "ten": "Ba bạn, ba đức tính", "canh": {"nen": "santruong", "nguoi": [{"x": 110, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 210, "ao": "#3b82f6", "toc": "ngan", "cam": "vui"}, {"x": 310, "ao": "#eab308", "toc": "buoc", "cam": "cuoi"}], "vat": [["heart", 110, 40]], "loi": []}, "tom": "SGK giới thiệu ba bạn: Hà giàu tình cảm, quan tâm, giúp đỡ mọi người; Tiến không nói dối, không quay cóp, biết từ chối điều không xứng đáng; Phương luôn tươi cười và cảm ơn khi được góp ý.", "nv": [{"loai": "phan-loai", "hoi": "Xếp mỗi biểu hiện vào đúng đức tính.", "thung": ["Nhân ái", "Trung thực", "Thân thiện, cầu tiến"], "the": [{"t": "Hà quan tâm, giúp đỡ mọi người", "th": 0, "g": "Biểu hiện của lòng nhân ái."}, {"t": "Tiến không nói dối", "th": 1, "g": "Biểu hiện của trung thực."}, {"t": "Tiến không quay cóp khi kiểm tra", "th": 1, "g": "Biểu hiện của trung thực."}, {"t": "Phương luôn tươi cười với mọi người", "th": 2, "g": "Biểu hiện của thân thiện."}, {"t": "Phương cảm ơn khi được góp ý", "th": 2, "g": "Biểu hiện của cầu tiến, khiêm tốn."}]}], "loi": "Đức tính đặc trưng của em là gì? Kể một việc em đã làm thể hiện đức tính đó.", "id": "c2-t1"}, {"cd": 2, "trang": "tr.14", "nhan": "Trường hợp", "ten": "Phong bì trong sách cũ", "canh": {"nen": "duonglang", "nguoi": [{"x": 140, "ao": "#64748b", "toc": "bac", "cam": "vui", "vai": "nguoi-lon"}, {"x": 240, "ao": "#a855f7", "toc": "buoc", "cam": "vui", "vai": "nguoi-lon"}], "vat": [["giay", 195, 200]], "loi": []}, "tom": "Bố mẹ Hiền làm nghề thu mua phế liệu. Một lần, trong chồng sách báo cũ, bố mẹ nhặt được phong bì có nhiều tiền. Dù gia đình còn khó khăn, bố mẹ Hiền vẫn tìm và mang trả lại người mất.", "nv": [{"loai": "chon", "hoi": "Theo em, giá trị của một người thể hiện ở đâu?", "chon": [{"t": "Ở phẩm chất và việc làm tốt, như trung thực, tốt bụng.", "d": 1, "g": "Bố mẹ Hiền đáng quý vì trung thực, dù nghề nghiệp bình thường và nhà còn khó khăn."}, {"t": "Ở nghề nghiệp sang trọng.", "d": 0, "g": "Nghề nào cũng đáng trân trọng. Giá trị con người không do nghề quyết định."}, {"t": "Ở số tiền người đó có.", "d": 0, "g": "Tiền bạc không làm nên giá trị một con người."}, {"t": "Ở quần áo, đồ dùng đắt tiền.", "d": 0, "g": "Vẻ ngoài không nói lên giá trị bên trong."}]}], "loi": "Em tự hào về giá trị nào của bản thân?", "id": "c2-t2"}, {"cd": 3, "trang": "tr.20", "nhan": "Tình huống 1", "ten": "Dông sét giữa cánh đồng", "canh": {"nen": "duonglang", "nguoi": [{"x": 220, "ao": "#ec4899", "toc": "dai", "cam": "lo"}], "vat": [["may-set", 290, 40], ["mua", 200, 30], ["xe-dap", 130, 205]], "loi": []}, "tom": "Hằng ngày, Mai đạp xe qua một cánh đồng để tới trường. Chiều nay, trên đường đi học về, bất ngờ một cơn dông sét xảy ra, kèm theo mưa to, gió lớn.", "nv": [{"loai": "chon", "hoi": "Mai cần làm gì để tự bảo vệ bản thân?", "chon": [{"t": "Xuống xe, tránh xa cây cao đứng một mình và cột điện; vào nhà kiên cố gần nhất để trú. Nếu không có chỗ trú thì ngồi xổm thấp, hai chân chụm lại.", "d": 1, "g": "Đây là cách phòng tránh sét thường được hướng dẫn: không đứng nơi trống trải, cao nhất vùng, không trú dưới cây cao."}, {"t": "Chạy vào trú dưới gốc cây to giữa đồng.", "d": 0, "g": "Cây cao đứng một mình rất dễ bị sét đánh."}, {"t": "Đạp xe thật nhanh qua cánh đồng.", "d": 0, "g": "Ở giữa nơi trống trải khi có sét rất nguy hiểm."}, {"t": "Đứng giữa đồng gọi điện thoại cho bố mẹ.", "d": 0, "g": "Đứng ở nơi trống trải lâu càng nguy hiểm. Hãy trú an toàn trước."}]}], "loi": "Ở địa phương em thường có loại thiên tai nào? Em cần chuẩn bị gì?", "id": "c3-t1"}, {"cd": 3, "trang": "tr.20", "nhan": "Tình huống 2", "ten": "Nước lũ qua đập tràn", "canh": {"nen": "duonglang", "nguoi": [{"x": 120, "ao": "#0ea5e9", "toc": "ngan", "cam": "lo"}, {"x": 200, "ao": "#f97316", "toc": "ngan", "cam": "vui"}, {"x": 280, "ao": "#22c55e", "toc": "ngan", "cam": "vui"}], "vat": [["nuoc-lu", 200, 205], ["mua", 200, 30]], "loi": [[240, 40, "Lội qua đi, kẻo tối!"]]}, "tom": "Pao và các bạn đang trên đường đi học về thì trời đổ mưa to, nước lũ ở đập tràn mà Pao phải đi qua dâng lên nhanh và chảy xiết. Một số bạn rủ Pao lội qua đập tràn về nhà kẻo tối.", "nv": [{"loai": "chon", "hoi": "Nếu là Pao, em sẽ làm gì?", "chon": [{"t": "Không lội qua; rủ các bạn lên chỗ cao an toàn chờ nước rút và tìm cách báo người lớn.", "d": 1, "g": "Nước lũ chảy xiết có thể cuốn trôi người lớn. Tuyệt đối không lội qua."}, {"t": "Nắm tay nhau lội qua cho nhanh.", "d": 0, "g": "Nắm tay vẫn có thể bị nước cuốn cả nhóm."}, {"t": "Dắt xe đạp lội qua chỗ nông.", "d": 0, "g": "Không biết chỗ nào nông, nước xiết vẫn rất nguy hiểm."}, {"t": "Lội thử một đoạn xem nước sâu không.", "d": 0, "g": "Thử cũng có thể bị cuốn trôi."}]}], "loi": "Em đã từng nghe chuyện nguy hiểm vì lội qua dòng nước lũ chưa? Em rút ra bài học gì?", "id": "c3-t2"}, {"cd": 3, "trang": "tr.20", "nhan": "Tình huống 3", "ten": "Nguy cơ sạt lở", "canh": {"nen": "duonglang", "nguoi": [{"x": 260, "ao": "#ec4899", "toc": "dai", "cam": "lo"}, {"x": 330, "ao": "#a855f7", "toc": "buoc", "cam": "lo", "vai": "nguoi-lon"}], "vat": [["nui-sat", 90, 175], ["mua", 200, 30]], "loi": []}, "tom": "Nhà Hà ở sát chân núi đất. Suốt tuần, mưa to tầm tã không dứt khiến núi có nguy cơ bị sạt lở.", "nv": [{"loai": "chon-nhieu", "hoi": "Hà cùng gia đình nên làm gì? Chọn TẤT CẢ việc đúng.", "chon": [{"t": "Theo dõi tin cảnh báo của chính quyền, đài phát thanh", "d": 1, "g": "Biết sớm nguy cơ để chủ động."}, {"t": "Để ý dấu hiệu: đất nứt, nước đục chảy ra từ sườn núi, tiếng động lạ", "d": 1, "g": "Đây là các dấu hiệu sạt lở thường được nhắc tới."}, {"t": "Chuẩn bị đồ dùng thiết yếu, sẵn sàng sơ tán", "d": 1, "g": "Giúp di chuyển nhanh khi cần."}, {"t": "Sơ tán đến nơi an toàn theo hướng dẫn của chính quyền", "d": 1, "g": "Tính mạng là quan trọng nhất."}, {"t": "Ở lại trong nhà vì nhà xây kiên cố", "d": 0, "g": "Sạt lở có thể vùi lấp cả nhà kiên cố."}, {"t": "Đi ra chỗ đất nứt xem cho biết", "d": 0, "g": "Đến gần chỗ đất nứt rất nguy hiểm."}]}], "loi": "Nếu ở gần khu vực có nguy cơ sạt lở, em sẽ nhắc gia đình điều gì?", "id": "c3-t3"}, {"cd": 4, "trang": "tr.23", "nhan": "Hoạt động 1", "ten": "Giao tiếp phù hợp?", "canh": {"nen": "nha", "nguoi": [{"x": 140, "ao": "#a855f7", "toc": "buoc", "cam": "lo", "vai": "nguoi-lon"}, {"x": 260, "ao": "#3b82f6", "toc": "ngan", "cam": "binh"}], "vat": [], "loi": [[260, 40, "Dạ, con không biết ạ!"]]}, "tom": "SGK đưa hai tranh: các bạn nhảy múa reo hò bên một bạn đang buồn; mẹ hỏi chìa khoá, con ngồi trên ghế trả lời “Dạ, con không biết ạ!”.", "nv": [{"loai": "phan-loai", "hoi": "Xếp mỗi cách ứng xử vào đúng nhóm.", "thung": ["Phù hợp", "Chưa phù hợp"], "the": [{"t": "Nhảy múa, reo hò bên bạn đang buồn", "th": 1, "g": "Chưa hiểu cảm xúc của bạn."}, {"t": "Ngồi yên trên ghế trả lời mẹ “Dạ, con không biết ạ!”", "th": 1, "g": "Lời lễ phép nhưng chưa đứng dậy, chưa giúp mẹ tìm."}, {"t": "Ngồi cạnh, hỏi han, lắng nghe bạn đang buồn", "th": 0, "g": "Thể hiện sự quan tâm đúng lúc."}, {"t": "Đứng dậy, nhìn mẹ trả lời, rồi cùng mẹ tìm chìa khoá", "th": 0, "g": "Vừa lễ phép, vừa biết giúp đỡ."}]}], "loi": "Kể một lần em thấy lời nói hoặc hành vi của mình chưa phù hợp. Em sẽ sửa thế nào?", "id": "c4-t1"}, {"cd": 4, "trang": "tr.24", "nhan": "Tình huống 1", "ten": "Chiếc bát vỡ", "canh": {"nen": "bep", "nguoi": [{"x": 160, "ao": "#3b82f6", "toc": "ngan", "cam": "gian"}, {"x": 260, "ao": "#eab308", "toc": "buoc", "cam": "buon", "to": 0.75}], "vat": [], "loi": [[160, 40, "Sao mà hậu đậu thế!"]]}, "tom": "Minh nhờ em rửa bát hộ. Em không may làm vỡ bát. Minh mắng em: “Sao mà hậu đậu thế!”. Em bật khóc.", "nv": [{"loai": "chon", "hoi": "Nếu là Minh, em nên nói gì?", "chon": [{"t": "“Em có bị đau tay không? Lần sau anh rửa cùng em nhé.”", "d": 1, "g": "Quan tâm em trước, nhẹ nhàng, không trách mắng."}, {"t": "Mắng tiếp cho em nhớ.", "d": 0, "g": "Lời nói nặng làm em buồn, sợ, không giúp em cẩn thận hơn."}, {"t": "Mách bố mẹ là em làm vỡ bát.", "d": 0, "g": "Minh nhờ em làm hộ việc của mình, nên cần chia sẻ trách nhiệm."}, {"t": "Im lặng bỏ đi.", "d": 0, "g": "Bỏ mặc khi em đang khóc là thiếu quan tâm."}]}], "loi": "Khi người thân làm hỏng việc, em thường nói gì?", "id": "c4-t2"}, {"cd": 4, "trang": "tr.24", "nhan": "Tình huống 2", "ten": "Đến muộn, cổng đã đóng", "canh": {"nen": "santruong", "nguoi": [{"x": 150, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}, {"x": 270, "ao": "#64748b", "toc": "bac", "cam": "binh", "vai": "nguoi-lon"}], "vat": [], "loi": [[150, 40, "Bác mở cửa đi!"]]}, "tom": "Nam đi học muộn, cổng trường đã đóng. Nam gọi bác bảo vệ: “Bác mở cửa đi!”.", "nv": [{"loai": "chon", "hoi": "Nam nên nói thế nào cho phù hợp?", "chon": [{"t": "“Cháu chào bác ạ. Cháu xin lỗi vì đến muộn. Bác cho cháu vào lớp với ạ.”", "d": 1, "g": "Chào hỏi, nhận lỗi và nhờ một cách lễ phép."}, {"t": "Giữ nguyên câu “Bác mở cửa đi!”.", "d": 0, "g": "Câu nói cộc lốc, thiếu lễ phép với người lớn."}, {"t": "Trèo qua cổng cho nhanh.", "d": 0, "g": "Vi phạm nội quy và nguy hiểm."}, {"t": "Gọi bạn trong lớp ra mở cổng.", "d": 0, "g": "Không đúng quy định, lại làm phiền giờ học của bạn."}]}], "loi": "Em thường chào hỏi, nhờ vả người lớn như thế nào?", "id": "c4-t3"}, {"cd": 4, "trang": "tr.24–25", "nhan": "Hoạt động 1, 2", "ten": "Chi tiêu của Hương", "canh": {"nen": "tien", "nguoi": [{"x": 110, "ao": "#ec4899", "toc": "dai", "cam": "vui"}], "vat": [["dong-xu", 240, 190], ["quan-ao", 320, 205]], "loi": []}, "tom": "Hương tiết kiệm được 500 000 đồng: 100 000 đồng chia sẻ người khó khăn, 150 000 đồng để dành phòng khi cần, còn 250 000 đồng mua đồ. Hương muốn mua: áo khoác 150 000 đ, đồ dùng học tập 50 000 đ, quà sinh nhật em trai 50 000 đ, giày 100 000 đ, truyện 30 000 đ.", "nv": [{"loai": "chon-nhieu", "hoi": "Với 250 000 đồng, Hương nên ưu tiên mua những gì? (SGK tr.24)", "chon": [{"t": "Áo khoác 150 000 đ", "d": 1, "g": "Món cần thiết, đúng mùa."}, {"t": "Đồ dùng học tập 50 000 đ", "d": 1, "g": "Phục vụ việc học."}, {"t": "Quà sinh nhật em trai 50 000 đ", "d": 1, "g": "Thể hiện tình cảm với em, đúng dịp."}, {"t": "Giày 100 000 đ", "d": 0, "g": "Nếu mua thêm sẽ vượt 250 000 đ; giày chưa thật cần."}, {"t": "Truyện 30 000 đ", "d": 0, "g": "Nếu mua thêm sẽ vượt số tiền; có thể mượn thư viện."}]}, {"loai": "chon", "hoi": "Ba cửa hàng bán giá khác nhau (áo: 150/145/140 nghìn; đồ dùng: 50/45/55 nghìn; quà: 45/50/55 nghìn). Hương nên mua thế nào?", "chon": [{"t": "Áo ở cửa hàng 3, đồ dùng ở cửa hàng 2, quà ở cửa hàng 1: tổng 230 000 đồng.", "d": 1, "g": "So sánh giá giúp Hương tiết kiệm thêm 20 000 đồng (SGK tr.25)."}, {"t": "Mua hết ở cửa hàng 1 cho nhanh: 245 000 đồng.", "d": 0, "g": "Không so sánh giá nên tốn hơn 15 000 đồng."}, {"t": "Chọn món đắt nhất vì chắc tốt hơn.", "d": 0, "g": "Đắt chưa chắc tốt hơn; cần xem chất lượng và giá."}, {"t": "Mua ở cửa hàng gần nhà nhất.", "d": 0, "g": "Tiện nhưng có thể đắt hơn; nên khảo giá vài nơi."}]}], "loi": "Nếu có 100 000 đồng, em sẽ ưu tiên chi cho việc gì?", "id": "c4-t4"}, {"cd": 5, "trang": "tr.28", "nhan": "Tình huống 1", "ten": "Sinh nhật bố", "canh": {"nen": "nha", "nguoi": [{"x": 170, "ao": "#ec4899", "toc": "dai", "cam": "lo"}], "vat": [["banh-kem", 280, 210]], "loi": []}, "tom": "Sắp đến sinh nhật bố. Mai băn khoăn không biết làm gì để bố vui.", "nv": [{"loai": "chon", "hoi": "Em khuyên Mai thế nào?", "chon": [{"t": "Tự làm thiệp, nói lời chúc yêu thương, cùng mẹ chuẩn bị bữa cơm ấm cúng.", "d": 1, "g": "Món quà tự làm và lời chúc chân thành là cách động viên, chăm sóc người thân."}, {"t": "Xin mẹ thật nhiều tiền mua quà đắt.", "d": 0, "g": "Quà đắt không phải điều quan trọng nhất."}, {"t": "Không cần làm gì vì bố bận.", "d": 0, "g": "Bố vẫn vui khi được con quan tâm."}, {"t": "Chờ bố nhắc rồi mới chúc.", "d": 0, "g": "Chủ động mới thể hiện sự quan tâm."}]}], "loi": "Lần sinh nhật người thân gần đây, em đã làm gì?", "id": "c5-t1"}, {"cd": 5, "trang": "tr.28", "nhan": "Tình huống 2", "ten": "Mẹ đi làm về", "canh": {"nen": "nha", "nguoi": [{"x": 130, "ao": "#a855f7", "toc": "buoc", "cam": "lo", "vai": "nguoi-lon"}, {"x": 260, "ao": "#3b82f6", "toc": "ngan", "cam": "binh"}], "vat": [["hop-qua", 175, 215]], "loi": []}, "tom": "Tuấn thấy mẹ đi làm về, xách nhiều đồ nặng, trông rất mệt.", "nv": [{"loai": "chon", "hoi": "Tuấn nên làm gì?", "chon": [{"t": "Ra đỡ đồ giúp mẹ, mời mẹ ngồi nghỉ, rót nước và hỏi han mẹ.", "d": 1, "g": "Lời nói, việc làm kịp thời giúp mẹ đỡ mệt."}, {"t": "Tiếp tục xem ti vi.", "d": 0, "g": "Thờ ơ khi mẹ mệt là thiếu quan tâm."}, {"t": "Hỏi ngay mẹ mua gì cho con.", "d": 0, "g": "Chỉ nghĩ đến mình, chưa quan tâm đến mẹ."}, {"t": "Nói mẹ cứ để đồ đó, lát con cất.", "d": 0, "g": "Chưa giúp mẹ đúng lúc mẹ cần."}]}], "loi": "Em thường làm gì khi bố mẹ đi làm về mệt?", "id": "c5-t2"}, {"cd": 5, "trang": "tr.28", "nhan": "Tình huống 3", "ten": "Ông nội ốm", "canh": {"nen": "nha", "nguoi": [{"x": 130, "ao": "#64748b", "toc": "bac", "cam": "buon", "vai": "nguoi-lon"}, {"x": 260, "ao": "#f97316", "toc": "ngan", "cam": "lo"}], "vat": [["ly-nuoc", 200, 215]], "loi": []}, "tom": "Ông nội Quân bị ốm, không đi lại được. Buổi chiều chỉ có Quân ở nhà với ông.", "nv": [{"loai": "chon", "hoi": "Quân nên làm gì?", "chon": [{"t": "Ở nhà với ông, hỏi ông cần gì, lấy nước, nhắc ông uống thuốc theo đơn và gọi bố mẹ nếu ông mệt hơn.", "d": 1, "g": "Chăm sóc ông chu đáo, biết báo người lớn khi cần."}, {"t": "Đi chơi với bạn vì ông đang ngủ.", "d": 0, "g": "Để ông ốm ở nhà một mình là thiếu trách nhiệm."}, {"t": "Tự tìm thuốc trong tủ cho ông uống.", "d": 0, "g": "Không tự ý cho người ốm uống thuốc."}, {"t": "Bật ti vi thật to cho ông vui.", "d": 0, "g": "Người ốm cần yên tĩnh để nghỉ ngơi."}]}], "loi": "Khi người thân bị ốm, em đã chăm sóc như thế nào?", "id": "c5-t3"}, {"cd": 5, "trang": "tr.28", "nhan": "Tình huống 4", "ten": "Em được cô khen", "canh": {"nen": "nha", "nguoi": [{"x": 150, "ao": "#22c55e", "toc": "ngan", "cam": "binh"}, {"x": 260, "ao": "#eab308", "toc": "ngan", "cam": "cuoi", "to": 0.75}], "vat": [["giay", 300, 205]], "loi": [[260, 60, "Em được cô khen!"]]}, "tom": "Em của Long học tập tiến bộ, được cô giáo khen.", "nv": [{"loai": "chon", "hoi": "Long nên nói, làm gì?", "chon": [{"t": "Khen em, chúc mừng em và động viên em tiếp tục cố gắng.", "d": 1, "g": "Khen ngợi thành công, dù nhỏ, là cách động viên người thân."}, {"t": "Bảo em: chuyện nhỏ thôi mà.", "d": 0, "g": "Làm em mất vui, mất động lực."}, {"t": "So sánh: ngày xưa anh còn giỏi hơn.", "d": 0, "g": "So sánh làm em buồn."}, {"t": "Không để ý vì đang bận.", "d": 0, "g": "Em cần được ghi nhận."}]}], "loi": "Em đã động viên người thân bằng lời nói nào?", "id": "c5-t4"}, {"cd": 5, "trang": "tr.30", "nhan": "Tình huống 1", "ten": "Em trai mải chơi điện tử", "canh": {"nen": "nha", "nguoi": [{"x": 150, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}, {"x": 260, "ao": "#f97316", "toc": "ngan", "cam": "vui", "to": 0.8}], "vat": [["tivi", 330, 150], ["dien-thoai", 250, 175]], "loi": []}, "tom": "Em trai Tùng mải chơi điện tử, lơ là việc học và việc nhà.", "nv": [{"loai": "chon", "hoi": "Tùng nên làm gì?", "chon": [{"t": "Nhẹ nhàng nói chuyện với em, cùng em lập thời gian biểu, rủ em làm việc nhà, chơi trò khác; nhờ bố mẹ nếu em chưa thay đổi.", "d": 1, "g": "Khuyên bảo nhẹ nhàng, có cách làm cụ thể và biết nhờ người lớn."}, {"t": "Giấu máy chơi game của em đi.", "d": 0, "g": "Làm em tức giận, mâu thuẫn tăng."}, {"t": "Mắng em trước mặt bạn bè.", "d": 0, "g": "Làm em xấu hổ, khó tiếp thu."}, {"t": "Kệ em, không phải việc của mình.", "d": 0, "g": "Anh chị em cần quan tâm, giúp nhau."}]}], "loi": "Trong gia đình em đã từng có vấn đề gì nảy sinh? Mọi người giải quyết thế nào?", "id": "c5-t5"}, {"cd": 5, "trang": "tr.30", "nhan": "Tình huống 2", "ten": "Hùng thấy chưa công bằng", "canh": {"nen": "nha", "nguoi": [{"x": 120, "ao": "#a855f7", "toc": "buoc", "cam": "binh", "vai": "nguoi-lon"}, {"x": 230, "ao": "#3b82f6", "toc": "ngan", "cam": "buon"}, {"x": 320, "ao": "#ec4899", "toc": "buoc", "cam": "vui", "to": 0.75}], "vat": [], "loi": [[230, 40, "Sao con phải làm nhiều hơn?"]]}, "tom": "Hùng được bố mẹ giao nhiều việc nhà hơn em gái Hoa. Hùng ấm ức, cho rằng bố mẹ thiên vị.", "nv": [{"loai": "chon", "hoi": "Hùng nên làm gì?", "chon": [{"t": "Hỏi bố mẹ lí do và lắng nghe; hiểu em còn nhỏ; có thể đề nghị giao em những việc vừa sức.", "d": 1, "g": "Trao đổi nhẹ nhàng, lắng nghe giúp giải quyết vấn đề."}, {"t": "Làm qua loa cho xong.", "d": 0, "g": "Không giải quyết được vấn đề, lại thiếu trách nhiệm."}, {"t": "Cãi lại bố mẹ.", "d": 0, "g": "Tranh cãi gay gắt làm cả nhà buồn."}, {"t": "Bắt em làm thay phần của mình.", "d": 0, "g": "Đẩy việc cho em là không công bằng."}]}], "loi": "Nhà em phân công việc nhà thế nào? Em thấy đã hợp lí chưa?", "id": "c5-t6"}, {"cd": 5, "trang": "tr.30", "nhan": "Tình huống 3", "ten": "Không có quần áo mới", "canh": {"nen": "nha", "nguoi": [{"x": 130, "ao": "#a855f7", "toc": "buoc", "cam": "lo", "vai": "nguoi-lon"}, {"x": 250, "ao": "#ec4899", "toc": "dai", "cam": "gian"}], "vat": [["quan-ao", 320, 210]], "loi": []}, "tom": "Hương bực tức khi bố mẹ không mua quần áo, giày dép mới cho mình.", "nv": [{"loai": "chon", "hoi": "Hương nên làm gì?", "chon": [{"t": "Bình tĩnh nói chuyện với bố mẹ, nói rõ món nào thật cần; hiểu và chia sẻ hoàn cảnh gia đình.", "d": 1, "g": "Lắng nghe, thông cảm và trao đổi nhẹ nhàng."}, {"t": "Giận dỗi, bỏ ăn.", "d": 0, "g": "Làm bố mẹ buồn, không giải quyết được vấn đề."}, {"t": "So sánh với nhà bạn khác.", "d": 0, "g": "So sánh làm bố mẹ tổn thương."}, {"t": "Tự lấy tiền của bố mẹ đi mua.", "d": 0, "g": "Tự ý lấy tiền là sai."}]}], "loi": "Khi muốn bố mẹ mua đồ cho mình, em thường nói thế nào?", "id": "c5-t7"}, {"cd": 5, "trang": "tr.31", "nhan": "Tình huống 1", "ten": "Cơm chưa ai nấu", "canh": {"nen": "bep", "nguoi": [{"x": 150, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}], "vat": [["noi-com", 70, 175], ["bong", 260, 215]], "loi": []}, "tom": "Nam về nhà, định đi chơi ều người đốt rơm rạ ngoài đồng, khói bay mù mịt.", "nv": [{"loai": "chon", "hoi": "Em sẽ tuyên truyền thế nào?", "chon": [{"t": "Lễ phép giải thích khói đốt rơm làm ô nhiễm không khí, hại sức khoẻ và làm Trái Đất nóng lên; gợi ý dùng rơm ủ phân, làm thức ăn cho trâu bò, trồng nấm.", "d": 1, "g": "Vừa nêu tác hại, vừa gợi ý cách làm thay thế."}, {"t": "Gọi các bạn ra chê bai người đốt rơm.", "d": 0, "g": "Chê bai không thuyết phục được ai."}, {"t": "Mặc kệ, việc của người lớn.", "d": 0, "g": "HS có thể góp phần tuyên truyền bảo vệ môi trường."}, {"t": "Tự dập lửa khi chưa có người lớn.", "d": 0, "g": "Đến gần lửa nguy hiểm. Hãy báo người lớn."}]}], "loi": "Ở địa phương em có việc làm nào gây hại cho môi trường? Em sẽ tuyên truyền thế nào?", "id": "c7-t1"}, {"cd": 7, "trang": "tr.42", "nhan": "Trường hợp 2", "ten": "Đốt rừng làm nương rẫy", "canh": {"nen": "trangtrai", "nguoi": [{"x": 120, "ao": "#22c55e", "toc": "ngan", "cam": "lo"}, {"x": 300, "ao": "#64748b", "toc": "bac", "cam": "binh", "vai": "nguoi-lon"}], "vat": [["lua", 200, 200], ["khoi", 205, 175]], "loi": []}, "tom": "Ở miền núi, có người chặt, đốt rừng để làm nương rẫy.", "nv": [{"loai": "chon", "hoi": "Em sẽ tuyên truyền thế nào?", "chon": [{"t": "Giải thích rừng giữ đất, giữ nước, điều hoà khí hậu; phá rừng gây lũ quét, sạt lở; khuyên trồng trọt trên đất được phép và trồng thêm cây.", "d": 1, "g": "Nêu rõ lợi ích của rừng và tác hại khi phá rừng."}, {"t": "Lấy điện thoại quay lại rồi đăng lên mạng chế giễu.", "d": 0, "g": "Chế giễu không giải quyết được vấn đề."}, {"t": "Không nói gì vì đó là đất của họ.", "d": 0, "g": "Phá rừng ảnh hưởng tới cả cộng đồng."}, {"t": "Tranh cãi to tiếng với người đốt rừng.", "d": 0, "g": "Dễ gây xung đột. Nên báo người lớn, chính quyền."}]}], "loi": "Em biết những việc làm nào để bảo vệ rừng?", "id": "c7-t2"}, {"cd": 7, "trang": "tr.42", "nhan": "Trường hợp 3", "ten": "Mùi hôi từ chuồng trại", "canh": {"nen": "trangtrai", "nguoi": [{"x": 110, "ao": "#ec4899", "toc": "dai", "cam": "lo"}, {"x": 220, "ao": "#64748b", "toc": "bac", "cam": "binh", "vai": "nguoi-lon"}], "vat": [["chuong", 320, 215], ["khoi", 320, 170]], "loi": []}, "tom": "Chất thải chuồng trại không được xử lí, gây mùi hôi thối cả xóm.", "nv": [{"loai": "chon", "hoi": "Em sẽ tuyên truyền thế nào?", "chon": [{"t": "Lễ phép giải thích chất thải gây ô nhiễm không khí, nguồn nước và bệnh tật; gợi ý ủ phân, làm hầm biogas, vệ sinh chuồng thường xuyên.", "d": 1, "g": "Nêu tác hại kèm cách xử lí cụ thể."}, {"t": "Bịt mũi đi qua, không nói gì.", "d": 0, "g": "Không góp phần thay đổi."}, {"t": "Ném rác vào chuồng cho bõ tức.", "d": 0, "g": "Làm ô nhiễm thêm và gây mâu thuẫn."}, {"t": "Viết bình luận chê bai trên mạng.", "d": 0, "g": "Chê bai không thuyết phục được ai."}]}], "loi": "Nhà em hoặc hàng xóm xử lí rác, chất thải thế nào?", "id": "c7-t3"}]};

    + '<div class="hang-nut" style="justify-content:flex-start"><button class="nut" onclick="xuatCSV()">⬇ Xuất kết quả (CSV)</button><button class="nut" onclick="xuatLoi()">⬇ Xuất lời của em (CSV)</button><button class="nut phu" onclick="saoLuu()">💾 Sao lưu</button><label class="nut phu" style="display:inline-flex;align-items:center">📂 Nhập sao lưu<input type="file" accept=".json" style="display:none" onchange="nhapSaoLuu(this)"></label><button class="nut phu" onclick="xoaDL()">🗑 Xoá dữ liệu</button></div></div>';
  m.innerHTML = h;
  veBieuDo(tk);
}
function veBieuDo(tk) {
  var cv = document.getElementById("bieuDo"), r = cv.getBoundingClientRect(), dp = window.devicePixelRatio || 1;
  cv.width = r.width * dp; cv.height = r.height * dp; var x = cv.getContext("2d"); x.scale(dp, dp);
  var W = r.width, H = r.height, L = 40, B = 46, n = DL.tinh_huong.length, bw = (W - L - 10) / n;
  x.font = "12px Segoe UI"; x.fillStyle = "#64748b"; x.strokeStyle = "#e2e8f0";
  [0, 25, 50, 75, 100].forEach(function (v) { var y = H - B - (H - B - 14) * v / 100; x.beginPath(); x.moveTo(L, y); x.lineTo(W, y); x.stroke(); x.fillText(v + "%", 4, y + 4); });
  DL.tinh_huong.forEach(function (t, i) {
    var n_ = 0, d = 0; Object.keys(tk).forEach(function (k) { if (tk[k].id === t.id) { n_ += tk[k].n; d += tk[k].d; } });
    var v = n_ ? d / n_ : 0, h = (H - B - 14) * v, x0 = L + i * bw + 3;
    var g = x.createLinearGradient(0, H - B - h, 0, H - B); g.addColorStop(0, CD[t.cd].mau); g.addColorStop(1, "#ffffff");
    x.fillStyle = n_ ? g : "#f1f5f9"; x.beginPath(); if (x.roundRect) x.roundRect(x0, H - B - h, bw - 6, h, 5); else x.rect(x0, H - B - h, bw - 6, h); x.fill();
    x.save(); x.translate(x0 + (bw - 6) / 2, H - B + 8); x.rotate(Math.PI / 3); x.fillStyle = "#334155"; x.font = "11px Segoe UI"; x.fillText(t.id.replace("c", "CĐ").replace("-t", "-"), 0, 0); x.restore();
  });
}
function taiFile(ten, noiDung, kieu) {
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([noiDung], { type: kieu })); a.download = ten; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function oCSV(v) { v = String(v == null ? "" : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function ngayTen() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function xuatCSV() {
  var dong = [["Ma", "ChuDe", "TinhHuong", "TrangSGK", "NhiemVu", "DungLanDau", "SoLanThu", "ThoiGian"]];
  KHO.luot.forEach(function (l) { var t = TH[l.id]; if (t) dong.push([l.ma, t.cd, t.ten, t.trang, l.nv + 1, l.dung ? "Có" : "Không", l.lan, l.t]); });
  taiFile("ket-qua-tinh-huong-HDTN6-" + ngayTen() + ".csv", "﻿" + dong.map(function (r) { return r.map(oCSV).join(","); }).join("\n"), "text/csv");
}
function xuatLoi() {
  var dong = [["Ma", "ChuDe", "TinhHuong", "TrangSGK", "LoiCuaEm", "ThoiGian"]];
  KHO.loi.forEach(function (l) { var t = TH[l.id]; if (t) dong.push([l.ma, t.cd, t.ten, t.trang, l.text, l.t]); });
  taiFile("loi-cua-em-HDTN6-" + ngayTen() + ".csv", "﻿" + dong.map(function (r) { return r.map(oCSV).join(","); }).join("\n"), "text/csv");
}
function saoLuu() { taiFile("sao-luu-tinh-huong-HDTN6-" + ngayTen() + ".json", JSON.stringify(KHO), "application/json"); }
function nhapSaoLuu(inp) {
  var f = inp.files[0]; if (!f) return;
  var r = new FileReader(); r.onload = function () { try { var k = JSON.parse(r.result); if (!k.luot) throw 0; KHO.luot = KHO.luot.concat(k.luot); KHO.loi = KHO.loi.concat(k.loi || []); ghiKho(); alert("Đã nhập thêm " + k.luot.length + " lượt."); ve(); } catch (e) { alert("File không đúng định dạng sao lưu của app."); } }; r.readAsText(f);
}
function xoaDL() { if (confirm("Xoá toàn bộ kết quả trên máy này? Nên bấm Sao lưu trước. Không khôi phục được.")) { KHO.luot = []; KHO.loi = []; ghiKho(); ve(); } }

capNhatChip();
ve();
</script>
