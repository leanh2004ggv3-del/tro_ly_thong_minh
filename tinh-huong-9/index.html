<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Em xử lí tình huống – HĐTN, HN 9</title>
<style>
:root{
  --nen1:#eef4ff; --nen2:#fff4ea; --chu:#1e293b; --chu2:#475569; --kinh:rgba(255,255,255,.82); --vien:rgba(148,163,184,.35);
  --chinh:#4f46e5; --nhan1:#f97316; --nhan2:#0ea5e9; --dung:#16a34a; --dung-nen:#dcfce7; --sai:#dc2626; --sai-nen:#fee2e2;
  --cd:#4f46e5; --bong:0 10px 30px rgba(30,41,59,.12);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--chu);min-height:100vh;
  background:radial-gradient(circle at 10% 0%,#dbe7ff 0,transparent 45%),radial-gradient(circle at 95% 15%,#ffe4cc 0,transparent 40%),linear-gradient(160deg,var(--nen1),var(--nen2));}
button{font-family:inherit;cursor:pointer}
.dau{display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo h1{margin:0;font-size:26px;letter-spacing:.5px;background:linear-gradient(90deg,#4f46e5,#ec4899,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.logo small{display:block;color:var(--chu2);font-weight:600;font-size:13px}
.dau .phai{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--kinh);border:1px solid var(--vien);font-weight:700;font-size:14px}
.nut{border:0;border-radius:14px;padding:11px 18px;min-height:44px;font-weight:800;font-size:16px;color:#fff;
  background:linear-gradient(135deg,var(--cd),#ec4899);box-shadow:0 6px 16px rgba(79,70,229,.28);transition:transform .15s,box-shadow .15s}
.nut:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(79,70,229,.32)}
.nut:active{transform:translateY(1px) scale(.98)}
.nut.phu{background:var(--kinh);color:var(--chu);border:1px solid var(--vien);box-shadow:none}
.nut.nho{padding:7px 12px;min-height:38px;font-size:14px}
.nut[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.nhap{margin:0 22px 8px;padding:7px 14px;border-radius:12px;background:#fff7d6;border:1px dashed #eab308;color:#854d0e;font-weight:700;font-size:14px;text-align:center}
main{padding:6px 22px 40px;max-width:1360px;margin:0 auto}
.kinh{background:var(--kinh);border:1px solid var(--vien);border-radius:20px;box-shadow:var(--bong);backdrop-filter:blur(6px)}
.hien{animation:hien .3s ease}
@keyframes hien{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes noi{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rung{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.khong-hieu-ung *{animation:none!important;transition:none!important}
/* trang chủ */
.anh-hung{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding:22px;align-items:center}
.anh-hung h2{font-size:34px;margin:0 0 6px;line-height:1.15}
.anh-hung p{color:var(--chu2);font-size:17px;margin:6px 0 14px;line-height:1.5}
.o-ma{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.o-ma input{font-size:18px;padding:11px 14px;border-radius:14px;border:2px solid #c7d2fe;min-width:200px;font-weight:700}
.o-ma .goi-y{width:100%;font-size:13px;color:var(--chu2)}
.canh-bao-ma{color:var(--sai);font-weight:700;font-size:14px;width:100%}
.luoi-cd{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:18px}
.the-cd{position:relative;padding:16px;border-radius:20px;cursor:pointer;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--m) 12%,#fff));border:2px solid color-mix(in srgb,var(--m) 30%,transparent);box-shadow:var(--bong);transition:transform .18s}
.the-cd:hover{transform:translateY(-4px)}
.the-cd .bieu{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,var(--m),color-mix(in srgb,var(--m) 55%,#fff));box-shadow:0 6px 14px color-mix(in srgb,var(--m) 40%,transparent)}
.the-cd h3{margin:12px 0 2px;font-size:19px}
.the-cd .nho{color:var(--chu2);font-size:13px;font-weight:600}
.thanh{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:10px}
.thanh i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--m),#22c55e)}
/* chủ đề */
.tieu-de-cd{display:flex;align-items:center;gap:14px;padding:16px 20px;margin-bottom:16px}
.tieu-de-cd .bieu{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:var(--cd);color:#fff}
.tieu-de-cd h2{margin:0;font-size:26px}
.luoi-th{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.the-th{border-radius:18px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:var(--bong);border:2px solid transparent;transition:transform .18s,border-color .18s}
.the-th:hover{transform:translateY(-4px);border-color:var(--cd)}
.the-th svg{display:block;width:100%;height:auto}
.the-th .ben{padding:10px 14px 14px}
.the-th h3{margin:4px 0;font-size:18px}
.huy{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--cd) 14%,#fff);color:var(--cd)}
.huy.xong{background:var(--dung-nen);color:var(--dung)}
.huy.at{background:#ffedd5;color:#c2410c}
/* màn tình huống */
.man-th{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.khung-canh{padding:14px}
.khung-canh svg{width:100%;height:auto;border-radius:14px;display:block}
.khung-canh h2{margin:12px 4px 4px;font-size:24px}
.tom{font-size:17px;line-height:1.6;margin:6px 4px 4px}
.an-toan{margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:2px solid #fb923c;font-weight:700;color:#9a3412;display:flex;gap:10px;align-items:center}
.an-toan b{font-size:26px}
.bang-nv{padding:18px}
.cham{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.cham span{padding:5px 12px;border-radius:99px;font-weight:800;font-size:13px;background:#e2e8f0;color:#64748b}
.cham span.dang{background:var(--cd);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--cd) 25%,transparent)}
.cham span.da{background:var(--dung-nen);color:var(--dung)}
.hoi{font-size:20px;font-weight:800;margin:4px 0 12px;line-height:1.4}
.pa{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:16px;border:2px solid #e2e8f0;background:#fff;font-size:16.5px;line-height:1.45;color:var(--chu);transition:transform .12s,border-color .12s,background .2s}
.pa:hover{border-color:var(--cd);transform:translateX(3px)}
.pa .chu-cai{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;background:linear-gradient(135deg,var(--cd),#ec4899)}
.pa.dung{border-color:var(--dung);background:var(--dung-nen)}
.pa.dung .chu-cai{background:var(--dung)}
.pa.sai{border-color:var(--sai);background:var(--sai-nen);animation:rung .35s}
.pa.sai .chu-cai{background:var(--sai)}
.pa.chon{border-color:var(--cd);background:color-mix(in srgb,var(--cd) 10%,#fff)}
.pa .giai{display:block;margin-top:6px;font-size:14.5px;font-weight:600}
.pa.dung .giai{color:#166534}.pa.sai .giai{color:#991b1b}
.loi-bao{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:700;display:flex;gap:12px;align-items:center}
.loi-bao.tot{background:var(--dung-nen);color:#166534}
.loi-bao.chua{background:var(--sai-nen);color:#991b1b}
.hang-nut{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
/* phân loại */
.kho{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border-radius:14px;background:#f1f5f9;border:2px dashed #cbd5e1;margin-bottom:12px}
.the-pl{padding:9px 12px;border-radius:12px;background:#fff;border:2px solid #cbd5e1;font-weight:700;font-size:15px;cursor:grab;user-select:none;box-shadow:0 3px 8px rgba(0,0,0,.06)}
.the-pl.chon{border-color:var(--cd);box-shadow:0 0 0 4px color-mix(in srgb,var(--cd) 25%,transparent)}
.the-pl.dung{border-color:var(--dung);background:var(--dung-nen)}
.the-pl.sai{border-color:var(--sai);background:var(--sai-nen);animation:rung .35s}
.the-pl small{display:block;font-weight:600;font-size:12.5px;margin-top:3px}
.thung-hang{display:grid;gap:10px}
.thung{border-radius:16px;padding:10px;min-height:120px;background:#fff;border:2px solid var(--tm);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.thung h4{margin:0 0 4px;padding:6px 10px;border-radius:10px;color:#fff;background:var(--tm);font-size:15px;text-align:center}
.thung.sang{box-shadow:0 0 0 4px color-mix(in srgb,var(--tm) 30%,transparent)}
/* xếp bước */
.xep{list-style:none;padding:0;margin:0;position:relative}
.xep:before{content:"";position:absolute;left:24px;top:20px;bottom:20px;width:4px;border-radius:4px;background:linear-gradient(var(--cd),#ec4899,#f97316)}
.xep li{position:relative;display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px 10px 10px 8px;border-radius:14px;background:#fff;border:2px solid #e2e8f0;font-size:16px;font-weight:600;cursor:grab}
.xep li .so{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;background:var(--cd);z-index:1;box-shadow:0 0 0 4px #fff}
.xep li .chu{flex:1}
.xep li .mui{display:flex;flex-direction:column;gap:2px}
.xep li .mui button{border:0;border-radius:8px;width:34px;height:26px;background:#eef2ff;font-weight:900;color:var(--cd)}
.xep li.dung{border-color:var(--dung);background:var(--dung-nen)}.xep li.dung .so{background:var(--dung)}
.xep li.sai{border-color:var(--sai);background:var(--sai-nen)}.xep li.sai .so{background:var(--sai)}
.xep li.keo{opacity:.4}
/* ngân sách */
.ns{display:grid;grid-template-columns:1fr 210px;gap:14px;align-items:center}
.thu-nhap{padding:10px 14px;border-radius:14px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);font-weight:800;margin-bottom:10px}
.dong-ns{margin:10px 0}
.dong-ns label{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px}.dong-ns label>span:last-child{white-space:nowrap}
.dong-ns input{width:100%;accent-color:var(--mm);height:26px}
.dong-ns .tien{color:var(--chu2);font-weight:700}
.tong{margin-top:6px;padding:10px 14px;border-radius:12px;font-weight:900;text-align:center;font-size:17px}
.tong.ok{background:var(--dung-nen);color:var(--dung)}.tong.vuot{background:var(--sai-nen);color:var(--sai)}.tong.thieu{background:#fef9c3;color:#a16207}
.tieu-chi{list-style:none;padding:0;margin:10px 0 0;font-weight:700;font-size:15px}
.tieu-chi li{margin:4px 0}
/* lời của em */
.loi-em textarea{width:100%;min-height:120px;font-size:17px;padding:12px;border-radius:14px;border:2px solid #c7d2fe;font-family:inherit}
.cu{display:flex;gap:12px;align-items:flex-end}
.cu .bong-noi{flex:1;padding:12px 16px;border-radius:18px 18px 18px 4px;background:#eef2ff;font-weight:700;font-size:16px;line-height:1.45}
.cu svg{flex:none;animation:noi 3s ease-in-out infinite}
.hoan-thanh{text-align:center;padding:24px}
.sao{font-size:46px;letter-spacing:6px}
/* giáo viên */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:12px 0}
.kpi div{padding:16px;border-radius:18px;background:#fff;box-shadow:var(--bong);border-top:6px solid var(--k)}
.kpi b{display:block;font-size:36px;color:var(--k)}
.kpi span{color:var(--chu2);font-weight:700}
.thu{position:relative;height:300px}
.thu canvas{position:absolute;inset:0;width:100%;height:100%}
.bang-sai{width:100%;border-collapse:collapse;font-size:15px}
.bang-sai td,.bang-sai th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}
.dai-thu{background:repeating-linear-gradient(45deg,#fde68a,#fde68a 12px,#fef3c7 12px,#fef3c7 24px);color:#92400e;font-weight:900;text-align:center;padding:8px;border-radius:12px;margin-bottom:10px;letter-spacing:2px}
.nut-video{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;border:0;background:rgba(15,23,42,.72);color:#fff;font-size:34px;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .15s}
.nut-video:hover{transform:translate(-50%,-50%) scale(1.08)}
.khung-tranh{position:relative}
.nhan-video{position:absolute;right:12px;bottom:12px;padding:6px 12px;border-radius:999px;background:#fff;font-weight:800;font-size:14px;color:var(--cd);box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none}
#hopVideo{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.82);display:none;align-items:center;justify-content:center;padding:20px}
#hopVideo.mo{display:flex}
#hopVideo .ben{width:min(1100px,100%);background:#0f172a;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#hopVideo video{display:block;width:100%;max-height:78vh;background:#000}
#hopVideo .dong{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#e2e8f0;font-weight:700;gap:10px}
#phao{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
/* chiếu TV */
body.tv{font-size:19px}
body.tv .hoi{font-size:27px}
body.tv .pa{font-size:22px;padding:16px}
body.tv .pa .chu-cai{width:52px;height:52px;font-size:28px}
body.tv .tom{font-size:21px}
body.tv .xep li,body.tv .the-pl{font-size:20px}
body.tv .khung-canh h2{font-size:30px}
@media (max-width:620px){.thung-hang{grid-template-columns:repeat(2,1fr)!important}.pa{font-size:15.5px}.hoi{font-size:18px}.anh-hung h2{font-size:27px}}
@media (max-width:900px){.man-th,.anh-hung,.ns{grid-template-columns:1fr}.logo h1{font-size:21px}main{padding:6px 12px 30px}.dau{padding:10px 12px}.nhap{margin:0 12px 8px}}
</style>
</head>
<body>

  <linearGradient id="gTroi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
  <linearGradient id="gTuong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>

  <linearGradient id="gHong" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/></linearGradient>

<header class="dau">
  <div class="logo" onclick="diToi('trang-chu')" title="Về trang chủ">
    <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="#4f46e5"/><path d="M12 30c0-8 6-14 14-14s14 6 14 14" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round"/><circle cx="19" cy="30" r="5" fill="#fff"/><circle cx="33" cy="30" r="5" fill="#fff"/><circle cx="19" cy="30" r="2.4" fill="#1e293b"/><circle cx="33" cy="30" r="2.4" fill="#1e293b"/><path d="M24 36l2 3 2-3z" fill="#f97316"/></svg>
    <div><h1>EM XỬ LÍ TÌNH HUỐNG</h1><small>Hoạt động trải nghiệm, hướng nghiệp 9 · 29 tình huống SGK</small></div>
  </div>

<script>
"use strict";
var DL = {"chu_de": [{"cd": 1, "ten": "Em với nhà trường", "mau": "#3b82f6", "icon": "🏫", "trang": "SGK tr.5–6"}, {"cd": 2, "ten": "Khám phá bản thân", "mau": "#8b5cf6", "icon": "🔍", "trang": "SGK tr.12–14"}, {"cd": 3, "ten": "Trách nhiệm với bản thân", "mau": "#f97316", "icon": "🎯", "trang": "SGK tr.18–21"}, {"cd": 4, "ten": "Rèn luyện bản thân", "mau": "#10b981", "icon": "💪", "trang": "SGK tr.23–25"}, {"cd": 5, "ten": "Em với gia đình", "mau": "#ec4899", "icon": "🏡", "trang": "SGK tr.29"}, {"cd": 6, "ten": "Em với cộng đồng", "mau": "#eab308", "icon": "🤝", "trang": "SGK tr.35–36"}, {"cd": 9, "ten": "Hiểu bản thân – Chọn đúng nghề", "mau": "#6366f1", "icon": "🧭", "trang": "SGK tr.57"}], "tinh_huong": [{"id": "c1-t1", "cd": 1, "trang": "tr.5", "nhan": "Tình huống 1", "ten": "Vân yêu dân ca", "canh": {"nen": "lop", "nguoi": [{"x": 120, "ao": "#ec4899", "toc": "dai", "cam": "buon"}, {"x": 230, "ao": "#3b82f6", "toc": "ngan", "cam": "cuoi"}, {"x": 310, "ao": "#22c55e", "toc": "buoc", "cam": "cuoi"}], "vat": [["not-nhac", 70, 70], ["not-nhac", 160, 50]], "loi": [[270, 40, "Ha ha… lỗi thời quá!"]]}, "tom": "Cả nhóm nói chuyện về sở thích âm nhạc. Vân kể mình rất thích các làn điệu dân ca và hát chầu văn. Một số bạn cười to, cho rằng Vân không theo kịp xu hướng âm nhạc của giới trẻ.", "nv": [{"loai": "chon", "hoi": "Nếu em là một bạn trong nhóm, em nên làm gì?", "chon": [{"t": "Cười theo các bạn cho vui, vì chỉ là trêu đùa.", "d": 0, "g": "Cười theo là đồng tình với việc chê sở thích của bạn, Vân sẽ thấy bị coi thường."}, {"t": "Không cười; hỏi Vân về cái hay của các làn điệu và nhắc nhóm: mỗi người một sở thích.", "d": 1, "g": "Em chấp nhận sự khác biệt, không phán xét, lại giúp cả nhóm hiểu thêm một nét đẹp văn hoá."}, {"t": "Im lặng, sau đó khuyên riêng Vân nên nghe nhạc trẻ cho hợp với các bạn.", "d": 0, "g": "Khuyên Vân bỏ sở thích của mình là chưa tôn trọng khác biệt. Điều cần thay đổi là cách các bạn cư xử."}, {"t": "Chê lại nhạc các bạn kia nghe mới là “nhạc dở”.", "d": 0, "g": "Đáp trả bằng chê bai chỉ làm mâu thuẫn tăng. Tôn trọng khác biệt là không so sánh, phán xét sở thích của ai."}]}], "loi": "Em sẽ nói gì với Vân để bạn thấy sở thích của mình được tôn trọng?"}, {"id": "c1-t2", "cd": 1, "trang": "tr.6", "nhan": "Tình huống 2", "ten": "Cô giáo mới", "canh": {"nen": "lop", "bang": "KHTN 9", "nguoi": [{"x": 70, "ao": "#a855f7", "toc": "dai", "cam": "binh", "vai": "gv"}, {"x": 250, "ao": "#3b82f6", "toc": "ngan", "cam": "chan"}, {"x": 330, "ao": "#f97316", "toc": "ngan", "cam": "chan"}], "vat": [["sach", 205, 205]], "loi": [[300, 40, "Chán quá…"]]}, "tom": "Cô Hải mới được phân công dạy môn Khoa học tự nhiên lớp 9A1 thay thầy Hùng. Hai thầy cô có phong cách dạy khác nhau. Một số bạn trong tổ ra không thích cách dạy của cô Hải và thường lơ là khi cô giảng bài.", "nv": [{"loai": "chon", "hoi": "Em là tổ trưởng của tổ đó. Cách làm nào thể hiện tôn trọng sự khác biệt?", "chon": [{"t": "Rủ cả tổ đề nghị nhà trường cho thầy Hùng dạy lại.", "d": 0, "g": "Phân công giảng dạy là việc của nhà trường. Chưa cho mình thời gian làm quen đã đòi đổi là chưa chấp nhận khác biệt."}, {"t": "Nhắc các bạn tập trung, thử làm quen với cách học mới; có điều chưa hiểu thì cùng góp ý lễ phép với cô.", "d": 1, "g": "Em chấp nhận mỗi thầy cô một phong cách, hợp tác trong giờ học và góp ý đúng cách."}, {"t": "Mặc kệ, ai muốn học thì học.", "d": 0, "g": "Lơ là trong giờ là thiếu tôn trọng cô và thiệt cho chính các bạn. Là tổ trưởng, em nên nhắc nhở, hỗ trợ."}, {"t": "Nói thẳng với cô rằng thầy Hùng dạy dễ hiểu hơn.", "d": 0, "g": "So sánh trực tiếp dễ làm cô buồn. Góp ý nên cụ thể, lễ phép, VD xin cô giảng lại phần chưa hiểu."}]}], "loi": "Em sẽ nói gì với các bạn trong tổ để cả tổ cùng hợp tác với cô Hải?"}, {"id": "c2-t1", "cd": 2, "trang": "tr.12", "nhan": "Tình huống 1", "ten": "Nhóm của Lê ở thư viện", "canh": {"nen": "thuvien", "nguoi": [{"x": 80, "ao": "#a855f7", "toc": "buoc", "cam": "binh", "vai": "gv"}, {"x": 200, "ao": "#3b82f6", "toc": "ngan", "cam": "vui"}, {"x": 270, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 340, "ao": "#22c55e", "toc": "ngan", "cam": "cuoi"}], "vat": [["sach", 235, 205]], "loi": [[110, 40, "Các em nói nhỏ thôi nhé!"]]}, "tom": "Lê và các bạn vào thư viện trường tìm tư liệu cho dự án. Nhờ cô phụ trách thư viện hướng dẫn, nhóm nhanh chóng tìm được tài liệu. Các bạn mừng rỡ, hăng hái thảo luận mà quên cảm ơn cô. Một bạn cười nói rất to khiến cô phải nhắc nhở.", "nv": [{"loai": "phan-loai", "hoi": "Xếp mỗi hành vi vào đúng nhóm.", "thung": ["Tích cực", "Chưa tích cực"], "the": [{"t": "Rủ nhau vào thư viện tìm tư liệu cho dự án", "th": 0, "g": "Chủ động trong học tập."}, {"t": "Hăng hái thảo luận, cùng chọn thông tin", "th": 0, "g": "Biết hợp tác trong nhóm."}, {"t": "Quên cảm ơn cô phụ trách thư viện", "th": 1, "g": "Được giúp đỡ cần nói lời cảm ơn."}, {"t": "Cười nói rất to trong thư viện", "th": 1, "g": "Chưa thực hiện quy định ứng xử nơi công cộng."}]}], "loi": "Nếu em ở trong nhóm, trước khi rời thư viện em sẽ làm gì?"}, {"id": "c2-t2", "cd": 2, "trang": "tr.12", "nhan": "Tình huống 2", "ten": "Huy và em lớp 6", "canh": {"nen": "santruong", "nguoi": [{"x": 170, "ao": "#3b82f6", "toc": "ngan", "cam": "gian"}, {"x": 260, "ao": "#f97316", "toc": "ngan", "cam": "lo", "to": 0.8}], "vat": [], "loi": [[250, 45, "Em… em xin lỗi anh!"]]}, "tom": "Giờ ra chơi, Huy đang đứng nói chuyện thì bị một em lớp 6 va phải, suýt ngã. Huy tức giận, định mắng thì em ấy vội vàng xin lỗi. Thấy em chân thành, Huy nguôi giận và nhẹ nhàng nhắc em lần sau đi đứng cẩn thận.", "nv": [{"loai": "phan-loai", "hoi": "Xếp mỗi hành vi vào đúng nhóm.", "thung": ["Tích cực", "Chưa tích cực"], "the": [{"t": "Huy tức giận, định mắng em lớp 6", "th": 1, "g": "Chưa kiểm soát được cảm xúc."}, {"t": "Em lớp 6 đi vội, va phải người khác", "th": 1, "g": "Đi lại nơi đông người cần cẩn thận."}, {"t": "Em lớp 6 vội vàng xin lỗi chân thành", "th": 0, "g": "Biết nhận lỗi đúng lúc."}, {"t": "Huy nguôi giận, nhẹ nhàng nhắc em", "th": 0, "g": "Biết kiềm chế, ứng xử nhẹ nhàng với em nhỏ."}]}], "loi": "Kể một lần em kiềm chế được cơn giận. Em đã làm thế nào?"}, {"id": "c2-t3", "cd": 2, "trang": "tr.14", "nhan": "Tình huống 1", "ten": "Phong chuyển trường", "canh": {"nen": "santruong", "nguoi": [{"x": 130, "ao": "#0ea5e9", "toc": "ngan", "cam": "vui"}, {"x": 230, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 310, "ao": "#22c55e", "toc": "ngan", "cam": "vui"}], "vat": [["cay", 30, 120]], "loi": [[230, 40, "Chào Phong, vào nhóm tớ nhé!"]]}, "tom": "Gia đình Phong chuyển đến nơi ở mới. Xa trường cũ và bạn bè, Phong buồn và lo. Bạn chủ động tìm hiểu trường mới, làm quen với các bạn, nhờ bạn hướng dẫn và mạnh dạn tham gia hoạt động tập thể để hoà nhập.", "nv": [{"loai": "chon-nhieu", "hoi": "Chọn TẤT CẢ biểu hiện cho thấy Phong thích nghi với sự thay đổi.", "chon": [{"t": "Chủ động tìm hiểu về trường mới và yêu cầu của nhà trường", "d": 1, "g": "Chủ động học hỏi điều mới."}, {"t": "Làm quen với các bạn trong tổ, trong lớp", "d": 1, "g": "Chủ động kết nối với môi trường mới."}, {"t": "Nhờ các bạn hướng dẫn, giúp đỡ trong học tập", "d": 1, "g": "Biết tìm sự hỗ trợ."}, {"t": "Nhận nhiệm vụ phù hợp với sở thích, khả năng trong hoạt động tập thể", "d": 1, "g": "Mạnh dạn tham gia để hoà nhập."}, {"t": "Ngồi một mình, chờ các bạn đến làm quen trước", "d": 0, "g": "Thụ động, chưa phải biểu hiện thích nghi."}]}], "loi": "Nếu lớp em có bạn mới chuyển đến, em sẽ làm gì để bạn nhanh hoà nhập?"}, {"id": "c2-t4", "cd": 2, "trang": "tr.14", "nhan": "Tình huống 2", "ten": "Bố Hiền đi công tác xa", "canh": {"nen": "nha", "nguoi": [{"x": 120, "ao": "#a855f7", "toc": "buoc", "cam": "binh", "vai": "nguoi-lon"}, {"x": 220, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 300, "ao": "#facc15", "toc": "ngan", "cam": "vui", "to": 0.65}], "vat": [["sach", 250, 210], ["dong-ho", 340, 60]], "loi": []}, "tom": "Bố Hiền chuyển công tác xa nhà, cuộc sống gia đình bị xáo trộn. Hiền chủ động sắp xếp thời gian giúp mẹ chăm em, làm việc nhà mà vẫn bảo đảm việc học của mình.", "nv": [{"loai": "chon-nhieu", "hoi": "Chọn TẤT CẢ biểu hiện thích nghi của Hiền.", "chon": [{"t": "Chấp nhận việc bố phải đi công tác xa", "d": 1, "g": "Chấp nhận sự thay đổi."}, {"t": "Chủ động sắp xếp lại thời gian biểu", "d": 1, "g": "Chủ động tìm cách ứng phó."}, {"t": "Giúp mẹ chăm em và làm việc nhà", "d": 1, "g": "Chia sẻ trách nhiệm với gia đình."}, {"t": "Vẫn bảo đảm việc học của bản thân", "d": 1, "g": "Cân bằng việc nhà và việc học."}, {"t": "Xin nghỉ học vài hôm để ở nhà giúp mẹ", "d": 0, "g": "Bỏ học không phải cách thích nghi."}, {"t": "Than phiền với bạn bè vì cuộc sống bị xáo trộn", "d": 0, "g": "Chỉ than phiền mà không thay đổi gì thì chưa thích nghi."}]}], "loi": "Gia đình em từng có thay đổi gì? Em đã thích nghi thế nào?"}, {"id": "c3-t1", "cd": 3, "trang": "tr.18", "nhan": "Trường hợp 1", "ten": "Bài tuyên truyền cho xóm", "canh": {"nen": "duonglang", "nguoi": [{"x": 150, "ao": "#ec4899", "toc": "dai", "cam": "lo"}, {"x": 260, "ao": "#64748b", "toc": "bac", "cam": "vui", "vai": "nguoi-lon"}], "vat": [["giay", 205, 190]], "loi": [[270, 35, "Cháu viết giúp bác bài tuyên truyền nhé!"]]}, "tom": "Một bác trong xóm nhờ bạn viết và đọc bài tuyên truyền về bảo vệ môi trường đường làng, ngõ xóm. Bạn chưa làm việc này bao giờ nhưng hứa sẽ cố gắng hoàn thành.", "nv": [{"loai": "xep", "hoi": "Sắp xếp các việc theo thứ tự để bạn hoàn thành nhiệm vụ có trách nhiệm.", "buoc": ["Hỏi rõ bác cần nội dung gì, đọc vào lúc nào", "Lập kế hoạch: tìm tư liệu, viết dàn ý, hẹn ngày xong", "Dự kiến khó khăn: chưa viết bao giờ → nhờ thầy cô góp ý", "Viết bài, tập đọc trước, sửa đến khi hoàn chỉnh", "Đọc bài đúng hẹn, tự rút kinh nghiệm"]}], "loi": "Kể một việc người khác nhờ mà em chưa làm bao giờ. Em đã làm thế nào?"}, {"id": "c3-t2", "cd": 3, "trang": "tr.18", "nhan": "Trường hợp 2", "ten": "Nam và nhiệm vụ gấp", "canh": {"nen": "lop", "nguoi": [{"x": 130, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 250, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}], "vat": [["may-tinh", 320, 185], ["dong-ho", 60, 60]], "loi": [[250, 40, "Gấp quá, nhưng tớ sẽ cố!"]]}, "tom": "Nam được bạn nhờ sưu tầm hình ảnh về cảnh quan thiên nhiên Việt Nam trước giờ học sáng mai. Thời gian gấp nhưng Nam hứa sẽ sắp xếp để hoàn thành.", "nv": [{"loai": "chon", "hoi": "Nam nên làm thế nào?", "chon": [{"t": "Thức trắng đêm tìm thật nhiều ảnh.", "d": 0, "g": "Thức khuya ảnh hưởng sức khoẻ và việc học hôm sau. Có trách nhiệm cũng cần biết sắp xếp hợp lí."}, {"t": "Sắp xếp thời gian tối nay; tìm ảnh ở nguồn tin cậy, ghi rõ nguồn; gửi trước giờ học.", "d": 1, "g": "Em lập kế hoạch, làm đến nơi đến chốn và tôn trọng bản quyền hình ảnh."}, {"t": "Lấy đại vài ảnh trên mạng, không cần ghi nguồn.", "d": 0, "g": "Làm qua loa là chưa có trách nhiệm. Dùng ảnh trên mạng phải ghi nguồn."}, {"t": "Sáng mai nói với bạn là quên, để hôm khác.", "d": 0, "g": "Đã nhận lời thì phải cố gắng hoàn thành. Nếu thật sự không kịp thì báo sớm, không lấy cớ quên."}]}], "loi": "Khi có nhiều việc gấp cùng lúc, em sắp xếp thế nào?"}, {"id": "c3-t3", "cd": 3, "trang": "tr.18", "nhan": "Trường hợp 3", "ten": "Xe hỏng giữa chừng", "canh": {"nen": "duonglang", "nguoi": [{"x": 200, "ao": "#1e3a8a", "toc": "ngan", "cam": "lo"}], "vat": [["xe-dap", 110, 180], ["bat-chao", 270, 200]], "loi": [[230, 40, "Xe thủng săm rồi…"]]}, "tom": "Mẹ nhờ bạn mang thức ăn sang cho bà ngay. Nhưng xe đạp của bạn bị thủng săm. Bạn định mượn xe của An để đi cho kịp.", "nv": [{"loai": "chon", "hoi": "Cách nào vừa có trách nhiệm với việc mẹ giao, vừa đúng mực với bạn An?", "chon": [{"t": "Hỏi mượn xe An; giữ gìn cẩn thận, trả đúng hẹn, cảm ơn bạn; báo mẹ nếu đi muộn.", "d": 1, "g": "Em chủ động vượt khó để hoàn thành nhiệm vụ và tôn trọng đồ dùng của bạn."}, {"t": "Lấy xe An đi luôn, về rồi nói sau.", "d": 0, "g": "Dùng đồ của người khác phải xin phép trước."}, {"t": "Thôi không mang nữa, xe hỏng đâu phải lỗi của mình.", "d": 0, "g": "Gặp khó khăn là bỏ nhiệm vụ thì chưa có trách nhiệm. Hãy tìm cách khác."}, {"t": "Nhờ An mang hộ, mình ở nhà.", "d": 0, "g": "Đẩy việc của mình sang người khác là chưa có trách nhiệm."}]}], "loi": "Kể một lần em gặp trục trặc khi làm việc được giao. Em đã xoay xở thế nào?"}, {"id": "c3-t4", "cd": 3, "trang": "tr.19", "nhan": "Tình huống 1", "ten": "Nam làm nhóm trưởng", "canh": {"nen": "lop", "nguoi": [{"x": 120, "ao": "#3b82f6", "toc": "ngan", "cam": "vui"}, {"x": 210, "ao": "#ec4899", "toc": "dai", "cam": "lo"}, {"x": 300, "ao": "#22c55e", "toc": "ngan", "cam": "lo"}], "vat": [["sach", 165, 205], ["sach", 255, 205]], "loi": [[130, 40, "Mình cùng học nhé!"]]}, "tom": "Năm cuối cấp, Nam được cô giao làm nhóm trưởng học tập. Nam vừa phải hoàn thành nhiệm vụ của mình, vừa phải giúp đỡ một số bạn học chưa tốt trong nhóm.", "nv": [{"loai": "chon", "hoi": "Nam nên làm gì để thực hiện có trách nhiệm nhiệm vụ được giao?", "chon": [{"t": "Làm hộ bài tập cho các bạn học chưa tốt.", "d": 0, "g": "Làm hộ không giúp bạn tiến bộ và không trung thực."}, {"t": "Lập kế hoạch học nhóm, phân công bạn khá kèm bạn chưa tốt, theo dõi tiến bộ; vẫn hoàn thành phần của mình.", "d": 1, "g": "Em có kế hoạch, biết phân công, kiểm tra và giữ được việc học của bản thân."}, {"t": "Chỉ lo phần của mình, việc giúp bạn để cô lo.", "d": 0, "g": "Đã nhận nhiệm vụ nhóm trưởng thì phải thực hiện cả phần giúp đỡ các bạn."}, {"t": "Xin cô cho thôi làm nhóm trưởng vì quá nhiều việc.", "d": 0, "g": "Chưa thử tìm cách đã bỏ cuộc. Gặp khó nên trao đổi với cô để có cách làm phù hợp."}]}], "loi": "Nếu em là nhóm trưởng, em sẽ giúp một bạn học chưa tốt như thế nào?"}, {"id": "c3-t5", "cd": 3, "trang": "tr.19", "nhan": "Tình huống 2", "ten": "Thảo lo tiết mục 20/11", "canh": {"nen": "sankhau", "nguoi": [{"x": 140, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 220, "ao": "#a855f7", "toc": "buoc", "cam": "vui"}, {"x": 300, "ao": "#3b82f6", "toc": "ngan", "cam": "vui"}], "vat": [["hoa", 60, 195], ["not-nhac", 340, 60]], "loi": []}, "tom": "Hưởng ứng ngày Nhà giáo Việt Nam 20/11, nhà trường phát động phong trào thi đua văn hoá, văn nghệ, thể thao. Thảo được cô chủ nhiệm giao phụ trách các tiết mục văn nghệ của lớp tham gia hội diễn.", "nv": [{"loai": "xep", "hoi": "Sắp xếp các bước Thảo cần làm (gợi ý theo kế hoạch mẫu SGK tr.19).", "buoc": ["Xác định nhiệm vụ và thời gian chuẩn bị", "Chọn tiết mục và các bạn tham gia", "Lập lịch tập luyện, chuẩn bị trang phục", "Phân công từng bạn, xin ý kiến thầy cô", "Cùng tập luyện, biểu diễn và rút kinh nghiệm"]}], "loi": "Lớp em sẽ chọn tiết mục gì cho 20/11? Em nhận phần việc nào?"}, {"id": "c3-t6", "cd": 3, "trang": "tr.19", "nhan": "Tình huống 3", "ten": "Hai chị em tự lo việc nhà", "canh": {"nen": "bep", "nguoi": [{"x": 170, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 260, "ao": "#facc15", "toc": "buoc", "cam": "vui", "to": 0.75}], "vat": [["noi-com", 70, 175], ["choi", 330, 150]], "loi": []}, "tom": "Cuối tuần, bố mẹ Lan đi công tác, ở nhà chỉ có hai chị em. Chị em Lan phải tự sắp xếp công việc nhà trong những ngày đó.", "nv": [{"loai": "chon-nhieu", "hoi": "Chọn TẤT CẢ việc làm thể hiện trách nhiệm của chị em Lan.", "chon": [{"t": "Liệt kê các việc cần làm trong hai ngày", "d": 1, "g": "Biết lên kế hoạch."}, {"t": "Chia việc cho em theo sức, cùng nhau làm", "d": 1, "g": "Phân công hợp lí."}, {"t": "Giữ liên lạc với bố mẹ", "d": 1, "g": "Để bố mẹ yên tâm, có việc cần thì hỏi ngay."}, {"t": "Tắt bếp, khoá cửa cẩn thận (gợi ý thêm ngoài SGK)", "d": 1, "g": "Giữ an toàn khi ở nhà không có người lớn."}, {"t": "Để hết việc cho em vì mình còn phải học bài", "d": 0, "g": "Đùn đẩy hết việc cho em là chưa công bằng, chưa có trách nhiệm."}, {"t": "Để dồn việc, chờ bố mẹ về làm", "d": 0, "g": "Bỏ mặc việc nhà là chưa có trách nhiệm."}]}], "loi": "Lập nhanh danh sách 3 việc nhà em sẽ làm vào cuối tuần này."}, {"id": "c3-t7", "cd": 3, "trang": "tr.20", "nhan": "Tình huống 1", "ten": "Hoàng căng thẳng mùa thi", "canh": {"nen": "phonghoc", "nguoi": [{"x": 200, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}], "vat": [["sach", 120, 190], ["sach", 280, 190], ["dong-ho", 340, 60]], "loi": [[220, 40, "Ôn mãi không hết…"]]}, "tom": "Chuẩn bị kiểm tra cuối học kì, Hoàng phải ôn nhiều môn cùng lúc. Ngày nào Hoàng cũng tận dụng tối đa thời gian để học. Gần 2 tuần nay, Hoàng luôn trong tình trạng căng thẳng.", "nv": [{"loai": "chon", "hoi": "Em là nhà tư vấn. Lời khuyên nào phù hợp nhất cho Hoàng?", "chon": [{"t": "Uống thật nhiều cà phê để thức khuya ôn cho hết.", "d": 0, "g": "Thiếu ngủ làm căng thẳng tăng và học kém hiệu quả."}, {"t": "Lập kế hoạch ôn từng môn, chia nhỏ, xen nghỉ ngơi, ngủ đủ, vận động nhẹ; tâm sự với người thân.", "d": 1, "g": "Lời khuyên vừa có kế hoạch học, vừa có thư giãn và chia sẻ, đúng các cách ứng phó SGK gợi ý."}, {"t": "Bỏ bớt môn khó, chỉ ôn môn mình thích.", "d": 0, "g": "Né tránh không giải quyết được nguyên nhân gây căng thẳng."}, {"t": "Cố chịu đựng, thi xong sẽ hết.", "d": 0, "g": "Căng thẳng kéo dài ảnh hưởng sức khoẻ. Cần chủ động ứng phó."}]}, {"loai": "xep", "hoi": "Sắp xếp các bước ứng phó với căng thẳng.", "buoc": ["Xác định điều gì khiến mình căng thẳng và vì sao", "Chọn cách ứng phó phù hợp (kế hoạch, thư giãn…)", "Thực hiện, và chia sẻ với người thân, thầy cô khi cần"]}], "loi": "Mùa thi, em thường làm gì để bớt căng thẳng?"}, {"id": "c3-t8", "cd": 3, "trang": "tr.21", "nhan": "Tình huống 2", "ten": "Tú bị doạ trên mạng", "an_toan": 1, "canh": {"nen": "mang", "nguoi": [{"x": 110, "ao": "#0ea5e9", "toc": "ngan", "cam": "lo"}], "vat": [["canh-bao", 330, 60]], "loi": []}, "tom": "Tú bị một số học sinh lớp khác doạ sẽ tung các thông tin xấu về mình lên mạng xã hội. Tú rất lo lắng vì không biết chuyện gì sẽ xảy ra.", "nv": [{"loai": "chon", "hoi": "Em là nhà tư vấn. Tú nên làm gì?", "chon": [{"t": "Đe doạ lại để các bạn kia sợ.", "d": 0, "g": "Đáp trả làm sự việc căng thẳng hơn và có thể khiến Tú gặp nguy hiểm."}, {"t": "Báo ngay cho cha mẹ, thầy cô chủ nhiệm; lưu lại tin nhắn đe doạ làm bằng chứng.", "d": 1, "g": "Đúng. Bị đe doạ là việc người lớn phải biết và cùng xử lí. Tú không phải tự chịu một mình."}, {"t": "Gửi tiền hoặc đồ để các bạn thôi không đăng.", "d": 0, "g": "Chiều theo người đe doạ thường khiến họ đòi tiếp. Hãy báo người lớn."}, {"t": "Giấu kín, tự chịu đựng vì sợ bị lộ chuyện.", "d": 0, "g": "Giữ kín một mình làm Tú thêm lo sợ. Người lớn sẽ giúp Tú an toàn."}]}, {"loai": "xep", "hoi": "Sắp xếp những việc Tú cần làm.", "buoc": ["Giữ bình tĩnh, không đáp trả, không tự đi gặp để thương lượng", "Chụp màn hình, lưu lại tin nhắn đe doạ", "Báo ngay cho cha mẹ và thầy cô chủ nhiệm", "Cùng người lớn chặn, báo cáo tài khoản; nhà trường xử lí"]}], "loi": "Nếu bạn thân của em gặp chuyện như Tú, em sẽ nói gì với bạn?"}, {"id": "c3-t9", "cd": 3, "trang": "tr.21", "nhan": "Tình huống 3", "ten": "Linh làm tổ trưởng", "canh": {"nen": "lop", "nguoi": [{"x": 130, "ao": "#ec4899", "toc": "buoc", "cam": "lo"}, {"x": 240, "ao": "#3b82f6", "toc": "ngan", "cam": "gian"}, {"x": 320, "ao": "#22c55e", "toc": "ngan", "cam": "gian"}], "vat": [["giay", 75, 190]], "loi": [[280, 40, "Lại ghi tên tớ à?"]]}, "tom": "Linh được cô chủ nhiệm giao làm tổ trưởng. Trước mỗi buổi học, Linh kiểm tra và ghi tên những bạn không làm bài tập về nhà. Một số bạn khó chịu, gây khó khăn và không muốn chơi với Linh. Linh thấy rất áp lực.", "nv": [{"loai": "chon", "hoi": "Em là nhà tư vấn. Lời khuyên nào giúp Linh vừa giữ trách nhiệm, vừa bớt áp lực?", "chon": [{"t": "Ghi thiếu tên các bạn thân để các bạn khỏi giận.", "d": 0, "g": "Ghi sai là không trung thực và không công bằng với cả tổ."}, {"t": "Nói chuyện cởi mở: việc kiểm tra là để cả tổ tiến bộ; nhắc bạn trước giờ học, giúp bạn làm bài; xin ý kiến cô về cách làm.", "d": 1, "g": "Linh vẫn làm tròn nhiệm vụ, lại được các bạn hiểu và được cô hỗ trợ."}, {"t": "Xin cô cho thôi làm tổ trưởng.", "d": 0, "g": "Bỏ nhiệm vụ không giải quyết được áp lực. Hãy thử trao đổi với các bạn và cô trước."}, {"t": "Ghi tên thật nhiều để “trả đũa” các bạn.", "d": 0, "g": "Lợi dụng nhiệm vụ để trả đũa làm mâu thuẫn tăng và sai trách nhiệm."}]}], "loi": "Em sẽ nói gì để các bạn trong tổ hiểu và ủng hộ Linh?"}, {"id": "c4-t1", "cd": 4, "trang": "tr.23", "nhan": "Tình huống", "ten": "Huy và trái bóng", "canh": {"nen": "sanbong", "nguoi": [{"x": 170, "ao": "#ef4444", "toc": "ngan", "cam": "vui"}, {"x": 270, "ao": "#ef4444", "toc": "ngan", "cam": "vui"}], "vat": [["bong", 220, 215], ["cup", 340, 170]], "loi": [[220, 40, "Cố lên Huy!"]]}, "tom": "Từ nhỏ Huy mặc cảm vì dáng người gầy yếu. Thấy bóng đá giúp nâng cao sức khoẻ, Huy tâm sự với bố mẹ và được ủng hộ. Huy vào câu lạc bộ bóng đá, chăm chỉ tập hằng tuần, được các bạn động viên. Thể lực Huy tốt lên, đội còn giành giải Ba hội thao cụm trường.", "nv": [{"loai": "chon-nhieu", "hoi": "Chọn TẤT CẢ cách Huy đã tạo động lực cho bản thân.", "chon": [{"t": "Hiểu ý nghĩa của bóng đá với sức khoẻ, vóc dáng", "d": 1, "g": "Hiểu ý nghĩa của hoạt động."}, {"t": "Tâm sự với bố mẹ và được ủng hộ", "d": 1, "g": "Tìm sự ủng hộ từ người thân."}, {"t": "Tham gia câu lạc bộ cùng sở thích", "d": 1, "g": "Tham gia nhóm có cùng sở thích."}, {"t": "Thấy kết quả, cảm thấy vui và tự hào", "d": 1, "g": "Ghi nhận thành quả của mình."}, {"t": "Chỉ tập khi thấy có hứng", "d": 0, "g": "Huy chăm chỉ tập đều đặn hằng tuần."}]}], "loi": "Em muốn tạo động lực để làm việc gì? Em sẽ bắt đầu từ bước nhỏ nào?"}, {"id": "c4-t2", "cd": 4, "trang": "tr.23", "nhan": "Tình huống 1", "ten": "Bảo ngại đám đông", "canh": {"nen": "sankhau", "nguoi": [{"x": 200, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}], "vat": [["mic", 260, 160]], "loi": [[230, 40, "Đông người quá…"]]}, "tom": "Trường Bảo sắp tổ chức diễn đàn về chủ đề “Phòng chống bạo lực học đường”. Bảo được phân công trình bày tham luận trước diễn đàn. Tính Bảo vốn nhút nhát, ngại đứng trước đám đông nên rất lo lắng.", "nv": [{"loai": "chon", "hoi": "Đề xuất cách tạo động lực cho Bảo.", "chon": [{"t": "Xin đổi cho bạn khác trình bày.", "d": 0, "g": "Né tránh làm Bảo mất cơ hội rèn luyện sự tự tin."}, {"t": "Hiểu ý nghĩa bài tham luận; viết dàn ý; tập nói trước gương rồi trước nhóm bạn; tự động viên “mình đã chuẩn bị kĩ”.", "d": 1, "g": "Hiểu ý nghĩa, chia nhỏ nhiệm vụ và tự khích lệ là cách tạo động lực SGK gợi ý."}, {"t": "Cầm giấy đọc nguyên văn, không cần tập.", "d": 0, "g": "Không chuẩn bị thì càng dễ run khi đứng trước đám đông."}, {"t": "Thức đêm trước diễn đàn học thuộc lòng cả bài.", "d": 0, "g": "Dồn vào phút cuối làm Bảo mệt và căng thẳng hơn."}]}], "loi": "Em có mẹo nào giúp mình bớt run khi nói trước lớp?"}, {"id": "c4-t3", "cd": 4, "trang": "tr.24", "nhan": "Tình huống 2", "ten": "Trúc ngại dọn nhà", "canh": {"nen": "nha", "nguoi": [{"x": 200, "ao": "#ec4899", "toc": "dai", "cam": "chan"}], "vat": [["choi", 260, 150], ["quan-ao", 110, 205]], "loi": [[220, 40, "Mệt quá, không muốn làm…"]]}, "tom": "Trúc được mẹ giao lau dọn nhà cửa hằng tuần. Mỗi lần dọn dẹp mất rất nhiều thời gian, công sức nên Trúc thấy ngại, không muốn làm.", "nv": [{"loai": "chon", "hoi": "Đề xuất cách tạo động lực cho Trúc.", "chon": [{"t": "Dồn hết vào Chủ nhật làm một lần cho xong.", "d": 0, "g": "Dồn việc càng làm Trúc thấy nặng nề, ngại hơn."}, {"t": "Làm qua loa cho nhanh.", "d": 0, "g": "Làm qua loa thì nhà không sạch, lại không hình thành thói quen tốt."}, {"t": "Hiểu việc mình giúp mẹ đỡ vất vả; chia nhỏ việc theo ngày; vừa làm vừa nghe nhạc; tự thưởng khi xong.", "d": 1, "g": "Hiểu ý nghĩa, chia nhỏ việc, tìm niềm vui khi làm là các cách tạo động lực SGK gợi ý."}, {"t": "Nhờ em làm thay.", "d": 0, "g": "Đẩy việc cho người khác không tạo được động lực cho chính mình."}]}], "loi": "Việc nhà nào em thấy ngại nhất? Em sẽ làm gì để thấy vui hơn khi làm?"}, {"id": "c4-t4", "cd": 4, "trang": "tr.24", "nhan": "Tình huống 3", "ten": "Dung và môn Tiếng Anh", "canh": {"nen": "lop", "bang": "Hello! English", "nguoi": [{"x": 160, "ao": "#a855f7", "toc": "dai", "cam": "lo"}, {"x": 270, "ao": "#3b82f6", "toc": "ngan", "cam": "vui"}], "vat": [["sach", 215, 205]], "loi": [[150, 40, "Mình theo kịp không nhỉ?"]]}, "tom": "Dung mới chuyển đến một trường ở thành phố. Các bạn lớp mới học rất tốt môn Tiếng Anh. Dung lo lắng vì sợ mình không theo kịp.", "nv": [{"loai": "chon", "hoi": "Đề xuất cách tạo động lực cho Dung.", "chon": [{"t": "Tránh phát biểu giờ Tiếng Anh để khỏi bị chê.", "d": 0, "g": "Né tránh khiến Dung càng khó tiến bộ."}, {"t": "Tự nhủ mình không có năng khiếu ngoại ngữ.", "d": 0, "g": "Suy nghĩ tiêu cực làm mất động lực. Hãy tự động viên, khích lệ bản thân."}, {"t": "Học dồn thật nhiều trong một tuần cho bằng các bạn.", "d": 0, "g": "Học dồn dễ mệt, nhanh chán, khó duy trì."}, {"t": "Hiểu ích lợi của tiếng Anh; đặt mục tiêu nhỏ mỗi ngày; nhờ bạn kèm, vào câu lạc bộ; ghi lại tiến bộ.", "d": 1, "g": "Chia nhỏ mục tiêu, tìm nhóm cùng sở thích, ghi nhận kết quả là cách tạo động lực SGK gợi ý."}]}], "loi": "Môn nào em đang thấy khó? Mục tiêu nhỏ mỗi ngày của em là gì?"}, {"id": "c4-t5", "cd": 4, "trang": "tr.24", "nhan": "Trường hợp", "ten": "Ngân sách của Trang", "canh": {"nen": "tien", "nguoi": [{"x": 110, "ao": "#10b981", "toc": "dai", "cam": "vui"}], "vat": [["dong-xu", 240, 190], ["heo", 320, 180]], "loi": []}, "tom": "Mỗi tháng mẹ cho Trang 200 000 đồng ăn sáng, tiêu vặt; Trang cộng tác bán hàng trên mạng được thêm 200 000 đồng. Cuối năm học, Trang được thưởng 500 000 đồng. Trang định dành 60% cho nhu cầu thiết yếu, 10% mua quà, 5% làm từ thiện, 5% cho sở thích và 20% tiết kiệm.", "nv": [{"loai": "phan-loai", "hoi": "Xếp mỗi khoản của Trang vào đúng nhóm.", "thung": ["Thu", "Chi", "Cho, tặng", "Tiết kiệm"], "the": [{"t": "Mẹ cho 200 000 đ/tháng", "th": 0, "g": "Khoản thu."}, {"t": "Bán hàng trên mạng 200 000 đ/tháng", "th": 0, "g": "Khoản thu từ công sức của Trang."}, {"t": "Thưởng cuối năm 500 000 đ", "th": 0, "g": "Khoản thu."}, {"t": "Ăn sáng, uống nước (60%)", "th": 1, "g": "Chi cho nhu cầu thiết yếu."}, {"t": "Đi chơi, xem phim (5%)", "th": 1, "g": "Chi cho sở thích."}, {"t": "Quà sinh nhật, quà tặng (10%)", "th": 2, "g": "Khoản cho, tặng."}, {"t": "Làm từ thiện (5%)", "th": 2, "g": "Khoản cho, tặng."}, {"t": "Để dành (20%)", "th": 3, "g": "Khoản tiết kiệm."}]}, {"loai": "ngan-sach", "hoi": "Đặt đúng tỉ lệ của Trang cho số tiền mỗi tháng.", "thu": 400000, "nguon": "200 000 (mẹ cho) + 200 000 (bán hàng)", "dich": [60, 5, 15, 20]}], "loi": "Nếu là Trang, em có muốn đổi tỉ lệ nào không? Vì sao?"}, {"id": "c4-t6", "cd": 4, "trang": "tr.25", "nhan": "Tình huống 1", "ten": "Ngân ở làng gốm", "canh": {"nen": "xuonggom", "nguoi": [{"x": 150, "ao": "#f97316", "toc": "dai", "cam": "vui"}, {"x": 250, "ao": "#64748b", "toc": "bac", "cam": "vui", "vai": "nguoi-lon"}], "vat": [["binh-gom", 330, 190], ["binh-gom", 60, 195]], "loi": []}, "tom": "Làng của Ngân làm gốm. Đi học về sớm, Ngân dành 1 giờ phụ bác sắp xếp sản phẩm, dọn cửa hàng. Chủ nhật, Ngân đến xưởng của bác hướng dẫn khách du lịch trải nghiệm làm gốm. Mỗi tháng, bác cho Ngân 1 000 000 đồng.", "nv": [{"loai": "ngan-sach", "hoi": "Lập ngân sách tháng hợp lí cho Ngân.", "thu": 1000000, "nguon": "Bác cho 1 000 000 đ/tháng"}], "loi": "Ngân nên dành khoản cho, tặng để làm gì? Gợi ý cho Ngân một món quà ý nghĩa."}, {"id": "c4-t7", "cd": 4, "trang": "tr.25", "nhan": "Tình huống 2", "ten": "Thắng ở trang trại", "canh": {"nen": "trangtrai", "nguoi": [{"x": 180, "ao": "#16a34a", "toc": "ngan", "cam": "vui"}], "vat": [["ga", 280, 215], ["ga", 330, 220], ["dien-thoai", 230, 150]], "loi": []}, "tom": "Nhà Thắng có trang trại cây ăn quả và chăn nuôi. Ngoài giờ học, Thắng giúp bố mẹ chăm sóc vật nuôi, cây trồng, dựng phim ngắn quảng cáo sản phẩm trên mạng xã hội. Mỗi tháng bố mẹ thưởng Thắng 300 000 đồng (chăm sóc) và 200 000 đồng (quảng cáo, bán hàng).", "nv": [{"loai": "ngan-sach", "hoi": "Lập ngân sách tháng hợp lí cho Thắng.", "thu": 500000, "nguon": "300 000 (chăm sóc) + 200 000 (quảng cáo)"}], "loi": "Thắng có thể tiết kiệm để làm gì có ích cho việc học hoặc cho trang trại?"}, {"id": "c5-t1", "cd": 5, "trang": "tr.29", "nhan": "Tình huống 1", "ten": "Chung phòng với em", "canh": {"nen": "nha", "nguoi": [{"x": 160, "ao": "#ec4899", "toc": "dai", "cam": "gian"}, {"x": 260, "ao": "#facc15", "toc": "buoc", "cam": "lo", "to": 0.8}], "vat": [["quan-ao", 320, 210], ["quan-ao", 80, 215]], "loi": [[160, 40, "Sao em lại bày bừa nữa?"]]}, "tom": "Hai chị em Hương ở chung một phòng. Hương ngăn nắp, gọn gàng; em gái thì thường xuyên bày bừa đồ dùng, quần áo khắp phòng khiến Hương phải thu dọn. Nhiều lần như vậy, Hương rất bực mình và khó chịu với em.", "nv": [{"loai": "chon", "hoi": "Hương nên làm gì?", "chon": [{"t": "Quát em và dồn hết đồ của em ra một góc.", "d": 0, "g": "Quát mắng làm em sợ hoặc giận, bất đồng không được giải quyết."}, {"t": "Mách bố mẹ phạt em.", "d": 0, "g": "Chưa tự nói chuyện với em đã nhờ người phạt thì dễ làm tình cảm chị em xa cách."}, {"t": "Nói chuyện nhẹ nhàng với em, chia sẻ cảm xúc của mình; cùng thống nhất góc đồ dùng và lịch dọn phòng.", "d": 1, "g": "Hương chủ động trao đổi, lắng nghe, cùng em tìm cách giải quyết, đúng 3 bước SGK."}, {"t": "Cứ âm thầm dọn, giữ bực trong lòng.", "d": 0, "g": "Không nói ra thì em không biết để thay đổi, Hương lại càng bực."}]}, {"loai": "xep", "hoi": "Sắp xếp 3 bước giải quyết bất đồng (SGK tr.28).", "buoc": ["Tìm hiểu nguyên nhân: vì sao em hay bày bừa", "Đề xuất cách giải quyết: chia góc đồ dùng, lịch dọn phòng", "Cùng nhau giải quyết: hai chị em thống nhất và nhắc nhau làm"]}], "loi": "Viết câu mở đầu Hương có thể nói với em để cuộc nói chuyện vui vẻ."}, {"id": "c5-t2", "cd": 5, "trang": "tr.29", "nhan": "Tình huống 2", "ten": "Lan thấy chưa công bằng", "canh": {"nen": "nha", "nguoi": [{"x": 110, "ao": "#a855f7", "toc": "buoc", "cam": "binh", "vai": "nguoi-lon"}, {"x": 220, "ao": "#ec4899", "toc": "dai", "cam": "buon"}, {"x": 320, "ao": "#3b82f6", "toc": "ngan", "cam": "lo"}], "vat": [["sach", 345, 200]], "loi": [[230, 40, "Sao anh làm ít việc hơn con?"]]}, "tom": "Năm nay anh Nam học lớp 12, bài tập nhiều nên bố mẹ phân công cho anh ít việc nhà hơn Lan. Lan rất ấm ức vì cho rằng bố mẹ thiên vị anh.", "nv": [{"loai": "chon", "hoi": "Lan nên làm gì?", "chon": [{"t": "Bỏ không làm việc nhà nữa cho công bằng.", "d": 0, "g": "Phản ứng như vậy làm cả nhà thêm căng thẳng."}, {"t": "Giận dỗi, không nói chuyện với anh.", "d": 0, "g": "Anh Nam không có lỗi; giận dỗi chỉ làm tình cảm anh em xấu đi."}, {"t": "Chủ động hỏi bố mẹ lí do, lắng nghe; đề nghị anh giúp việc khi rảnh; cả nhà thống nhất lại.", "d": 1, "g": "Lan tìm hiểu nguyên nhân, không quy kết, cùng gia đình tìm cách giải quyết."}, {"t": "Kể với bạn bè là bố mẹ thiên vị.", "d": 0, "g": "Kể chuyện nhà ra ngoài khi chưa hiểu rõ không giải quyết được bất đồng."}]}, {"loai": "xep", "hoi": "Sắp xếp 3 bước giải quyết bất đồng (SGK tr.28).", "buoc": ["Tìm hiểu nguyên nhân: hỏi bố mẹ vì sao phân công như vậy", "Đề xuất cách giải quyết: anh giúp việc khi rảnh, kèm Lan học", "Cùng nhau giải quyết: cả nhà thống nhất lại phân công"]}], "loi": "Gia đình em phân công việc nhà thế nào? Em có đề xuất gì?"}, {"id": "c6-t1", "cd": 6, "trang": "tr.35", "nhan": "Tình huống 1", "ten": "Chương trình “Vẻ đẹp tháng 3”", "canh": {"nen": "nhavanhoa", "nguoi": [{"x": 110, "ao": "#ec4899", "toc": "dai", "cam": "vui"}, {"x": 190, "ao": "#a855f7", "toc": "buoc", "cam": "vui", "vai": "nguoi-lon"}, {"x": 270, "ao": "#0ea5e9", "toc": "ngan", "cam": "vui"}, {"x": 340, "ao": "#f97316", "toc": "bac", "cam": "vui", "vai": "nguoi-lon"}], "vat": [["hoa", 40, 200], ["not-nhac", 230, 60]], "loi": []}, "tom": "Chào mừng ngày Quốc tế Phụ nữ 8/3, Hội Phụ nữ kết hợp với Đoàn Thanh niên xã tổ chức chương trình “Vẻ đẹp tháng 3”. Chiều tối hằng ngày, Vân Anh cùng các bạn và các cô, các bác trong xóm ra nhà văn hoá cùng nhau luyện tập.", "nv": [{"loai": "phan-loai", "hoi": "Chỉ ra mạng lưới quan hệ cộng đồng: xếp vào đúng nhóm.", "thung": ["Tổ chức", "Cá nhân", "Cách thức hoạt động"], "the": [{"t": "Hội Phụ nữ xã", "th": 0, "g": "Tổ chức đứng ra phối hợp."}, {"t": "Đoàn Thanh niên xã", "th": 0, "g": "Tổ chức cùng phối hợp."}, {"t": "Vân Anh và các bạn", "th": 1, "g": "Cá nhân tham gia."}, {"t": "Các cô, các bác trong xóm", "th": 1, "g": "Cá nhân tham gia."}, {"t": "Cùng luyện tập chiều tối ở nhà văn hoá", "th": 2, "g": "Cách thức hoạt động của mạng lưới."}]}], "loi": "Ở nơi em sống có hoạt động cộng đồng nào? Những ai cùng tham gia?"}, {"id": "c6-t2", "cd": 6, "trang": "tr.35", "nhan": "Tình huống 2", "ten": "Nhóm thiện nguyện lớp 9C", "canh": {"nen": "duonglang", "nguoi": [{"x": 120, "ao": "#eab308", "toc": "dai", "cam": "vui"}, {"x": 200, "ao": "#3b82f6", "toc": "ngan", "cam": "vui"}, {"x": 290, "ao": "#64748b", "toc": "bac", "cam": "vui", "vai": "nguoi-lon"}], "vat": [["hop-qua", 245, 200], ["heart", 330, 60]], "loi": []}, "tom": "Hương, lớp trưởng lớp 9C, lập một nhóm thiện nguyện giúp các gia đình có hoàn cảnh khó khăn trong thôn. Nhiều bạn trong lớp tham gia, nhiệt tình quyên góp và vận động người thân, cộng đồng cùng tham gia.", "nv": [{"loai": "phan-loai", "hoi": "Chỉ ra mạng lưới quan hệ cộng đồng: xếp vào đúng nhóm.", "thung": ["Người tham gia", "Đóng góp, cách thức hoạt động"], "the": [{"t": "Hương, người khởi xướng", "th": 0, "g": "Người lập nhóm."}, {"t": "Các bạn trong lớp", "th": 0, "g": "Thành viên của nhóm."}, {"t": "Người thân, cộng đồng", "th": 0, "g": "Được vận động cùng tham gia."}, {"t": "Quyên góp giúp gia đình khó khăn", "th": 1, "g": "Đóng góp của mạng lưới."}, {"t": "Vận động người thân, cộng đồng", "th": 1, "g": "Cách mở rộng mạng lưới."}]}], "loi": "Nếu lớp em lập nhóm thiện nguyện, em sẽ mời thêm ai cùng tham gia?"}, {"id": "c6-t3", "cd": 6, "trang": "tr.36", "nhan": "Trường hợp 1", "ten": "Nồi cháo yêu thương", "canh": {"nen": "benhvien", "nguoi": [{"x": 70, "ao": "#eab308", "toc": "dai", "cam": "vui"}, {"x": 150, "ao": "#3b82f6", "toc": "ngan", "cam": "vui"}], "vat": [["noi-chao", 220, 205]], "loi": []}, "tom": "Trường THCS Bình Minh nằm gần bệnh viện huyện. Hằng ngày đi học, Thư thấy nhiều bệnh nhân có hoàn cảnh khó khăn nên muốn lập nhóm tình nguyện nấu cháo từ thiện. Nhưng Thư chưa biết bắt đầu thế nào.", "nv": [{"loai": "xep", "hoi": "Sắp xếp 4 bước giúp Thư xây dựng mạng lưới (SGK tr.35).", "buoc": ["Xác định hoạt động, mục đích: nấu cháo giúp bệnh nhân khó khăn", "Xác định người, tổ chức tham gia: bạn bè, thầy cô, Đoàn trường, phụ huynh", "Kết nối: họp nhóm, lập nhóm liên lạc, phân công nấu và phát cháo", "Duy trì: lịch trực cố định, công khai thu chi, cảm ơn người đóng góp"]}], "loi": "Em có thể góp gì cho nhóm “Nồi cháo yêu thương” của Thư?"}, {"id": "c6-t4", "cd": 6, "trang": "tr.36", "nhan": "Trường hợp 2", "ten": "Thư viện của xóm", "canh": {"nen": "thuvien", "nguoi": [{"x": 160, "ao": "#eab308", "toc": "buoc", "cam": "vui"}, {"x": 260, "ao": "#22c55e", "toc": "ngan", "cam": "vui", "to": 0.7}], "vat": [["sach", 215, 205]], "loi": [[170, 40, "Cùng đọc sách nhé!"]]}, "tom": "Chúc yêu thích đọc sách, mong lập một thư viện trong xóm để mọi người, nhất là các bạn nhỏ, có thói quen đọc sách. Chúc băn khoăn chưa biết làm thế nào để xây dựng mạng lưới những người yêu sách.", "nv": [{"loai": "xep", "hoi": "Sắp xếp 4 bước giúp Chúc xây dựng mạng lưới (SGK tr.35).", "buoc": ["Xác định hoạt động, mục đích: thư viện xóm, tạo thói quen đọc", "Xác định người tham gia: người yêu sách, các bạn nhỏ, trưởng thôn", "Kết nối: vận động quyên góp sách, mượn phòng ở nhà văn hoá", "Duy trì: lịch mở cửa, giờ đọc truyện cuối tuần"]}], "loi": "Em sẽ góp cuốn sách nào cho thư viện của Chúc? Vì sao?"}, {"id": "c9-t1", "cd": 9, "trang": "tr.57", "nhan": "Hoạt động 3", "ten": "Tham vấn thầy cô", "canh": {"nen": "phongtuvan", "nguoi": [{"x": 130, "ao": "#6366f1", "toc": "ngan", "cam": "binh", "vai": "gv"}, {"x": 270, "ao": "#0ea5e9", "toc": "ngan", "cam": "lo"}], "vat": [["sach", 200, 175]], "loi": [[270, 35, "Em muốn học tiếp nhưng nhà khó khăn…"]]}, "tom": "Một bạn lớp 9 đến gặp thầy: bạn rất muốn học tiếp lên THPT để vào đại học, nhưng hoàn cảnh gia đình rất khó khăn.", "nv": [{"loai": "chon", "hoi": "Câu hỏi nào bạn nên chuẩn bị để tham vấn thầy hiệu quả?", "chon": [{"t": "Thầy quyết định giúp em nên học gì ạ.", "d": 0, "g": "Người tham vấn chỉ gợi ý. Bạn cần tự suy nghĩ và cùng gia đình ra quyết định."}, {"t": "Với học lực và hoàn cảnh của em, em có những con đường nào? Có chính sách hỗ trợ nào em nên tìm hiểu?", "d": 1, "g": "Câu hỏi nêu rõ vướng mắc, gắn với bản thân, giúp thầy tư vấn đúng."}, {"t": "Trường nào dễ đỗ nhất ạ?", "d": 0, "g": "Câu hỏi chưa gắn với khả năng, mong muốn và hoàn cảnh của bạn."}, {"t": "Bạn thân em học đâu thì em học đó được không ạ?", "d": 0, "g": "Chọn theo bạn bè dễ không phù hợp với bản thân."}]}, {"loai": "xep", "hoi": "Sắp xếp các lưu ý để tham vấn hiệu quả (SGK tr.56).", "buoc": ["Trước khi gặp: xác định vướng mắc, chuẩn bị câu hỏi", "Khi gặp: trình bày rõ lí do, vấn đề cần tham vấn", "Trong khi tham vấn: lắng nghe, thực hiện nghiêm túc yêu cầu", "Sau tham vấn: suy nghĩ, tự ra quyết định cùng gia đình"]}], "loi": "Em muốn tham vấn ai về con đường sau THCS? Em sẽ hỏi câu gì đầu tiên?"}]};

    + '<div class="kinh" style="padding:18px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="font-size:34px">📊</div><div><h2 style="margin:0">Bảng của thầy cô</h2><div style="color:var(--chu2);font-weight:600">Dữ liệu nằm trong trình duyệt của máy này. Cuối tuần nhớ bấm “Sao lưu”.</div></div><button class="nut phu" style="margin-left:auto" onclick="diToi(\'trang-chu\')">← Trang chủ</button></div>'

    + '<div class="hang-nut" style="justify-content:flex-start"><button class="nut" onclick="xuatCSV()">⬇ Xuất kết quả (CSV)</button><button class="nut" onclick="xuatLoi()">⬇ Xuất lời của em (CSV)</button><button class="nut phu" onclick="saoLuu()">💾 Sao lưu</button><label class="nut phu" style="display:inline-flex;align-items:center">📂 Nhập sao lưu<input type="file" accept=".json" style="display:none" onchange="nhapSaoLuu(this)"></label><button class="nut phu" onclick="xoaDL()">🗑 Xoá dữ liệu</button></div></div>';

function veBieuDo(tk) {
  var cv = document.getElementById("bieuDo"), r = cv.getBoundingClientRect(), dp = window.devicePixelRatio || 1;
  cv.width = r.width * dp; cv.height = r.height * dp; var x = cv.getContext("2d"); x.scale(dp, dp);
  var W = r.width, H = r.height, L = 40, B = 46, n = DL.tinh_huong.length, bw = (W - L - 10) / n;

function oCSV(v) { v = String(v == null ? "" : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function ngayTen() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
